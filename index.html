<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>FRIENDLYFIRE CO. | V96 PRE-ORDER</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <style>
        /* --- CORE DESIGN --- */
        :root { --red: #ff3a3a; --bg-pongo: #2e4a1e; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; outline: none; }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; 
            font-family: 'Press Start 2P', cursive; 
            background: var(--bg-pongo) url('sfondo_pongo.PNG') repeat fixed center; 
            background-size: 450px; overscroll-behavior: none; position: fixed; 
        }

        /* --- LOADER --- */
        #loader-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #ffffff; z-index: 999999; 
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .gif-loader-container { width: 320px; height: 320px; display: flex; justify-content: center; align-items: center; margin-bottom: -10px; }
        #loader-gif { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: screen; filter: contrast(1.2) saturate(1.2); }
        .loading-text { font-size: 9px; letter-spacing: 2px; margin-bottom: 12px; color: #000; }
        .bar-outer { width: 200px; height: 16px; border: 3px solid #000; padding: 2px; background: #fff; }
        #bar-fill { width: 0%; height: 100%; background: #000; transition: width 0.1s linear; }
        #start-btn { display: none; margin-top: 15px; }

        /* --- HEADER --- */
        header { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; position: absolute; top: 0; width: 100%; 
            z-index: 10000; pointer-events: none; 
        }
        .pongo-btn { 
            width: 65px; height: 65px; object-fit: contain; 
            cursor: pointer; pointer-events: auto; 
            filter: drop-shadow(0 4px 0 rgba(0,0,0,0.5)); 
            transition: transform 0.1s; 
        }
        .pongo-btn:active { transform: scale(0.9) translateY(5px); }
        
        .tank-wrapper { position: relative; pointer-events: auto; }
        #tank-badge { 
            position: absolute; top: 0; right: -5px; 
            background: var(--red); color: white; border: 2px solid #000; 
            font-size: 8px; padding: 4px; border-radius: 50%; 
            min-width: 20px; text-align: center; display: none; 
        }

        /* --- SHOP --- */
        #shop-slider { width: 100vw; height: 100%; display: flex; overflow-x: scroll; scroll-snap-type: x mandatory; }
        #shop-slider::-webkit-scrollbar { display: none; }
        .shop-page { min-width: 100vw; height: 100%; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr); padding: 110px 15px 150px 15px; gap: 10px; scroll-snap-align: start; }
        
        .item-card { display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .item-card img { width: 80px; filter: drop-shadow(0 5px 8px rgba(0,0,0,0.6)); touch-action: none; }
        .clean-tag { font-family: sans-serif; font-weight: 800; font-size: 8px; color: #fff; text-shadow: 0 1px 3px #000; margin-top: 3px; }

        .dragging { position: fixed !important; z-index: 99999 !important; pointer-events: none; transform: scale(1.2); }
        .sucked { transform: scale(0) rotate(360deg) !important; opacity: 0 !important; transition: 0.5s ease-in !important; }

        /* --- POPUPS --- */
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 50000; flex-direction: column; align-items: center; justify-content: center; }
        
        .pixel-box { background: #fff; border: 3px solid #000; padding: 20px; width: 85%; max-width: 350px; text-align: center; box-shadow: 10px 10px 0 #000; position: relative; }
        
        .btn-pixel { background: #000; color: #fff; border: none; padding: 12px; font-family: 'Press Start 2P'; font-size: 10px; cursor: pointer; width: 100%; margin-top: 10px; display: block; }
        .btn-pixel:active { background: #333; transform: translateY(2px); }
        
        input { width: 100%; padding: 10px; font-family: 'Courier New', monospace; font-weight: bold; border: 2px solid #000; margin-bottom: 10px; text-transform: lowercase; }

        #cart-popup { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; max-width: 320px; background: #fff; border: 3px solid #000; z-index: 90000; padding: 15px; text-align: center; box-shadow: 8px 8px 0 #000; }
    </style>
</head>
<body>

    <div id="loader-overlay">
        <div class="gif-loader-container">
            <img id="loader-gif" src="loader_360.gif">
        </div>
        <div class="loading-text">LOADING WORLD...</div>
        <div class="bar-outer"><div id="bar-fill"></div></div>
        <button id="start-btn" class="btn-pixel" style="width: 200px;">ENTER WORLD</button>
    </div>

    <audio id="sfx-eat" src="suono_gnam.mp3" preload="auto"></audio>

    <header>
        <img src="mondo_pongo.PNG" class="pongo-btn" onclick="openPage('ov-newsletter')">
        <img src="fuochini_centrali.png" class="pongo-btn" onclick="openPage('ov-profile')">
        <div class="tank-wrapper">
            <img src="tank_header.PNG" class="pongo-btn" id="tank-btn" onclick="toggleCart()">
            <div id="tank-badge">0</div>
        </div>
    </header>

    <div id="shop-slider">
        <div id="page-1" class="shop-page"></div>
    </div>

    <div id="cart-popup">
        <p style="color:#000; font-size:12px; margin-bottom:15px;">IL TUO TANK</p>
        <div id="cart-list" style="font-size:9px; color:#000; text-align:left; margin-bottom:15px; min-height:50px;">
            IL CARRELLO È VUOTO
        </div>
        <div id="cart-total" style="font-size:10px; margin-bottom:15px; border-top:2px solid #000; padding-top:5px;">TOT: 0€</div>
        <button class="btn-pixel" id="btn-checkout" onclick="processPayment()">PRENOTA / ORDINA</button>
        <button class="btn-pixel" style="background:#fff; color:#000; border:2px solid #000;" onclick="toggleCart()">CHIUDI</button>
    </div>

    <div id="ov-newsletter" class="overlay">
        <div class="pixel-box">
            <h3 style="font-size:12px; margin-top:0;">JOIN THE CLUB</h3>
            <p style="font-size:8px; line-height:1.5; margin-bottom:15px;">Iscriviti per drop esclusivi e codici sconto.</p>
            <input type="email" id="newsletter-email" placeholder="la tua mail...">
            <button class="btn-pixel" onclick="subscribeNewsletter()">ISCRIVITI ORA</button>
            <button class="btn-pixel" style="background:transparent; color:#000; margin-top:5px;" onclick="closeAll()">ESCI</button>
        </div>
    </div>

    <div id="ov-profile" class="overlay" onclick="closeAll()">
        <div class="pixel-box" onclick="event.stopPropagation()">
            <p>PROFILO UTENTE</p>
            <p style="font-size:8px;">(Presto disponibile)</p>
        </div>
    </div>

    <script>
        // --- CHIAVI INTEGRATE (NON TOCCARE) ---
        const EMAILJS_PUBLIC_KEY = 'BThMV2knP0VG0s4nr';
        const EMAILJS_SERVICE_ID = 'service_4scv4hn';
        const EMAILJS_TEMPLATE_ID = 'template_8opoo1v';
        const SUPABASE_URL = 'https://jwifyapbnsbbpsrstrow.supabase.co';
        const SUPABASE_KEY = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp3aWZ5YXBibnNiYnBzcnN0cm93Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA1NzM1OTUsImV4cCI6MjA4NjE0OTU5NX0.dmhdHZRJuYo7-OlpSR3S5ca7ink9w6a5DM-u2ac4c2Y';

        // --- INIZIALIZZAZIONE ---
        (function(){ emailjs.init(EMAILJS_PUBLIC_KEY); })();
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let inventory = [
            {name:'CAP FIRE', price:45, img:'image_cap.PNG'},
            {name:'TEE PONGO', price:65, img:'image_tee.PNG'},
            {name:'STICKER', price:10, img:'image_sticker.PNG'},
            {name:'HOODIE', price:85, img:'image_hoodie.PNG'},
            {name:'PANT', price:70, img:'image_pant.PNG'},
            {name:'SOCKS', price:15, img:'image_socks.PNG'}
        ];
        let cart = [];

        window.onload = () => {
            renderShop();
            let p = 0;
            const interval = setInterval(() => {
                p += 2; 
                document.getElementById('bar-fill').style.width = p + '%';
                if(p >= 100) {
                    clearInterval(interval);
                    document.getElementById('start-btn').style.display = 'block';
                }
            }, 30);
        };

        document.getElementById('start-btn').onclick = () => document.getElementById('loader-overlay').style.display='none';

        function renderShop() {
            const container = document.getElementById('page-1');
            container.innerHTML = inventory.map((item, i) => `
                <div class="item-card" id="item-${i}" onpointerdown="startDrag(event, ${i})">
                    <img src="${item.img}" draggable="false">
                    <div class="clean-tag">${item.name}</div>
                    <div class="clean-tag">${item.price}€</div>
                </div>
            `).join('');
        }

        // --- DRAG & DROP ---
        function startDrag(e, index) {
            const card = document.getElementById(`item-${index}`);
            const rect = card.getBoundingClientRect();
            const clone = card.cloneNode(true);
            clone.classList.add('dragging');
            clone.style.width = rect.width + 'px';
            clone.style.left = rect.left + 'px';
            clone.style.top = rect.top + 'px';
            document.body.appendChild(clone);

            function move(ev) {
                clone.style.left = ev.clientX - rect.width/2 + 'px';
                clone.style.top = ev.clientY - rect.height/2 + 'px';
            }

            window.onpointermove = move;
            window.onpointerup = (ev) => {
                window.onpointermove = null;
                const tank = document.getElementById('tank-btn').getBoundingClientRect();
                const dist = Math.hypot(ev.clientX - (tank.left + tank.width/2), ev.clientY - (tank.top + tank.height/2));
                if(dist < 80) { 
                    clone.classList.add('sucked');
                    document.getElementById('sfx-eat').play();
                    setTimeout(() => {
                        cart.push(inventory[index]);
                        updateCartUI();
                        clone.remove();
                        toggleCart(true); 
                    }, 400);
                } else { clone.remove(); }
            };
        }

        function updateCartUI() {
            const b = document.getElementById('tank-badge');
            b.innerText = cart.length;
            b.style.display = cart.length > 0 ? 'block' : 'none';
            const list = document.getElementById('cart-list');
            if(cart.length === 0) list.innerHTML = "IL CARRELLO È VUOTO";
            else list.innerHTML = cart.map(i => `<div style="display:flex; justify-content:space-between; border-bottom:1px dashed #ccc; padding:2px;"><span>${i.name}</span><span>${i.price}€</span></div>`).join('');
            let total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('cart-total').innerText = "TOT: " + total + "€";
        }

        function toggleCart(forceOpen = false) {
            const p = document.getElementById('cart-popup');
            if(forceOpen) p.style.display = 'block';
            else p.style.display = (p.style.display === 'block' ? 'none' : 'block');
        }
        function openPage(id) { document.getElementById(id).style.display = 'flex'; }
        function closeAll() { document.querySelectorAll('.overlay').forEach(o => o.style.display='none'); }

        // --- NEWSLETTER ---
        async function subscribeNewsletter(manualEmail = null) {
            let email = manualEmail || document.getElementById('newsletter-email').value;
            if(!email || !email.includes('@')) { 
                if(!manualEmail) alert("Email non valida!"); 
                return false; 
            }

            // Salva su Supabase (se non esiste già)
            const { error } = await supabase.from('newsletter').insert([{ email: email }]);
            if(error && !error.message.includes('unique')) console.error("DB Err", error);

            // Invia solo se non è un checkout automatico (per non spammare)
            if(!manualEmail) {
                const btn = document.querySelector('#ov-newsletter button');
                btn.innerText = "SENDING...";
                emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, { user_email: email, message: "Welcome to FriendlyFire!" })
                .then(() => {
                    alert("ISCRITTO!");
                    btn.innerText = "ISCRIVITI ORA";
                    closeAll();
                });
            }
            return true;
        }

        // --- CHECKOUT "VETRINA" ---
        async function processPayment() {
            if(cart.length === 0) { alert("Il carrello è vuoto!"); return; }
            
            // 1. Chiediamo la mail per "Confermare l'ordine"
            let email = prompt("Inserisci la tua email per inviare la richiesta d'ordine:");
            
            if(email && email.includes('@')) {
                const btn = document.getElementById('btn-checkout');
                btn.innerText = "ELABORAZIONE...";
                
                // 2. Salviamo la mail nel DB (come lead)
                await subscribeNewsletter(email);

                // 3. Simuliamo il successo
                setTimeout(() => {
                    alert(`GRAZIE! La richiesta per ${cart.length} item è stata ricevuta.\nTi contatteremo a: ${email}`);
                    
                    // Invia notifica via EmailJS a TE STESSO (Opzionale: qui invia conferma all'utente)
                    emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, { 
                        user_email: email, 
                        message: `Richiesta Ordine: ${cart.map(i=>i.name).join(', ')} - Tot: ${document.getElementById('cart-total').innerText}` 
                    });

                    cart = [];
                    updateCartUI();
                    toggleCart();
                    btn.innerText = "PRENOTA / ORDINA";
                }, 1500);
            } else if (email) {
                alert("Email non valida, riprova.");
            }
        }
    </script>
</body>
</html>
