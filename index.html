<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FRIENDLYFIRE | V17000 REALTIME</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        /* --- 1. SETTAGGI UNIVERSALI --- */
        :root { --red: #ff3a3a; --green: #4AF626; --bg-pongo: #2e4a1e; --holo-cyan: #00f3ff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; outline: none; }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; 
            font-family: 'Press Start 2P', cursive; 
            background-color: var(--bg-pongo);
            background-image: url('sfondo2.jpg'); 
            background-size: cover; background-position: center; background-repeat: no-repeat;
            overscroll-behavior: none; position: fixed; transition: all 0.4s ease;
        }

        /* --- 2. MODALITÀ HOLOGRAM --- */
        body.hologram-mode { background-image: none !important; background-color: #050a14; }
        body.hologram-mode::after {
            content: " "; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 255, 255, 0.05) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 6px 100%; pointer-events: none; z-index: 1;
        }
        body.hologram-mode header img, body.hologram-mode footer img {
            filter: grayscale(100%) sepia(100%) hue-rotate(130deg) saturate(400%) brightness(1.5) drop-shadow(0 0 8px var(--holo-cyan)); transition: filter 0.4s ease;
        }
        body.hologram-mode .window { background: rgba(0, 15, 30, 0.9); border-color: var(--holo-cyan); color: var(--holo-cyan); box-shadow: 0 0 20px rgba(0, 243, 255, 0.2); }
        body.hologram-mode .win-h { background: rgba(0, 243, 255, 0.1); border-bottom: 1px solid var(--holo-cyan); color: var(--holo-cyan); }
        body.hologram-mode .btn { background: transparent; border: 1px solid var(--holo-cyan); color: var(--holo-cyan); }
        body.hologram-mode textarea, body.hologram-mode select { background: transparent; color: var(--holo-cyan); border: 1px solid var(--holo-cyan); }
        body.hologram-mode .label { color: var(--holo-cyan); text-shadow: 0 0 5px var(--holo-cyan); }

        /* --- 3. LOADER --- */
        #loader-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #ffffff; z-index: 2147483647; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; padding-bottom: 60px; transition: opacity 0.3s ease-out; }
        .loader-logo { width: 80%; max-width: 280px; margin-bottom: 30px; object-fit: contain; }
        .loader-gif { width: 65vw; max-width: 320px; height: auto; object-fit: contain; mix-blend-mode: multiply; margin-bottom: 30px; }
        .bar-container { width: 80%; max-width: 280px; height: 20px; background: #fff; border: 3px solid #000; padding: 2px; box-shadow: 5px 5px 0 rgba(0,0,0,0.1); }
        .bar-fill { height: 100%; width: 0%; background-color: var(--green); animation: fillLoad 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        @keyframes fillLoad { 0%{width:0%} 100%{width:100%} }
        #start-btn { visibility: hidden; background: #000; color: #fff; border: 3px solid #000; padding: 15px 40px; font-family: inherit; font-size: 12px; margin-top: 20px; cursor: pointer; text-transform: uppercase; box-shadow: 5px 5px 0 #999; pointer-events: auto !important; position: relative; z-index: 2147483647; }
        #start-btn.visible { visibility: visible; animation: flash 1s infinite alternate; }
        @keyframes flash { from{transform:scale(1)} to{transform:scale(1.05)} }
        
        .clod-mark { position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%); width: 18px; height: auto; opacity: 0.5; }
        .powered-by { position: absolute; bottom: 15px; left: 0; width: 100%; text-align: center; font-size: 6px; color: #666; letter-spacing: 1px; text-transform: uppercase; }

        @media (min-width: 1024px) { .loader-gif { width: 220px; } }

        /* --- 4. HEADER --- */
        header { position: fixed; top: 0; left: 0; width: 100%; height: 100px; z-index: 20000; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; padding-top: env(safe-area-inset-top, 10px); pointer-events: none; }
        .h-btn { width: 65px; height: 65px; object-fit: contain; pointer-events: auto; cursor: pointer; filter: drop-shadow(0 4px 0 rgba(0,0,0,0.5)); transition: transform 0.1s; }
        .h-btn:active { transform: scale(0.9); }
        .pongo-anim { animation: sq 0.3s; } @keyframes sq { 0%,100%{transform:scale(1);} 50%{transform:scale(0.8);} }
        #tank-wrapper { position: relative; pointer-events: auto; }
        #tank-badge { position: absolute; top: 0; right: -5px; background: var(--red); color: white; border: 2px solid #000; font-size: 9px; padding: 4px; border-radius: 50%; display: none; }

        /* --- 5. SHOP --- */
        #shop-view { width: 100vw; height: 100%; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; padding-top: 110px; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; position: relative; z-index: 10; }
        #shop-view::-webkit-scrollbar { display: none; }
        .shop-page { min-width: 100vw; height: 100%; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr); gap: 10px; padding: 0 15px 120px 15px; scroll-snap-align: start; align-content: start; }

        /* ITEM OTTIMIZZATO PER CURSORE PC */
        .item { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            position: relative; touch-action: pan-x pan-y; 
            width: 100%; height: 100%; min-height: 100px; 
            cursor: grab; /* Cursore manina su PC */
        }
        .item:active { cursor: grabbing; } /* Manina chiusa quando clicchi */
        
        .item img { width: 85px; height: 85px; object-fit: contain; pointer-events: none; filter: drop-shadow(0 5px 6px rgba(0,0,0,0.5)); }
        .label { font-family: sans-serif; font-weight: 900; font-size: 8px; color: #fff; text-shadow: 0 1px 2px #000; margin-top: 5px; text-align:center;}
        
        .sold-out { opacity: 0.4; filter: grayscale(100%); pointer-events: none; cursor: default; }
        .sold-out::after { content: "SOLD OUT"; position: absolute; background: var(--red); color: white; font-size: 8px; padding: 4px 6px; transform: rotate(-15deg); border: 2px solid #fff; z-index: 5; font-family: 'Press Start 2P', cursive; }

        /* --- 6. GHOST --- */
        .ghost { position: fixed; z-index: 99999; pointer-events: none; width: 85px !important; height: 85px !important; display: flex; justify-content: center; align-items: center; opacity: 0.9; transform: scale(1.1); filter: drop-shadow(0 15px 15px rgba(0,0,0,0.6)); }
        .ghost img { width: 100% !important; height: 100% !important; object-fit: contain !important; }
        .sucked { transition: 0.4s; transform: scale(0) rotate(720deg) !important; opacity: 0; }

        /* --- 7. WINDOWS --- */
        .window { display: none; position: fixed; top: 12%; left: 5%; width: 90%; max-width: 380px; background: #fff; border: 3px solid #000; box-shadow: 10px 10px 0 rgba(0,0,0,0.6); z-index: 50000; flex-direction: column; max-height: 80vh; }
        .win-h { background: #eee; border-bottom: 2px solid #000; padding: 12px; cursor: move; display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 10px; }
        .win-x { background: var(--red); width: 20px; height: 20px; border: 2px solid #000; cursor: pointer; }
        .win-b { padding: 15px; overflow-y: auto; }
        .btn { width: 100%; padding: 12px; margin-top: 10px; background: #000; color: #fff; border: 2px solid #000; font-size: 10px; cursor: pointer; font-family: inherit; transition: 0.1s;}
        .btn:active { transform: scale(0.98); }
        .row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #ccc; padding: 8px 0; font-size: 10px; }
        input, select { width: 100%; padding: 8px; border: 2px solid #000; font-family: monospace; font-size: 10px; }
        textarea { width: 100%; height: 80px; border: 2px solid #000; padding: 10px; font-family: inherit; font-size: 10px; resize: none; margin-top: 10px; }

        /* --- 8. FOOTER --- */
        footer { position: fixed; bottom: 0; left: 0; width: 100%; height: 80px; display: flex; justify-content: center; align-items: center; z-index: 12000; pointer-events: none; }
        .brand { width: 160px; pointer-events: auto; cursor: pointer; padding: 20px; }

    </style>
</head>
<body>

    <div id="loader-overlay">
        <img src="logo_ff_loader.png" class="loader-logo" onerror="this.src='https://placehold.co/300x80?text=FRIENDLYFIRE'">
        <img src="loadernob.gif" class="loader-gif" onerror="this.src='https://placehold.co/200?text=LOADING'">
        <div class="bar-container"><div id="bar-fill" class="bar-fill"></div></div>
        <button id="start-btn" onclick="startApp()" ontouchstart="startApp()">START WORLD</button>
        <img src="mark_c.png" class="clod-mark" onerror="this.style.display='none'">
        <div class="powered-by">Powered by Clod™</div>
    </div>

    <audio id="sfx-eat" src="suono_gnam.mp3" preload="auto"></audio>

    <header>
        <img src="mondo_pongo.PNG" class="h-btn" onclick="anim(this); showWin('win-news')" onerror="this.src='https://placehold.co/60?text=NEWS'">
        <img src="fuochini_centrali.png" class="h-btn" onclick="anim(this); showWin('win-prof')" onerror="this.src='https://placehold.co/60?text=PROF'">

            <img src="tank_header.PNG" id="tank-target" class="h-btn" onclick="anim(this); toggleWin('win-cart')" onerror="this.src='https://placehold.co/60?text=TANK'">

        <div class="win-b"><div id="cart-list">VUOTO</div><div id="cart-tot" style="margin-top:10px;border-top:2px solid #000;padding-top:10px;font-weight:bold;">TOT: 0€</div><button class="btn" onclick="pay()">ORDINA / PRENOTA</button><button class="btn" style="background:var(--red);" onclick="cart=[];upCart();">SVUOTA</button></div>

        <div class="win-h" onmousedown="dragWin(event,'win-admin')" ontouchstart="dragWin(event,'win-admin')"><span>ADMIN</span><div class="win-x" onclick="hideAll()"></div></div>
        <div class="win-b">
            <div style="font-size:8px;">SFONDO URL:</div>

        <div class="win-h" onmousedown="dragWin(event,'win-details')" ontouchstart="dragWin(event,'win-details')"><span>DETTAGLI</span><div class="win-x" onclick="hideAll()"></div></div>
        <div class="win-b" style="display:flex; flex-direction:column; align-items:center;">
            <img id="det-img" src="" style="width:80%; max-height:180px; object-fit:contain; margin-bottom:10px; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.3));">
            <h3 id="det-title" style="margin:0; font-size:14px; text-align:center;"></h3>
            <p id="det-price" style="margin:5px 0 10px 0; font-size:12px; color:var(--red); font-weight:bold;"></p>
            
            <div id="det-size-container" style="width:100%; display:none; margin-bottom:10px;">
                <span style="font-size:8px; margin-bottom:5px; display:block;">SELEZIONA TAGLIA:</span>
                <select id="det-size"></select>
            </div>

            <textarea id="det-desc" placeholder="Descrizione prodotto..." readonly></textarea>
            
            <button id="btn-add-tank" class="btn" style="background:var(--green); color:#000; border:3px solid #000; margin-top:15px; font-size:12px;" onclick="addFromDetails()">AGGIUNGI AL TANK</button>
            <button id="btn-save-desc" class="btn" style="display:none; background:blue; color:white;" onclick="saveDesc()">SALVA DESCRIZIONE (ADMIN)</button>

    <div id="win-news" class="window"><div class="win-h"><span>NEWSLETTER</span><div class="win-x" onclick="hideAll()"></div></div><div class="win-b"><input id="nm" type="email" placeholder="Email"><button class="btn" onclick="sub()">ISCRIVITI</button></div></div>
    <div id="win-prof" class="window"><div class="win-h"><span>PROFILO</span><div class="win-x" onclick="hideAll()"></div></div><div class="win-b"><p>COMING SOON</p></div></div>

    <script>
        const CFG = { 
            u:'https://jwifyapbnsbbpsrstrow.supabase.co', 
            k:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp3aWZ5YXBibnNiYnBzcnN0cm93Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA1NzM1OTUsImV4cCI6MjA4NjE0OTU5NX0.dmhdHZRJuYo7-OlpSR3S5ca7ink9w6a5DM-u2ac4c2Y', 
            ek:'BThMV2knP0VG0s4nr', es:'service_4scv4hn', et:'template_8opoo1v' 
        };
        
        let items=[];
        let cart=[], sb=null, taps=0, labBgUrl='';
        let adminActive = false;
        let curDetIdx = -1;

        setTimeout(()=>{ 
            let b=document.getElementById('start-btn'); 
            if(b) b.classList.add('visible'); 
            document.getElementById('bar-fill').style.width='100%'; 
        }, 1600);

        function startApp() {
            let o = document.getElementById('loader-overlay');
            o.style.opacity='0'; o.style.pointerEvents='none';
            setTimeout(()=>{o.style.display='none'},300);
            try{document.getElementById('sfx-eat').play();}catch(e){}
            try{ if(window.supabase){ sb=window.supabase.createClient(CFG.u,CFG.k); loadDB(); setupRealtime(); } if(window.emailjs)emailjs.init(CFG.ek); }catch(e){}
            render();
        }
        
        async function loadDB(){ 
            if(!sb)return; 
            const{data}=await sb.from('products').select('*').order('id'); 
            if(data&&data.length){ 
                items=data.map(x=>formatItem(x)); 
                render(); 
            } 
        }

        // FORMAT HELPER
        function formatItem(x) {
            return {id:x.id, name:x.name, p:x.price, q:x.qty, i:x.img, d:x.desc || '', sz:x.sizes || ''};
        }

        // --- REALTIME MAGIC ---
        function setupRealtime() {
            if(!sb) return;
            sb.channel('public:products')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, (payload) => {
                if(payload.eventType === 'INSERT') {
                    items.push(formatItem(payload.new));
                }
                if(payload.eventType === 'UPDATE') {
                    let idx = items.findIndex(x => x.id === payload.new.id);
                    if(idx !== -1) items[idx] = formatItem(payload.new);
                }
                if(payload.eventType === 'DELETE') {
                    items = items.filter(x => x.id !== payload.old.id);
                }
                render(); // AGGIORNAMENTO ISTANTANEO PER TUTTI
            })
            .subscribe();
        }

        function getRealQty(item) {
            if (item.sz && item.sz.includes(':')) {
                return item.sz.split(',').reduce((tot, part) => {
                    let val = parseInt(part.split(':')[1]);
                    return tot + (isNaN(val) ? 0 : val);
                }, 0);
            }
            return parseInt(item.q) || 0;
        }

        function render(){
            const pages = [document.getElementById('page-1'), document.getElementById('page-2'), document.getElementById('page-3')];
            pages.forEach(p => p.innerHTML = ''); 
            
            items.forEach((item, i) => {
                let pageIdx = Math.floor(i / 9);
                if (pageIdx < pages.length) {
                    let realQty = getRealQty(item);
                    let sold = realQty <= 0;
                    
                    pages[pageIdx].innerHTML += `<div class="item ${sold?'sold-out':''}" id="i-${i}" 
                        ontouchstart="handleTouch(event,${i})" onmousedown="handleMouse(event,${i})">
                        <img src="${item.i}" onerror="this.src='https://placehold.co/80?text=${item.name}'">
                        <div class="label">${item.name}</div><div class="label">${item.p}€</div>
                    </div>`;
                }
            });
        }

        let lastTap = 0, dragTimer = null, startX=0, startY=0, isDragging = false;

        function handleTouch(e, i) {
            let now = Date.now();
            let touch = e.touches[0];
            
            if (now - lastTap < 350) {
                e.preventDefault(); clearTimeout(dragTimer); showDetails(i); lastTap = 0; return;
            }
            lastTap = now; startX = touch.clientX; startY = touch.clientY; isDragging = false;

            dragTimer = setTimeout(() => {
                isDragging = true;
                if(navigator.vibrate) navigator.vibrate(20);
                let el = document.getElementById(`i-${i}`);
                startGhostDrag(i, el.getBoundingClientRect(), startX, startY);
            }, 300); 

            let el = document.getElementById(`i-${i}`);
            function onMove(ev) {
                let t = ev.touches[0];
                if (!isDragging && (Math.abs(t.clientX - startX) > 10 || Math.abs(t.clientY - startY) > 10)) {
                    clearTimeout(dragTimer); el.removeEventListener('touchmove', onMove);
                }
            }
            function onEnd() { if (!isDragging) clearTimeout(dragTimer); el.removeEventListener('touchmove', onMove); el.removeEventListener('touchend', onEnd); }

            el.addEventListener('touchmove', onMove); el.addEventListener('touchend', onEnd);
        }

        function handleMouse(e, i) {
            let el = document.getElementById(`i-${i}`);
            el.ondblclick = () => { clearTimeout(dragTimer); showDetails(i); };
            dragTimer = setTimeout(() => { startGhostDrag(i, el.getBoundingClientRect(), e.clientX, e.clientY); }, 250);
            let onUp = () => { clearTimeout(dragTimer); document.removeEventListener('mouseup', onUp); };
            document.addEventListener('mouseup', onUp);
        }

        function startGhostDrag(i, rect, inputX, inputY) {
            let g = document.getElementById(`i-${i}`).cloneNode(true);
            g.className = 'ghost'; 
            
            // CENTER SNAP: Il centro del fantasma va sul mouse
            // width è 85px da CSS (impostato su ghost)
            let halfW = 42.5; 
            let halfH = 42.5;
            
            // Posiziona inizialmente
            g.style.left = (inputX - halfW) + 'px';
            g.style.top = (inputY - halfH) + 'px';
            
            document.body.appendChild(g);

            let lastEdgeScroll = 0;

            function move(ev) {
                ev.preventDefault();
                let cx = ev.type.includes('touch') ? ev.touches[0].clientX : ev.clientX;
                let cy = ev.type.includes('touch') ? ev.touches[0].clientY : ev.clientY;
                
                // MOUSE CENTERED
                g.style.left = (cx - halfW) + 'px';
                g.style.top = (cy - halfH) + 'px';

                let sv = document.getElementById('shop-view'), now = Date.now();
                if (now - lastEdgeScroll > 800) { 
                    if (cx > window.innerWidth - 60) { sv.scrollBy({left: window.innerWidth, behavior: 'smooth'}); lastEdgeScroll = now; } 
                    else if (cx < 60) { sv.scrollBy({left: -window.innerWidth, behavior: 'smooth'}); lastEdgeScroll = now; }
                }
            }

            function end(ev) {
                document.removeEventListener('touchmove', move); document.removeEventListener('touchend', end);
                document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', end);

                let gx = parseInt(g.style.left) + 40, gy = parseInt(g.style.top) + 40;

                let tk = document.getElementById('tank-target').getBoundingClientRect();
                if (Math.hypot(gx - (tk.left + tk.width/2), gy - (tk.top + tk.height/2)) < 60) {
                    g.remove();
                    if (items[i].sz && items[i].sz.includes(':')) {
                        showDetails(i);
                    } else {
                        try{document.getElementById('sfx-eat').play();}catch(e){}
                        cart.push({...items[i], selSize: ''}); upCart(); showWin('win-cart');
                    }
                    return;
                }

                let ft = document.getElementById('brand-target').getBoundingClientRect();
                if (Math.hypot(gx - (ft.left + ft.width/2), gy - (ft.top + ft.height/2)) < 60) { toggleLabMode(); g.remove(); return; }

                g.style.display='none'; 
                let bel=document.elementFromPoint(gx,gy); 
                g.style.display='flex';
                let trg=bel?bel.closest('.item'):null;
                if(trg && trg.id!==`i-${i}` && !trg.classList.contains('sold-out')){
                    let ti=parseInt(trg.id.split('-')[1]);
                    [items[i],items[ti]]=[items[ti],items[i]]; render();
                }
                g.remove();
            }

            document.addEventListener('touchmove', move, {passive:false}); document.addEventListener('touchend', end);
            document.addEventListener('mousemove', move); document.addEventListener('mouseup', end);
        }

        function showDetails(i) {
            curDetIdx = i;
            let item = items[i];
            document.getElementById('det-img').src = item.i;
            document.getElementById('det-title').innerText = item.name;
            document.getElementById('det-price').innerText = item.p + " €";
            
            let sizeCont = document.getElementById('det-size-container');
            let sizeSelect = document.getElementById('det-size');
            sizeSelect.innerHTML = '';
            
            let btnAdd = document.getElementById('btn-add-tank');

            if (item.sz && item.sz.includes(':')) {
                sizeCont.style.display = 'block';
                let parts = item.sz.split(',').map(s => s.trim().split(':'));
                let hasAvailable = false;
                
                parts.forEach(p => {
                    let name = p[0].trim();
                    let q = parseInt(p[1]);
                    if (q > 0) {
                        sizeSelect.innerHTML += `<option value="${name}">${name} (Disp: ${q})</option>`;
                        hasAvailable = true;
                    }
                });

                if(!hasAvailable) {
                    sizeSelect.innerHTML = `<option value="">TUTTE LE TAGLIE ESAURITE</option>`;
                    sizeSelect.disabled = true;
                    btnAdd.style.display = 'none'; 
                } else {
                    sizeSelect.disabled = false;
                    btnAdd.style.display = 'block';
                }
            } else {
                sizeCont.style.display = 'none';
                btnAdd.style.display = getRealQty(item) > 0 ? 'block' : 'none';
            }
            
            let descArea = document.getElementById('det-desc');
            descArea.value = item.d || "";
            let saveBtn = document.getElementById('btn-save-desc');
            
            if(adminActive) { descArea.readOnly = false; descArea.style.border = "2px solid blue"; saveBtn.style.display = "block"; } 
            else { descArea.readOnly = true; descArea.style.border = "2px solid #000"; saveBtn.style.display = "none"; }
            
            showWin('win-details');
        }

        function addFromDetails() {
            let item = items[curDetIdx];
            let sSize = '';
            if (item.sz && item.sz.includes(':')) {
                let sel = document.getElementById('det-size');
                if(!sel.value) return alert("Scegli una taglia!");
                sSize = sel.value;
            }
            try{document.getElementById('sfx-eat').play();}catch(e){}
            cart.push({...item, selSize: sSize});
            upCart();
            hideAll();
            showWin('win-cart');
        }

        async function saveDesc() {
            if(curDetIdx === -1) return;
            items[curDetIdx].d = document.getElementById('det-desc').value;
            if(sb) {
                const { error } = await sb.from('products').update({ desc: items[curDetIdx].d }).eq('id', items[curDetIdx].id);
                if(error) alert("Errore DB: " + error.message); else alert("Descrizione Aggiornata!");
            }
            hideAll();
        }

        function toggleLabMode() { document.body.classList.toggle('hologram-mode'); if(document.body.classList.contains('hologram-mode') && labBgUrl) { document.body.style.backgroundImage = `url('${labBgUrl}')`; } else { document.body.style.backgroundImage = "url('sfondo2.jpg')"; } if(navigator.vibrate) navigator.vibrate([50,50,50]); }

        function upCart(){ 
            document.getElementById('tank-badge').innerText=cart.length; 
            document.getElementById('tank-badge').style.display=cart.length?'block':'none'; 
            document.getElementById('cart-list').innerHTML=cart.length?cart.map((x,n)=>`<div class="row"><span>${x.name} ${x.selSize?'- '+x.selSize:''}</span><span>${x.p}€</span><span onclick="cart.splice(${n},1);upCart()" style="color:red;cursor:pointer;font-weight:bold;">X</span></div>`).join(''):"VUOTO"; 
            document.getElementById('cart-tot').innerText="TOT: "+cart.reduce((a,b)=>a+parseInt(b.p),0)+"€"; 
        }
        async function pay(){ if(!cart.length)return alert("Vuoto"); let m=prompt("Email per completare ordine:"); if(m){ if(sb) await sb.from('newsletter').insert([{email:m}]); if(window.emailjs) emailjs.send(CFG.es,CFG.et,{user_email:m,message:"NUOVO ORDINE RICEVUTO"}); alert("Grazie! Controlla la mail."); cart=[]; upCart(); hideAll(); } }

        async function sub(){ let m=document.getElementById('nm').value; if(m) { if(sb) await sb.from('newsletter').insert([{email:m}]); if(window.emailjs) { try { await emailjs.send(CFG.es, CFG.et, { user_email: m, message: "BENVENUTO NEL MONDO FRIENDLYFIRE!" }); } catch(e) { console.log(e); } } alert("Iscritto e Mail Inviata!"); hideAll(); } }

        function adminTrigger(){ taps++; if(taps>=3){ if(prompt("PWD")==="FRIENDLYFIRE26") { adminActive=true; showAdm(); } taps=0; } setTimeout(()=>taps=0, 1000); }
        function showAdm(){
            document.getElementById('adm-list').innerHTML=items.map((x,i)=>`
                <div class="row">
                    <input id="i${i}" value="${x.i}" style="width:20%;color:blue;font-size:8px;">
                    <input id="n${i}" value="${x.name}" style="width:20%;">
                    <input id="p${i}" value="${x.p}" type="number" style="width:15%;">
                    <input id="s${i}" value="${x.sz || x.q}" placeholder="S:5,M:0" style="width:35%; font-size:8px;">
                    <button style="width:10%;background:red;color:white;" onclick="if(confirm('Del?')){items.splice(${i},1);showAdm();}">X</button>
                </div>`).join('');
            showWin('win-admin');
        }
        function addItm(){ items.push({id:Date.now(),name:'NEW',p:0,q:1,i:'image_cap.png',d:'',sz:''}); showAdm(); }
        
        async function saveAdm(){ 
            items.forEach((x,i)=>{ 
                if(document.getElementById(`n${i}`)){ 
                    x.name=document.getElementById(`n${i}`).value; 
                    x.p=document.getElementById(`p${i}`).value; 
                    x.i=document.getElementById(`i${i}`).value;
                    let sVal = document.getElementById(`s${i}`).value;
                    if(sVal.includes(':')) { x.sz = sVal; x.q = 0; } else { x.q = sVal; x.sz = ''; }
                } 
            });
            render(); 
            if(sb) {
                const updates = items.map(x => ({ id: x.id, name: x.name, price: x.p, qty: x.q, sizes: x.sz, img: x.i }));
                const { error } = await sb.from('products').upsert(updates);
                if(error) alert("Errore: " + error.message); else alert("Salvato nel Database!");
            }
            hideAll();
        }

        function setBg(isLab){ let val = document.getElementById(isLab ? 'lab-bg-in' : 'bg-in').value; if(isLab) { labBgUrl = val; alert("Lab BG OK"); } else { document.body.style.backgroundImage=`url('${val}')`; } }
        function anim(el){ el.classList.remove('pongo-anim'); void el.offsetWidth; el.classList.add('pongo-anim'); try{document.getElementById('sfx-eat').play();}catch(e){} }
        function showWin(id){ hideAll(); document.getElementById(id).style.display='flex'; }
        function toggleWin(id){ let w=document.getElementById(id); if(w.style.display==='flex') hideAll(); else { showWin(id); upCart(); } }
        function hideAll(){ document.querySelectorAll('.window').forEach(w=>w.style.display='none'); }

        let wDrag=null,wx=0,wy=0;
        function dragWin(e,id){ wDrag=document.getElementById(id); let t=e.touches?e.touches[0]:e, r=wDrag.getBoundingClientRect(); wx=t.clientX-r.left; wy=t.clientY-r.top; function mv(ev){ let c=ev.touches?ev.touches[0]:ev; wDrag.style.left=(c.clientX-wx)+'px'; wDrag.style.top=(c.clientY-wy)+'px'; ev.preventDefault(); } function st(){ document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',st); document.removeEventListener('touchmove',mv); document.removeEventListener('touchend',st); } document.addEventListener('mousemove',mv); document.addEventListener('mouseup',st); document.addEventListener('touchmove',mv,{passive:false}); document.addEventListener('touchend',st); }
    </script>
</body>
</html>
