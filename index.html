<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FRIENDLYFIRE CO.</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <script src="https://js.stripe.com/v3/"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <style>
        /* --- 1. CORE & RESET --- */
        :root { --red: #ff3a3a; --bg-pongo: #2e4a1e; --white: #ffffff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; outline: none; }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; 
            font-family: 'Press Start 2P', cursive; 
            background-color: var(--bg-pongo);
            background-image: url('sfondo2.jpg'); /* Default background */
            background-position: center center; background-repeat: no-repeat; background-size: cover;
            overscroll-behavior: none; position: fixed; 
        }

        /* --- 2. LOADER --- */
        #loader-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background-color: var(--white); z-index: 999999; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            transition: opacity 0.5s ease-out;
        }
        .loader-brand-img { width: 260px; max-width: 80%; height: auto; object-fit: contain; margin-bottom: 10px; }
        .gif-wrapper { width: 280px; height: 280px; display: flex; justify-content: center; align-items: center; }
        #loader-gif { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; transform: scale(1.1); }
        .loading-area-bottom { display: flex; flex-direction: column; align-items: center; margin-top: 20px; width: 100%; height: 120px; justify-content: flex-start; }
        
        /* Animazione Barra CSS (Indipendente da JS) */
        .pixel-bar-container { width: 180px; height: 16px; background: #fff; border: 3px solid #000; padding: 2px; box-shadow: 6px 6px 0 rgba(0,0,0,0.1); margin-bottom: 10px; }
        .pixel-bar-fill { height: 100%; width: 0%; background-color: #32cd32; animation: fillBar 2s linear forwards; }
        @keyframes fillBar { 0% { width: 0%; } 90% { width: 90%; } 100% { width: 100%; } }

        .loading-text { font-size: 10px; color: #000; margin-bottom: 10px; letter-spacing: 2px; text-transform: uppercase; animation: hideText 0.1s linear 2s forwards; }
        @keyframes hideText { to { opacity: 0; visibility: hidden; } }

        #start-btn { 
            opacity: 0; pointer-events: none; 
            background: #000; color: #fff; border: 2px solid #000; 
            padding: 14px 30px; font-family: 'Press Start 2P'; font-size: 10px; 
            cursor: pointer; text-transform: uppercase; margin-top: 10px;
            box-shadow: 4px 4px 0 #999; 
            animation: showBtn 0.5s ease-out 2s forwards, blink 1s infinite 2.5s; 
        }
        @keyframes showBtn { to { opacity: 1; pointer-events: auto; } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }

        .loader-footer { position: absolute; bottom: 20px; width: 100%; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .copyright-mark { width: 30px; height: auto; margin-bottom: 5px; opacity: 0.8; }
        .copyright-text { font-family: Arial, sans-serif; font-weight: bold; font-size: 8px; color: #000; opacity: 0.6; line-height: 1.4; }

        /* --- 3. HEADER & ANIMAZIONI --- */
        header { display: flex; justify-content: space-between; align-items: flex-start; padding: 15px 20px; position: absolute; top: 0; left: 0; right: 0; z-index: 2000; pointer-events: none; }
        
        /* Animazione Pongo (Gelatina) */
        @keyframes pongo-anim { 
            0% { transform: scale(1); } 30% { transform: scale(1.25, 0.75); } 
            40% { transform: scale(0.75, 1.25); } 50% { transform: scale(1.15, 0.85); } 
            65% { transform: scale(0.95, 1.05); } 100% { transform: scale(1); } 
        }
        .pongo-btn { width: 70px; height: 70px; object-fit: contain; cursor: pointer; pointer-events: auto; filter: drop-shadow(0 4px 2px rgba(0,0,0,0.4)); transition: transform 0.1s; }
        .pongo-btn.stretch { animation: pongo-anim 0.4s ease-in-out; }
        
        .tank-wrapper { position: relative; pointer-events: auto; }
        #tank-badge { position: absolute; top: 0; right: -5px; background: var(--red); color: white; border: 2px solid #000; font-size: 9px; padding: 3px 6px; border-radius: 50%; display: none; z-index: 10003; }

        /* --- 4. SHOP GRID --- */
        #shop-slider { width: 100vw; height: 100%; display: flex; overflow-x: scroll; overflow-y: hidden; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; z-index: 1; }
        #shop-slider.free-flow { scroll-snap-type: none !important; scroll-behavior: auto !important; }
        #shop-slider::-webkit-scrollbar { display: none; }
        
        /* Mobile: 3 Colonne */
        .shop-page { min-width: 100vw; height: 100%; flex: 0 0 100vw; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr); padding: 110px 10px 100px 10px; gap: 5px; scroll-snap-align: start; justify-items: center; align-items: center; }
        
        .item-card { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 100; 
            touch-action: pan-y; /* Permette scroll verticale, ma JS intercetta il drag orizzontale */
            transform: translateZ(0); cursor: grab; 
        }
        .item-card img { width: 90px; pointer-events: none; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5)); transition: transform 0.2s; }
        .item-card:active img { transform: scale(0.9) rotate(-2deg); }
        .clean-tag { font-family: sans-serif; font-weight: 800; font-size: 9px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.9); margin-top: 5px; text-transform: uppercase; text-align: center; }
        
        .ghost-card { position: fixed; z-index: 999999; pointer-events: none; display: flex; flex-direction: column; align-items: center; transform: scale(1.2) rotate(5deg); opacity: 0.95; filter: drop-shadow(0 30px 50px rgba(0,0,0,0.6)); }
        .ghost-card img { width: 100px; } .ghost-card .clean-tag { display: none; }

        /* --- 5. FOOTER & OVERLAYS --- */
        #app-footer { 
            position: fixed; bottom: 0; left: 0; right: 0; height: 60px; 
            display: flex; align-items: center; justify-content: center; 
            z-index: 20000; pointer-events: none; /* Lascia passare click */
            background: linear-gradient(to top, rgba(0,0,0,0.3), transparent); 
        }
        .footer-logo { 
            width: 150px; cursor: pointer; 
            pointer-events: auto; /* FIX ADMIN: Rende il logo cliccabile */
            transition: transform 0.1s; 
        }
        .footer-logo:active { transform: scale(0.95); }
        
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 50000; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .mac-window { width: 90%; max-width: 360px; background: #fff; border: 3px double #000; padding: 0 0 15px 0; box-shadow: 15px 15px 0 rgba(0,0,0,0.5); text-align: center; display: flex; flex-direction: column; align-items: center; position: relative; }
        .mac-title-bar { width: 100%; background: repeating-linear-gradient(45deg, #ccc, #ccc 2px, #fff 2px, #fff 4px); border-bottom: 2px solid #000; padding: 10px; margin-bottom: 10px; color: #000; font-size: 10px; font-weight: 800; letter-spacing: 1px; touch-action: none; cursor: move; }
        .draggable-handle { cursor: move; }
        
        .btn-pixel { background: #000; color: #fff; border: 2px solid #000; padding: 14px; font-family: 'Press Start 2P'; font-size: 9px; cursor: pointer; box-shadow: 4px 4px 0 #888; margin: 6px; width: 85%; text-transform: uppercase; transition: transform 0.1s; }
        .btn-pixel:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #888; }
        .checkout-group { width: 85%; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
        .input-pixel { border: 2px solid #000; padding: 12px; font-family: sans-serif; font-weight: bold; width: 100%; font-size: 11px; background: #eee; border-radius: 0; outline: none; }
        .db-row { display: flex; gap: 4px; width: 95%; margin: 4px 0; align-items: center; justify-content: center; border-bottom: 1px dashed #ccc; padding-bottom: 2px; }
        .size-select { background: #fff; border: 2px solid #000; font-family: sans-serif; font-weight: bold; font-size: 10px; padding: 2px; margin-left: 5px; cursor: pointer; }

        @media (min-width: 1024px) {
            .loader-brand-img { width: 450px; } .gif-wrapper { width: 500px; height: 500px; }
            header { padding: 30px 60px; } .pongo-btn { width: 100px; height: 100px; }
            /* Desktop: 4 Colonne */
            .shop-page { padding: 160px 100px; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 1fr); gap: 40px; }
            .item-card img { width: 140px; } .item-card:hover img { transform: scale(1.1); } .ghost-card img { width: 140px; }
            .mac-window { max-width: 500px; } .footer-logo { width: 240px; }
        }
    </style>
</head>
<body>

    <div id="loader-overlay">
        <img src="logo_ff_loader.png" alt="FRIENDLYFIRE" class="loader-brand-img">
        <div class="gif-wrapper"><img id="loader-gif" src="loadernob.gif"></div>
        <div class="loading-area-bottom">
            <div id="loading-txt" class="loading-text">LOADING...</div>

    <audio id="sfx-gnam" src="suono_gnam.mp3" preload="auto"></audio>

    <header>
        <img src="mondo_pongo.PNG" class="pongo-btn" onclick="triggerPongo(this); openOv('ov-world')">
        <img src="fuochini_centrali.png" class="pongo-btn" onclick="triggerPongo(this); openOv('ov-profile')">

    <div id="shop-slider">

    <footer id="app-footer">
        <img src="brand_name.png" class="footer-logo" onclick="adminTrigger()">
    </footer>

    <div id="ov-cart" class="overlay">
        <div class="mac-window">
            <div class="mac-title-bar draggable-handle">YOUR TANK</div>
            <div id="cart-list" style="max-height:160px; overflow-y:auto; background:#f0f0f0; border:2px solid #000; width:85%; margin:10px auto; padding:8px; font-size:10px; text-align:left;"></div>

    <div id="ov-newsletter" class="overlay">
        <div class="mac-window">
            <div class="mac-title-bar">JOIN THE CLUB</div>

            <div style="width:100%; display:flex; flex-direction:column; align-items:center;">
                <input type="text" id="newsletter-name" class="input-pixel" placeholder="YOUR NAME" style="width:85%; margin-bottom:5px;">
                <input type="email" id="newsletter-email" class="input-pixel" placeholder="E-MAIL" style="width:85%; margin-bottom:10px;" required>

            </div>
            <div id="avatar-grid" style="display:grid; grid-template-columns:repeat(4,1fr); gap:6px; width:85%; margin:10px auto;"></div>
            <input type="text" class="input-pixel" placeholder="NICKNAME" value="GUEST" style="width:85%; text-align:center;">

    <div id="ov-world" class="overlay">

    <div id="ov-db" class="overlay">
        <div class="mac-window" style="max-width:95%; height:85vh; justify-content:flex-start;">
            <div class="mac-title-bar">ADMIN (CLOUD)</div>
            <div style="width:90%; padding:5px; background:#ddd; margin-bottom:5px;">
                <label style="font-size:9px;">BACKGROUND URL:</label>
                <input id="db-bg-url" class="input-pixel" style="width:100%;">
            </div>
            <div id="db-list" style="overflow-y:auto; width:100%; flex-grow:1; border-bottom:2px solid #000; margin-bottom:10px;"></div>
            <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:5px; width:100%;">
                <button class="btn-pixel" style="width:45%; background:#00f;" onclick="createNewItem()">+ NEW ITEM</button>
                <button class="btn-pixel" style="width:45%; background:#0f0;" onclick="saveAllChanges()">SAVE ALL</button>
                <button class="btn-pixel" style="width:90%;" onclick="closeAll()">EXIT</button>
            </div>

    <script>
        // --- 1. CONFIGURAZIONE CHIAVI & DEFAULT ---
        let stripe, supabase;
        const defaultItems = [
            {id:0, name:'CAP FIRE', img:'image_cap.PNG', price:45, stripeId:'', sizes:'ONE SIZE'}, 
            {id:1, name:'TEE FLAME', img:'image_tee.PNG', price:65, stripeId:'', sizes:'S,M,L,XL'}
        ];
        // Inventory parte con i default per non lasciare mai vuoto
        let inventory = JSON.parse(JSON.stringify(defaultItems));
        let cart = [], autoScrollSpeed = 0, dbClicks = 0, scrollLoopId = null;
        let currentBg = 'sfondo2.jpg';

        const emailPublic = "BThMV2knP0VG0s4nr";
        const emailService = "service_4scv4hn";
        const emailTemplate = "template_8opoo1v";

        // --- 2. BOOTSTRAP (Avvio Sicuro) ---
        window.onload = function() {
            // Renderizza subito l'interfaccia (dietro il loader)
            renderShop(); 
            renderAvatars(); 
            initDraggableWindows(); 
            document.body.style.backgroundImage = `url('${currentBg}')`;

            // Prova a connettere i servizi esterni in background
            try {
                stripe = Stripe('pk_live_51SyKuT1PjKstwovYOCs5iNC2Ef8sun65gJ2pLXi4pyvfqM9o2Tiaec8NTQuHJEoYVPzDEDsktyZwlSWl6SjMKxzM00i7aB1Yvd');
                const sbUrl = 'https://jwifyapbnsbbpsrstrow.supabase.co';
                const sbKey = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp3aWZ5YXBibnNiYnBzcnN0cm93Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA1NzM1OTUsImV4cCI6MjA4NjE0OTU5NX0.dmhdHZRJuYo7-OlpSR3S5ca7ink9w6a5DM-u2ac4c2Y';
                supabase = supabase.createClient(sbUrl, sbKey);
                emailjs.init(emailPublic);
                loadDB(); // Scarica dati aggiornati se possibile
            } catch(e) { console.log("Offline/Error:", e); }
        };

        // --- 3. DATABASE (SUPABASE) ---
        async function loadDB() {
            if(!supabase) return;
            // Prodotti
            let { data: prodData } = await supabase.from('products').select('*').order('id', {ascending:true});
            if(prodData && prodData.length > 0) {
                inventory = prodData;
                renderShop();
            }
            // Settings (Sfondo)
            let { data: set } = await supabase.from('settings').select('*').limit(1).single();
            if(set && set.bg_url) {
                currentBg = set.bg_url;
                document.body.style.backgroundImage = `url('${currentBg}')`;
            }
        }

        // --- 4. RENDER SHOP (GRIGLIA) ---
        function renderShop() {
            [1,2,3].forEach(n => document.getElementById('page-'+n).innerHTML='');
            let itemsPerPage = 12;
            inventory.forEach((item, idx) => {
                let page = Math.floor(idx/itemsPerPage) + 1; if(page>3) return;
                let c = document.getElementById('page-'+page);
                if(!c) return;

                let el = document.createElement('div'); el.className = 'item-card'; el.id = 'itm-'+item.id;
                el.innerHTML = `<img src="${item.img}"><div class="clean-tag">${item.name}</div><div class="clean-tag">${item.price}€</div>`;
                attachPhysics(el, item, idx); 
                c.appendChild(el);
            });
        }

        // --- 5. PHYSICS ENGINE (V87 RESTORED) ---
        function getPointerPosition(e) { return e.touches ? {x:e.touches[0].clientX, y:e.touches[0].clientY} : {x:e.clientX, y:e.clientY}; }

        function attachPhysics(el, item, originalIndex) {
            let timer = null, isDragging = false, startX = 0, startY = 0;
            let ghost = null;
            const slider = document.getElementById('shop-slider');

            const onStart = (e) => {
                if(cart.some(c => c.id === item.id)) return;
                let pos = getPointerPosition(e); startX = pos.x; startY = pos.y;

                // Logica V87: Timer per distinguere Scroll (subito) da Drag (hold)
                timer = setTimeout(() => {
                    isDragging = true;
                    if(navigator.vibrate) navigator.vibrate(40);
                    slider.classList.add('free-flow');
                    startAutoScrollLoop();

                    ghost = el.cloneNode(true);
                    ghost.classList.add('ghost-card');
                    ghost.style.left = (startX - 45) + 'px'; ghost.style.top = (startY - 60) + 'px';
                    document.body.appendChild(ghost);
                    el.style.opacity = '0';
                }, 200);
            };

            const onMove = (e) => {
                let pos = getPointerPosition(e);
                // Se mi muovo PRIMA del timer, è uno scroll: annulla il drag
                if(!isDragging) { 
                    if(Math.abs(pos.x - startX)>10 || Math.abs(pos.y - startY)>10) clearTimeout(timer); 
                    return; 
                }
                if(e.cancelable) e.preventDefault(); // Stop scroll pagina se sto draggando

                if(ghost) { ghost.style.left = (pos.x - 45) + 'px'; ghost.style.top = (pos.y - 60) + 'px'; }
                
                // Edge Scroll
                let edge = window.innerWidth * 0.15;
                if (pos.x > window.innerWidth - edge) autoScrollSpeed = 15;
                else if (pos.x < edge) autoScrollSpeed = -15;
                else autoScrollSpeed = 0;
            };

            const onEnd = (e) => {
                clearTimeout(timer); autoScrollSpeed = 0; stopAutoScrollLoop(); slider.classList.remove('free-flow');
                if(isDragging) {
                    isDragging = false;
                    let pos = getPointerPosition(e.changedTouches ? {touches:[e.changedTouches[0]]} : e);
                    if(ghost) ghost.style.display='none';
                    let elemBelow = document.elementFromPoint(pos.x, pos.y);
                    if(ghost) ghost.style.display='flex';

                    // 1. Tank Collision
                    if (elemBelow && (elemBelow.id === 'tank-btn' || elemBelow.closest('.tank-wrapper'))) {
                         if(ghost) {
                            ghost.style.transition = "all 0.4s"; ghost.style.transform = "scale(0)"; 
                            let tr = document.getElementById('tank-btn').getBoundingClientRect();
                            ghost.style.left = (tr.left+10)+'px'; ghost.style.top = (tr.top+10)+'px';
                            setTimeout(() => { if(ghost) ghost.remove(); playSfx(); let s=item.sizes?item.sizes.split(','):['ONE SIZE']; addToCart({...item, selectedSize:s[0]}); }, 350);
                        }
                        return;
                    }
                    // 2. Swap Collision
                    let targetCard = elemBelow ? elemBelow.closest('.item-card') : null;
                    if(targetCard && targetCard !== el) {
                        let targetId = parseInt(targetCard.id.split('-')[1]);
                        let targetIdx = inventory.findIndex(x => x.id === targetId);
                        if(targetIdx !== -1) {
                            let temp = inventory[originalIndex];
                            inventory[originalIndex] = inventory[targetIdx];
                            inventory[targetIdx] = temp;
                            if(ghost) ghost.remove();
                            renderShop(); playSfx(); // Suono scambio
                            return;
                        }
                    }
                    if(ghost) ghost.remove(); el.style.opacity = '1';
                }
            };
            el.addEventListener('touchstart', onStart, {passive:true}); window.addEventListener('touchmove', onMove, {passive:false}); window.addEventListener('touchend', onEnd);
            el.addEventListener('mousedown', onStart); window.addEventListener('mousemove', onMove); window.addEventListener('mouseup', onEnd);
        }

        function startAutoScrollLoop() { if(scrollLoopId) return; const loop = () => { if (autoScrollSpeed !== 0) document.getElementById('shop-slider').scrollLeft += autoScrollSpeed; scrollLoopId = requestAnimationFrame(loop); }; scrollLoopId = requestAnimationFrame(loop); }
        function stopAutoScrollLoop() { if(scrollLoopId) { cancelAnimationFrame(scrollLoopId); scrollLoopId = null; } }

        // --- 6. ADMIN & UI ---
        function adminTrigger() {
            dbClicks++;
            if(dbClicks >= 5) {
                if(prompt("PASSWORD")==="FRIENDLYFIRE26") openDB();
                dbClicks = 0;
            }
            setTimeout(()=>dbClicks=0, 800);
        }

        function openDB(){
            closeAll(); document.getElementById('ov-db').style.display='flex'; document.getElementById('db-bg-url').value = currentBg;
            let l=document.getElementById('db-list'); l.innerHTML='';
            inventory.forEach((i)=>l.innerHTML+=`
                <div class="db-row">
                    <span style="font-size:8px;">${i.id}</span>
                    <input id="dn-${i.id}" value="${i.name}" style="width:40px;">
                    <input id="di-${i.id}" value="${i.img}" style="width:40px;">
                    <input id="ds-${i.id}" value="${i.stripeId}" style="width:40px;" placeholder="ID">
                    <input id="dp-${i.id}" value="${i.price}" type="number" style="width:25px;">
                    <button onclick="deleteItemDB(${i.id})" style="background:red; color:#fff;">X</button>
                </div>`);
        }

        function triggerPongo(el) { playSfx(); el.classList.remove('stretch'); void el.offsetWidth; el.classList.add('stretch'); }
        function playSfx() { let s = document.getElementById('sfx-gnam'); if(s) { s.currentTime=0; s.play().catch(()=>{}); } }
        function initDraggableWindows() { document.querySelectorAll('.draggable-handle').forEach(h => { const win = h.closest('.mac-window'); let isDrag=false, startX, startY; const start=(e)=>{ isDrag=true; let r=win.getBoundingClientRect(); win.style.position='absolute'; win.style.margin='0'; win.style.left=r.left+'px'; win.style.top=r.top+'px'; let p=getPointerPosition(e); startX=p.x-r.left; startY=p.y-r.top; }; const move=(e)=>{ if(!isDrag)return; e.preventDefault(); let p=getPointerPosition(e); win.style.left=(p.x-startX)+'px'; win.style.top=(p.y-startY)+'px'; }; const end=()=>{isDrag=false;}; h.addEventListener('mousedown',start); window.addEventListener('mousemove',move); window.addEventListener('mouseup',end); h.addEventListener('touchstart',start,{passive:false}); window.addEventListener('touchmove',move,{passive:false}); window.addEventListener('touchend',end); }); }
        
        function addToCart(item) { cart.push(JSON.parse(JSON.stringify(item))); updateCartUI(); }
        function updateSize(index, newSize) { cart[index].selectedSize = newSize; }
        function updateCartUI() { document.getElementById('tank-badge').innerText = cart.length; document.getElementById('tank-badge').style.display = cart.length>0?'block':'none'; let t = cart.reduce((a,c)=>a+c.price,0); document.getElementById('cart-total').innerText = t; document.getElementById('checkout-total-display').innerText = t; document.getElementById('cart-list').innerHTML = cart.map(i=>`<div style="display:flex; justify-content:space-between; border-bottom:1px dashed #ccc;"><span>${i.name}</span><span>${i.price}€</span></div>`).join(''); const coList = document.getElementById('checkout-items-list'); if(coList) coList.innerHTML = cart.map((item, idx) => { let sizes = item.sizes ? item.sizes.split(',') : ['ONE SIZE']; let options = sizes.map(s => `<option value="${s}" ${s===item.selectedSize?'selected':''}>${s}</option>`).join(''); return `<div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px dashed #ccc; padding:3px 0;"><span style="font-size:9px;">${item.name}</span><select class="size-select" onchange="updateSize(${idx}, this.value)">${options}</select><span style="font-size:9px;">${item.price}€</span></div>`; }).join(''); }
        function emptyCart() { cart=[]; updateCartUI(); closeAll(); }
        
        // --- 7. PAGAMENTI & NEWSLETTER ---
        async function processStripeRedirect() { if(cart.length===0) { alert("TANK EMPTY"); return; } const name = document.getElementById('ship-name').value; const email = document.getElementById('ship-email').value; const addr = document.getElementById('ship-address').value; if(!name || !email || !addr) { alert("FILL DETAILS"); return; } let lineItems = []; for(let item of cart) { if(!item.stripeId || item.stripeId.length<5) { alert("PRODUCT ERROR: "+item.name); return; } lineItems.push({ price: item.stripeId, quantity: 1 }); } const { error } = await stripe.redirectToCheckout({ mode: 'payment', lineItems: lineItems, customerEmail: email, shippingAddressCollection: { allowedCountries: ['IT','US','FR','DE','ES'] }, successUrl: window.location.href + '?success=true', cancelUrl: window.location.href, }); if(error) alert(error.message); }
        async function subscribeNewsletter() { let email = document.getElementById('newsletter-email').value; let name = document.getElementById('newsletter-name').value || "Friend"; if(!email || !email.includes('@')) { alert("INVALID EMAIL"); return; } let btn = document.querySelector('#ov-newsletter button'); btn.innerText = "WAIT..."; try { if(supabase) await supabase.from('newsletter').insert([{ email: email }]); await emailjs.send(emailService, emailTemplate, { to_name: name, user_email: email, message: "Welcome!" }); alert("WELCOME!"); closeAll(); } catch(e) { console.error(e); alert("YOU ARE IN!"); closeAll(); } btn.innerText = "SUBSCRIBE"; }
        
        // --- 8. AZIONI DATABASE ---
        async function saveAllChanges() { if(!supabase) return; let updates = []; inventory.forEach((t, i) => { if(document.getElementById(`dn-${t.id}`)) { updates.push({ id: t.id, name: document.getElementById(`dn-${t.id}`).value, img: document.getElementById(`di-${t.id}`).value, price: parseInt(document.getElementById(`dp-${t.id}`).value), stripeId: document.getElementById(`ds-${t.id}`).value, sizes: document.getElementById(`dz-${t.id}`).value }); } }); await supabase.from('products').upsert(updates); let newBg = document.getElementById('db-bg-url').value; if(newBg) await supabase.from('settings').upsert({ id: 1, bg_url: newBg }).catch(()=>{}); alert("SAVED!"); location.reload(); }
        async function createNewItem() { if(!supabase) return; let newId = inventory.length > 0 ? Math.max(...inventory.map(i=>i.id)) + 1 : 0; await supabase.from('products').insert([{ id: newId, name: 'NEW', img: 'logo_ff_loader.png', price: 0, stripeId: '', sizes: 'ONE SIZE' }]); alert("CREATED! RELOAD."); location.reload(); }
        async function deleteItemDB(id) { if(!confirm("DELETE?")) return; await supabase.from('products').delete().eq('id', id); location.reload(); }
        
        function closeAll(){ document.querySelectorAll('.overlay').forEach(e=>e.style.display='none'); }
        function openOv(id){ playSfx(); closeAll(); let o=document.getElementById(id); o.style.display='flex'; let w=o.querySelector('.mac-window'); if(w){w.style.position='relative';w.style.left='auto';w.style.top='auto';} if(id==='ov-checkout') updateCartUI(); }
        function renderAvatars(){ let g=document.getElementById('avatar-grid'); for(let i=0;i<8;i++){ let u=`https://api.dicebear.com/7.x/pixel-art/svg?seed=ff${i}`; let d=document.createElement('div'); d.style.border='2px solid #000'; d.innerHTML=`<img src="${u}" style="width:100%">`; d.onclick=()=>{document.getElementById('profile-img-big').src=u;playSfx();}; if(i===0)d.click(); g.appendChild(d); } }
        if(window.location.search.includes('success')){ alert("ORDER CONFIRMED. WELCOME TO THE FAMILY."); cart=[]; updateCartUI(); }
    </script>
</body>
</html>
