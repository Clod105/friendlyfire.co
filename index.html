<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STREET PONGO - WALL EDITION</title>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;900&display=swap" rel="stylesheet">
    <style>
        /* --- VARIABILI COLORI (Sincronizzate) --- */
        :root {
            --wall-color: #4f634f;      /* Verde Muro Base */
            --shelf-color: #3e4f3e;     /* Colore Mensola */
            --accent-color: #e07a38;    /* Arancione Pongo (Tasti/Popup) */
            --accent-hover: #b35e27;
            --text-main: #f0f0f0;
            --text-on-accent: #2f3b2f;
        }

        /* --- GOD MODE (Palette Black & Gold) --- */
        body.god-mode {
            --wall-color: #1a1a1a;      /* Muro Nero */
            --shelf-color: #000000;     /* Mensola Nera */
            --accent-color: #ffd700;    /* ORO */
            --accent-hover: #d4af37;
            --text-main: #ffd700;
            --text-on-accent: #000000;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--wall-color);
            color: var(--text-main);
            font-family: 'Rubik', sans-serif;
            height: 100vh;
            overflow: hidden;
            cursor: none;
            transition: background-color 0.5s ease;
            
            /* Texture Muro "Pongo" */
            background-image: radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* --- CURSORE CUSTOM --- */
        .cursor-dot {
            width: 30px;
            height: 30px;
            background-color: var(--accent-color);
            border: 3px solid #fff;
            border-radius: 50%;
            position: fixed;
            top: 0; left: 0;
            z-index: 9999;
            pointer-events: none;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: width 0.2s, background-color 0.5s;
        }
        
        .cursor-dot.hovered {
            width: 50px; height: 50px;
            background-color: transparent;
            border-color: var(--accent-color);
        }

        /* --- LAYOUT GENERALE --- */
        .main-container {
            max-width: 1000px;
            margin: 0 auto;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        header {
            text-align: center;
            font-size: 2.5rem;
            text-transform: uppercase;
            padding: 20px;
            text-shadow: 4px 4px 0 rgba(0,0,0,0.2);
            cursor: pointer;
        }

        .god-badge {
            font-size: 0.8rem;
            background: #ffd700;
            color: black;
            padding: 2px 8px;
            border-radius: 5px;
            vertical-align: middle;
            display: none;
        }
        body.god-mode .god-badge { display: inline-block; }

        /* --- SCAFFALI FLUTTUANTI (Senza Armadio) --- */
        .shelves-container {
            flex: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 60px; /* Spazio tra le mensole */
            padding: 0 50px;
        }

        .shelf {
            /* Mensola 3D stilizzata */
            background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.2) 100%);
            border-bottom: 20px solid var(--shelf-color); /* Spessore mensola */
            display: flex;
            justify-content: space-around;
            align-items: flex-end; /* Allinea i prodotti alla base */
            padding-bottom: 10px;
            position: relative;
            
            /* Ombra sul muro */
            box-shadow: 0 30px 30px -10px rgba(0,0,0,0.4);
        }

        /* --- PRODOTTI --- */
        .product-card {
            text-align: center;
            position: relative;
            transition: transform 0.2s;
            padding: 10px;
        }

        .product-card:hover {
            transform: translateY(-10px) scale(1.1);
        }

        .icon-display {
            font-size: 5rem; /* Icone più grandi senza la card intorno */
            display: block;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.3));
        }

        .price-tag {
            background: var(--text-main);
            color: var(--text-on-accent);
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 900;
            font-size: 0.9rem;
            position: absolute;
            top: 0; right: 0;
            transform: rotate(10deg);
        }

        h3 { margin: 5px 0; font-size: 1rem; opacity: 0.8; }

        /* --- TASTO "PRENDI" UNIFICATO --- */
        .btn-action {
            background-color: var(--accent-color);
            color: var(--text-on-accent);
            border: none;
            padding: 8px 20px;
            font-weight: 900;
            border-radius: 20px;
            cursor: none;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
            transition: all 0.2s;
        }

        .btn-action:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        /* --- ZAINO (Bottom Bar) --- */
        .backpack-bar {
            height: 100px;
            background: rgba(0,0,0,0.2);
            border-radius: 20px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 20px;
            margin-top: auto; /* Spinge in basso */
        }

        .backpack-label {
            font-weight: bold;
            text-transform: uppercase;
            width: 100px;
            line-height: 1.2;
        }

        .cart-items {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            flex: 1;
        }

        .cart-item {
            background: var(--text-main);
            color: #000;
            padding: 5px 15px;
            border-radius: 50px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
        }

        .remove-btn {
            background: var(--accent-color);
            width: 20px; height: 20px;
            border-radius: 50%;
            border: none;
            color: var(--text-on-accent);
            font-weight: bold;
            cursor: none;
        }

        /* --- POPUP NOTIFICHE --- */
        #popup {
            position: fixed;
            bottom: 120px; /* Sopra lo zaino */
            left: 50%;
            transform: translateX(-50%) translateY(50px);
            background-color: var(--accent-color);
            color: var(--text-on-accent);
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: 900;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        
        #popup.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

    </style>
</head>
<body>

    <div class="cursor-dot" id="cursor"></div>

    <div class="main-container">
        <header onclick="toggleGodMode()">
            Street Pongo <span class="god-badge">GOD</span>
        </header>

        <div class="shelves-container">
            
            <div class="shelf">
                <div class="product-card">
                    <span class="icon-display">🧢</span>
                    <div class="price-tag">45€</div>
                    <h3>Cappello Rebel</h3>
                    <button class="btn-action" onclick="addToCart('Cappello Rebel')">PRENDI</button>
                </div>
                <div class="product-card">
                    <span class="icon-display">🚁</span>
                    <div class="price-tag">120€</div>
                    <h3>Drone Scout</h3>
                    <button class="btn-action" onclick="addToCart('Drone Scout')">PRENDI</button>
                </div>
            </div>

            <div class="shelf">
                <div class="product-card">
                    <span class="icon-display">🪖</span>
                    <div class="price-tag">85€</div>
                    <h3>Casco Clay</h3>
                    <button class="btn-action" onclick="addToCart('Casco Clay')">PRENDI</button>
                </div>
                <div class="product-card">
                    <span class="icon-display">💣</span>
                    <div class="price-tag">15€</div>
                    <h3>Pongo Granata</h3>
                    <button class="btn-action" onclick="addToCart('Pongo Granata')">PRENDI</button>
                </div>
                <div class="product-card">
                    <span class="icon-display">👟</span>
                    <div class="price-tag">90€</div>
                    <h3>Sneakers</h3>
                    <button class="btn-action" onclick="addToCart('Sneakers')">PRENDI</button>
                </div>
            </div>

        </div>

        <div class="backpack-bar">
            <div class="backpack-label">Zaino Tattico</div>
            <div class="cart-items" id="cart-display">
                </div>
        </div>
    </div>

    <div id="popup">Oggetto Aggiunto!</div>

    <script>
        const STORAGE_KEY = 'street_pongo_v4_cart';
        
        // --- 1. CURSORE ---
        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        function refreshHover() {
            const els = document.querySelectorAll('button, header');
            els.forEach(el => {
                el.addEventListener('mouseenter', () => cursor.classList.add('hovered'));
                el.addEventListener('mouseleave', () => cursor.classList.remove('hovered'));
            });
        }

        // --- 2. LOGICA CARRELLO ---
        function getCart() { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
        function saveCart(c) { localStorage.setItem(STORAGE_KEY, JSON.stringify(c)); renderCart(); }

        function addToCart(item) {
            const cart = getCart();
            cart.push(item);
            saveCart(cart);
            showPopup(`Preso: ${item}`);
        }

        function removeFromCart(index) {
            const cart = getCart();
            cart.splice(index, 1);
            saveCart(cart);
        }

        function renderCart() {
            const cart = getCart();
            const display = document.getElementById('cart-display');
            display.innerHTML = '';
            
            if (cart.length === 0) display.innerHTML = '<span style="opacity:0.5; padding:10px;">Vuoto...</span>';

            cart.forEach((item, idx) => {
                const el = document.createElement('div');
                el.className = 'cart-item';
                el.innerHTML = `${item} <button class="remove-btn" onclick="removeFromCart(${idx})">X</button>`;
                display.appendChild(el);
            });
            refreshHover();
        }

        // --- 3. POPUP ---
        function showPopup(msg) {
            const p = document.getElementById('popup');
            p.innerText = msg;
            p.classList.add('show');
            setTimeout(() => p.classList.remove('show'), 1500);
        }

        // --- 4. GOD MODE ---
        function toggleGodMode() {
            document.body.classList.toggle('god-mode');
            const isOn = document.body.classList.contains('god-mode');
            showPopup(isOn ? "GOD MODE ON" : "Modalità Standard");
        }

        // INIT
        renderCart();
        refreshHover();
    </script>
</body>
</html>
