<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FRIENDLYFIRE V1000 | GOD MODE</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        /* --- 1. SETTAGGI BASE --- */
        :root { --red: #ff3a3a; --green: #4AF626; --bg-pongo: #2e4a1e; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; outline: none; }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; 
            font-family: 'Press Start 2P', cursive; 
            background-color: var(--bg-pongo);
            background-image: url('sfondo2.jpg'); 
            background-size: cover; background-position: center; background-repeat: no-repeat;
            overscroll-behavior: none; position: fixed; touch-action: none;
        }

        /* --- 2. LOADER BLINDATO --- */
        #loader-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background-color: #ffffff; z-index: 2147483647; /* MASSIMO POSSIBILE */
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            transition: opacity 0.5s ease;
        }
        
        .loader-logo { width: 80%; max-width: 280px; margin-bottom: 20px; object-fit: contain; }
        .loader-gif { width: 200px; height: 200px; object-fit: contain; margin-bottom: 20px; mix-blend-mode: multiply; }
        
        .bar-container { 
            width: 250px; height: 30px; background: #fff; 
            border: 4px solid #000; padding: 4px; margin-bottom: 20px;
            box-shadow: 6px 6px 0 rgba(0,0,0,0.1);
        }
        .bar-fill { 
            height: 100%; width: 0%; background-color: var(--green); 
            transition: width 0.2s linear; 
        }

        /* TASTO START CHE FUNZIONA PER FORZA */
        #start-btn { 
            display: none; 
            background: #000; color: #fff; 
            border: 4px solid #000; padding: 20px 60px; 
            font-family: inherit; font-size: 16px; 
            cursor: pointer; text-transform: uppercase; 
            box-shadow: 8px 8px 0 #999;
            pointer-events: auto !important; /* FORZA IL CLICK */
            touch-action: manipulation;
            position: relative; z-index: 2147483647;
        }
        #start-btn:active { transform: scale(0.95); background: #333; }

        /* --- 3. HEADER --- */
        header { 
            position: fixed; top: 0; left: 0; width: 100%; height: 90px; 
            z-index: 10000; display: flex; justify-content: space-between; align-items: center;
            padding: 0 15px; padding-top: env(safe-area-inset-top, 10px);
            pointer-events: none; 
        }
        .h-btn { 
            width: 65px; height: 65px; object-fit: contain; pointer-events: auto; 
            cursor: pointer; filter: drop-shadow(0 4px 0 rgba(0,0,0,0.5));
            transition: transform 0.1s;
        }
        .h-btn:active { transform: scale(0.9); }
        
        .pongo-anim { animation: sq 0.3s ease; } 
        @keyframes sq { 0%{transform:scale(1);} 50%{transform:scale(0.8);} 100%{transform:scale(1);} }

        #tank-badge { 
            position: absolute; top: 0; right: -5px; background: var(--red); 
            color: white; border: 2px solid #000; font-size: 9px; padding: 4px; 
            border-radius: 50%; display: none; 
        }

        /* --- 4. SHOP & ITEMS --- */
        #shop-view { 
            width: 100vw; height: 100%; 
            display: flex; overflow-x: auto; overflow-y: hidden; 
            scroll-snap-type: x mandatory; 
            padding-top: 100px; 
            -webkit-overflow-scrolling: touch;
        }
        #shop-view::-webkit-scrollbar { display: none; }
        
        .shop-page { 
            min-width: 100vw; height: 100%; 
            display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr); 
            gap: 10px; padding: 0 15px 120px 15px; 
            scroll-snap-align: start; align-content: start;
        }

        .item { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            position: relative; 
            /* Permette lo scroll verticale se necessario, ma orizzontale lo gestisce il container */
            touch-action: pan-y; 
        }
        .item img { 
            width: 85px; height: 85px; object-fit: contain; pointer-events: none; 
            filter: drop-shadow(0 5px 6px rgba(0,0,0,0.5));
        }
        .label { 
            font-family: sans-serif; font-weight: 900; font-size: 8px; 
            color: #fff; text-shadow: 0 1px 2px #000; margin-top: 5px; 
        }

        .sold-out { opacity: 0.5; filter: grayscale(100%); pointer-events: none; }
        .sold-out::after { 
            content: "SOLD OUT"; position: absolute; background: var(--red); color: white; 
            font-size: 8px; padding: 2px 4px; transform: rotate(-15deg); border: 1px solid #fff;
        }

        /* --- 5. GHOST (Oggetto trascinato) --- */
        .ghost { 
            position: fixed; z-index: 99999; pointer-events: none; 
            width: 85px !important; height: 85px !important; 
            opacity: 0.9; transform: scale(1.1); 
        }
        .sucked { transition: 0.4s; transform: scale(0) rotate(720deg) !important; opacity: 0; }

        /* --- 6. WINDOWS (Carrello, Admin) --- */
        .window {
            display: none; position: fixed; top: 15%; left: 5%; width: 90%; max-width: 380px;
            background: #fff; border: 3px solid #000; box-shadow: 10px 10px 0 rgba(0,0,0,0.6);
            z-index: 50000; flex-direction: column; max-height: 75vh;
        }
        .win-h { 
            background: #eee; border-bottom: 2px solid #000; padding: 12px; 
            display: flex; justify-content: space-between; align-items: center; 
            font-weight: bold; font-size: 10px; cursor: move;
        }
        .win-x { 
            background: var(--red); width: 20px; height: 20px; border: 2px solid #000; cursor: pointer; 
        }
        .win-b { padding: 15px; overflow-y: auto; }
        
        .btn { 
            width: 100%; padding: 12px; margin-top: 10px; background: #000; color: #fff; 
            border: none; font-size: 10px; cursor: pointer; font-family: inherit; 
        }
        .btn:active { transform: translateY(2px); }
        .row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #ccc; padding: 8px 0; font-size: 10px; }
        input { width: 100%; padding: 8px; border: 2px solid #000; font-family: monospace; font-size: 10px; }

        /* --- 7. FOOTER --- */
        footer { 
            position: fixed; bottom: 20px; width: 100%; display: flex; justify-content: center; 
            z-index: 9000; pointer-events: none; padding-bottom: env(safe-area-inset-bottom, 10px);
        }
        .brand { width: 160px; pointer-events: auto; cursor: pointer; padding: 10px; }

    </style>
</head>
<body>

    <div id="loader-overlay">
        <img src="logo_ff_loader.png" class="loader-logo" onerror="this.src='https://placehold.co/300x80?text=FRIENDLYFIRE'">
        <img src="loadernob.gif" class="loader-gif" onerror="this.src='https://placehold.co/200?text=LOADING'">
        <div class="bar-container"><div id="bar-fill" class="bar-fill"></div></div>
        
        <button id="start-btn" onclick="go()" ontouchstart="go()" onmousedown="go()">ENTER WORLD</button>
    </div>

    <audio id="sfx-eat" src="suono_gnam.mp3" preload="auto"></audio>

    <header>
        <img src="mondo_pongo.PNG" class="h-btn" onclick="anim(this); show('win-news')" onerror="this.src='https://placehold.co/60?text=NEWS'">
        <img src="fuochini_centrali.png" class="h-btn" onclick="anim(this); show('win-prof')" onerror="this.src='https://placehold.co/60?text=PROF'">
        <div style="position:relative;">
            <img src="tank_header.PNG" id="tank-target" class="h-btn" onclick="anim(this); toggle('win-cart')" onerror="this.src='https://placehold.co/60?text=TANK'">
            <div id="tank-badge">0</div>
        </div>
    </header>

    <div id="shop-view">
        <div id="page-1" class="shop-page"></div>
        <div id="page-2" class="shop-page"></div>
    </div>

    <footer><img src="brand_name.png" class="brand" onclick="chkAdm()" onerror="this.src='https://placehold.co/150x40?text=ADMIN'"></footer>

    <div id="win-cart" class="window">
        <div class="win-h" onmousedown="dS(event,'win-cart')" ontouchstart="dS(event,'win-cart')"><span>IL TUO TANK</span><div class="win-x" onclick="hideAll()"></div></div>
        <div class="win-b">
            <div id="cart-list">VUOTO</div>
            <div id="cart-tot" style="margin-top:10px; border-top:2px solid #000; font-weight:bold;">TOT: 0€</div>
            <button class="btn" onclick="pay()">ORDINA / PRENOTA</button>
            <button class="btn" style="background:var(--red);" onclick="cart=[];upCart();">SVUOTA</button>
        </div>
    </div>

    <div id="win-admin" class="window">
        <div class="win-h" onmousedown="dS(event,'win-admin')" ontouchstart="dS(event,'win-admin')"><span>ADMIN</span><div class="win-x" onclick="hideAll()"></div></div>
        <div class="win-b">
            <div style="font-size:8px;">SFONDO URL:</div>
            <div style="display:flex; gap:5px;"><input id="bg-in"><button style="width:40px;" onclick="setBg()">OK</button></div>
            <hr><div id="adm-list"></div>
            <button class="btn" style="background:blue;" onclick="addItm()">+ NUOVO</button>
            <button class="btn" onclick="saveAdm()">SALVA</button>
        </div>
    </div>

    <div id="win-news" class="window">
        <div class="win-h"><span>NEWSLETTER</span><div class="win-x" onclick="hideAll()"></div></div>
        <div class="win-b"><input id="nm" type="email" placeholder="Email"><button class="btn" onclick="sub()">ISCRIVITI</button></div>
    </div>

    <div id="win-prof" class="window">
        <div class="win-h"><span>PROFILO</span><div class="win-x" onclick="hideAll()"></div></div>
        <div class="win-b"><p>COMING SOON</p></div>
    </div>

    <script>
        // CONFIG
        const CFG={u:'https://jwifyapbnsbbpsrstrow.supabase.co',k:'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp3aWZ5YXBibnNiYnBzcnN0cm93Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA1NzM1OTUsImV4cCI6MjA4NjE0OTU5NX0.dmhdHZRJuYo7-OlpSR3S5ca7ink9w6a5DM-u2ac4c2Y',eK:'BThMV2knP0VG0s4nr',eS:'service_4scv4hn',eT:'template_8opoo1v'};
        
        let items=[{id:0,name:'CAP',p:45,q:10,i:'image_cap.PNG'},{id:1,name:'TEE',p:65,q:5,i:'image_tee.PNG'},{id:2,name:'STICKER',p:10,q:100,i:'image_sticker.PNG'},{id:3,name:'HOODIE',p:85,q:0,i:'image_hoodie.PNG'},{id:4,name:'PANT',p:70,q:8,i:'image_pant.PNG'},{id:5,name:'SOCKS',p:15,q:20,i:'image_socks.PNG'}];
        let cart=[], sb=null, taps=0;

        // --- 1. LOADER FORCE ---
        window.onload=()=>{
            let p=0, b=document.getElementById('bar-fill'), btn=document.getElementById('start-btn');
            let t=setInterval(()=>{ p+=2; if(b)b.style.width=p+'%'; if(p>=100){clearInterval(t); if(btn)btn.style.display='block';} },30);
            // Safety
            setTimeout(()=>{ if(btn.style.display==='none'){ b.style.width='100%'; btn.style.display='block'; } },2500);
        };

        function go(){
            let o=document.getElementById('loader-overlay');
            o.style.opacity='0'; o.style.pointerEvents='none';
            setTimeout(()=>{o.style.display='none'},500);
            try{document.getElementById('sfx-eat').play();}catch(e){}
            try{
                if(window.supabase) { sb=window.supabase.createClient(CFG.u,CFG.k); loadDB(); }
                if(window.emailjs) emailjs.init(CFG.eK);
            }catch(e){}
            draw();
        }

        async function loadDB(){ if(sb){ let{data}=await sb.from('products').select('*'); if(data&&data.length){ items=data.map(x=>({id:x.id,name:x.name,p:x.price,q:x.qty,i:x.img})); draw(); } } }

        // --- 2. RENDER & PHYSICS ---
        function draw(){
            document.getElementById('page-1').innerHTML=items.slice(0,9).map((x,i)=>mkC(x,i)).join('');
            document.getElementById('page-2').innerHTML=items.slice(9,18).map((x,i)=>mkC(x,i+9)).join('');
        }
        function mkC(x,i){
            let sold=x.q<=0;
            return `<div class="item ${sold?'sold-out':''}" id="i-${i}" ontouchstart="hld(event,${i})" onmousedown="hld(event,${i})">
            <img src="${x.i}" onerror="this.src='https://placehold.co/80?text=${x.name}'"><div class="label">${x.name}</div><div class="label">${x.p}€</div></div>`;
        }

        let tmr=null;
        function hld(e,i){
            let el=document.getElementById(`i-${i}`), ev=e.touches?e.touches[0]:e;
            let r=el.getBoundingClientRect();
            // Timer: se tieni premuto 0.3s -> Drag. Se muovi prima -> Scroll.
            tmr=setTimeout(()=>{ 
                if(navigator.vibrate)navigator.vibrate(20); 
                drag(i,r,ev.clientX,ev.clientY); 
            },300);
            
            let clr=()=>{ clearTimeout(tmr); };
            el.addEventListener('touchend',clr,{once:true}); el.addEventListener('touchmove',clr,{once:true}); el.addEventListener('mouseup',clr,{once:true});
        }

        function drag(i,r,sx,sy){
            let g=document.getElementById(`i-${i}`).cloneNode(true);
            g.className='ghost'; g.style.left=r.left+'px'; g.style.top=r.top+'px';
            document.body.appendChild(g);
            let ox=sx-r.left, oy=sy-r.top;

            function mv(e){
                e.preventDefault(); // Blocca scroll ORA
                let t=e.touches?e.touches[0]:e;
                g.style.left=(t.clientX-ox)+'px'; g.style.top=(t.clientY-oy)+'px';
            }
            function end(){
                document.removeEventListener('touchmove',mv); document.removeEventListener('touchend',end);
                document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',end);
                
                let tk=document.getElementById('tank-target').getBoundingClientRect();
                let gx=parseInt(g.style.left)+40, gy=parseInt(g.style.top)+40;
                
                if(Math.hypot(gx-(tk.left+30), gy-(tk.top+30))<60){
                    g.classList.add('sucked'); try{document.getElementById('sfx-eat').play();}catch(e){}
                    setTimeout(()=>{ cart.push(items[i]); upCart(); g.remove(); show('win-cart'); },400);
                } else {
                    g.style.display='none'; let bel=document.elementFromPoint(gx,gy); g.style.display='block';
                    let trg=bel?bel.closest('.item'):null;
                    if(trg && trg.id!==`i-${i}` && !trg.classList.contains('sold-out')){
                        let ti=parseInt(trg.id.split('-')[1]);
                        [items[i],items[ti]]=[items[ti],items[i]]; draw();
                    }
                    g.remove();
                }
            }
            document.addEventListener('touchmove',mv,{passive:false}); document.addEventListener('touchend',end);
            document.addEventListener('mousemove',mv); document.addEventListener('mouseup',end);
        }

        // --- 3. UTILS ---
        function upCart(){
            document.getElementById('tank-badge').innerText=cart.length;
            document.getElementById('tank-badge').style.display=cart.length?'block':'none';
            document.getElementById('cart-list').innerHTML=cart.length?cart.map((x,n)=>`<div class="row"><span>${x.name}</span><span>${x.p}€</span><span onclick="cart.splice(${n},1);upCart()" style="color:red;">X</span></div>`).join(''):"VUOTO";
            document.getElementById('cart-tot').innerText="TOT: "+cart.reduce((a,b)=>a+parseInt(b.p),0)+"€";
        }
        async function pay(){
            if(!cart.length)return alert("Vuoto");
            let m=prompt("Email:");
            if(m){
                if(sb) await sb.from('newsletter').insert([{email:m}]);
                if(window.emailjs) emailjs.send(CFG.eS,CFG.eT,{user_email:m,message:"ORDINE"});
                alert("Grazie!"); cart=[]; upCart(); hideAll();
            }
        }
        async function sub(){ let m=document.getElementById('nm').value; if(m&&sb) await sb.from('newsletter').insert([{email:m}]); alert("Iscritto"); hideAll(); }

        // ADMIN
        function chkAdm(){ taps++; if(taps>=5){ if(prompt("PWD")==="FRIENDLYFIRE26") showAdm(); taps=0; } setTimeout(()=>taps=0,800); }
        function showAdm(){
            document.getElementById('adm-list').innerHTML=items.map((x,i)=>`<div class="row"><input id="n${i}" value="${x.name}"><input id="p${i}" value="${x.p}" type="number" style="width:30px"><input id="q${i}" value="${x.q}" type="number" style="width:30px"><button style="color:red;" onclick="if(confirm('Del?')){items.splice(${i},1);showAdm();}">X</button></div>`).join('');
            show('win-admin');
        }
        function addItm(){ items.push({id:Date.now(),name:'NEW',p:0,q:1,i:'logo_ff_loader.png'}); showAdm(); }
        async function saveAdm(){ 
            items.forEach((x,i)=>{ let n=document.getElementById(`n${i}`); if(n){ x.name=n.value; x.p=document.getElementById(`p${i}`).value; x.q=document.getElementById(`q${i}`).value; } });
            draw(); if(sb) await sb.from('products').upsert(items.map(x=>({name:x.name,price:x.p,qty:x.q,img:x.i}))); alert("Salvato"); hideAll();
        }
        function setBg(){ document.body.style.backgroundImage=`url('${document.getElementById('bg-in').value}')`; }

        // UI
        function anim(el){ el.classList.remove('pongo-anim'); void el.offsetWidth; el.classList.add('pongo-anim'); try{document.getElementById('sfx-eat').play();}catch(e){} }
        function show(id){ hideAll(); document.getElementById(id).style.display='flex'; }
        function toggle(id){ let w=document.getElementById(id); if(w.style.display==='flex') hideAll(); else { show(id); upCart(); } }
        function hideAll(){ document.querySelectorAll('.window').forEach(w=>w.style.display='none'); }

        // WIN DRAG
        let de=null,dx=0,dy=0;
        function dS(e,id){
            de=document.getElementById(id); let t=e.touches?e.touches[0]:e, r=de.getBoundingClientRect();
            dx=t.clientX-r.left; dy=t.clientY-r.top;
            function mv(ev){ let c=ev.touches?ev.touches[0]:ev; de.style.left=(c.clientX-dx)+'px'; de.style.top=(c.clientY-dy)+'px'; ev.preventDefault(); }
            function st(){ document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',st); document.removeEventListener('touchmove',mv); document.removeEventListener('touchend',st); }
            document.addEventListener('mousemove',mv); document.addEventListener('mouseup',st); document.addEventListener('touchmove',mv,{passive:false}); document.addEventListener('touchend',st);
        }
    </script>
</body>
</html>
