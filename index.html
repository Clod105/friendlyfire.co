<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FRIENDLYFIRE V500 | PLATINUM</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        /* --- 1. BASE & SFONDO --- */
        :root { --red: #ff3a3a; --green: #4AF626; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; outline: none; }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; 
            font-family: 'Press Start 2P', cursive; 
            background-color: #333; 
            /* SFONDO RICHIESTO (Assicurati che il file sia sfondo2.jpg) */
            background-image: url('sfondo2.jpg'); 
            background-size: cover; background-position: center; background-repeat: no-repeat;
            overscroll-behavior: none; position: fixed; 
        }

        /* --- 2. LOADER --- */
        #loader-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background-color: #ffffff; z-index: 999999999; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
        }
        .loader-logo { width: 280px; max-width: 80%; margin-bottom: 30px; object-fit: contain; }
        .loader-gif { width: 180px; height: 180px; object-fit: contain; margin-bottom: 30px; mix-blend-mode: multiply;}
        
        .bar-container { width: 220px; height: 25px; border: 4px solid #000; padding: 3px; background: #fff; }
        .bar-fill { height: 100%; width: 0%; background-color: var(--green); animation: load 2.5s forwards; }
        @keyframes load { to { width: 100%; } }

        #start-btn { 
            display: none; margin-top: 20px; background: #000; color: #fff; 
            border: 4px solid #000; padding: 15px 40px; font-size: 12px; cursor: pointer;
            animation: pop 0.3s;
        }
        @keyframes pop { from{transform:scale(0);} to{transform:scale(1);} }

        /* --- 3. HEADER --- */
        header { 
            position: fixed; top: 0; left: 0; width: 100%; height: 90px; 
            z-index: 10000; display: flex; justify-content: space-between; align-items: center;
            padding: 0 15px; padding-top: env(safe-area-inset-top, 10px);
            pointer-events: none; 
        }
        .h-btn { 
            width: 65px; height: 65px; object-fit: contain; pointer-events: auto; 
            cursor: pointer; filter: drop-shadow(0 4px 0 rgba(0,0,0,0.5));
            transition: transform 0.1s;
        }
        .h-btn:active { transform: scale(0.9); }
        
        #tank-badge { 
            position: absolute; top: 0; right: -5px; background: var(--red); 
            color: white; border: 2px solid #000; font-size: 9px; padding: 4px; 
            border-radius: 50%; display: none; 
        }

        /* --- 4. SHOP & SCROLL (FIXATO) --- */
        #shop-slider { 
            width: 100vw; height: 100%; 
            display: flex; /* Flexbox per mettere le pagine in fila */
            overflow-x: auto; overflow-y: hidden; 
            scroll-snap-type: x mandatory; /* Scroll a scatti di pagina */
            padding-top: 100px;
            -webkit-overflow-scrolling: touch;
        }
        #shop-slider::-webkit-scrollbar { display: none; }
        
        .shop-page { 
            min-width: 100vw; height: 100%; 
            display: grid; grid-template-columns: repeat(3, 1fr); 
            grid-template-rows: repeat(4, 1fr); 
            gap: 10px; padding: 0 15px 100px 15px; 
            scroll-snap-align: start; 
            align-content: start;
        }

        .item { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            position: relative; 
            /* Importante: lascia gestire il touch a JS ma permette lo scroll */
            touch-action: pan-y; 
        }
        .item img { 
            width: 85px; height: 85px; object-fit: contain; pointer-events: none; 
            filter: drop-shadow(0 5px 6px rgba(0,0,0,0.5));
        }
        .label { 
            font-family: sans-serif; font-weight: 900; font-size: 9px; 
            color: #fff; text-shadow: 0 1px 2px #000; margin-top: 5px; 
        }

        /* --- 5. GHOST (ICONE CHE NON DIVENTANO GIGANTI) --- */
        .ghost { 
            position: fixed; z-index: 99999; pointer-events: none; 
            /* DIMENSIONI FORZATE PER EVITARE L'INGRANDIMENTO */
            width: 85px !important; height: 85px !important; 
            opacity: 0.9; transform: scale(1.1); 
        }
        .sucked { transition: 0.4s; transform: scale(0) rotate(360deg) !important; opacity: 0; }

        /* --- 6. POPUPS & WINDOWS --- */
        .window {
            display: none; position: fixed; top: 15%; left: 5%; width: 90%; max-width: 380px;
            background: #fff; border: 3px solid #000; box-shadow: 10px 10px 0 rgba(0,0,0,0.6);
            z-index: 50000; flex-direction: column; max-height: 70vh;
        }
        .win-h { 
            background: #eee; border-bottom: 2px solid #000; padding: 10px; 
            display: flex; justify-content: space-between; align-items: center; 
            font-weight: bold; font-size: 10px;
        }
        .win-x { background: var(--red); width: 20px; height: 20px; border: 2px solid #000; cursor: pointer; }
        .win-b { padding: 15px; overflow-y: auto; }
        
        .btn { width: 100%; padding: 12px; margin-top: 10px; background: #000; color: #fff; border: none; font-size: 10px; cursor: pointer; font-family: inherit; }
        .row { display: flex; justify-content: space-between; border-bottom: 1px dashed #ccc; padding: 5px 0; font-size: 10px; align-items: center; }
        input { width: 100%; padding: 8px; border: 2px solid #000; font-family: monospace; }

        /* --- 7. FOOTER ADMIN --- */
        footer { 
            position: fixed; bottom: 20px; width: 100%; 
            display: flex; justify-content: center; z-index: 9000; 
            pointer-events: none; padding-bottom: env(safe-area-inset-bottom, 10px);
        }
        .brand { 
            width: 160px; pointer-events: auto; cursor: pointer; 
            /* Area di tocco aumentata invisibilmente */
            padding: 10px; 
        }

    </style>
</head>
<body>

    <div id="loader-overlay">
        <img src="logo_ff_loader.png" class="loader-logo" onerror="this.src='https://placehold.co/300x80?text=FRIENDLYFIRE'">
        <img src="loadernob.gif" class="loader-gif" onerror="this.src='https://placehold.co/200?text=LOADING'">
        <div class="bar-container"><div class="bar-fill"></div></div>
        <button id="start-btn" onclick="startApp()">START</button>
    </div>

    <audio id="sfx-eat" src="suono_gnam.mp3" preload="auto"></audio>

    <header>
        <img src="mondo_pongo.PNG" class="h-btn" onclick="uiAnim(this); openWin('win-news')" onerror="this.src='https://placehold.co/60?text=NEWS'">
        <img src="fuochini_centrali.png" class="h-btn" onclick="uiAnim(this); openWin('win-prof')" onerror="this.src='https://placehold.co/60?text=PROF'">
        <div style="position:relative;">
            <img src="tank_header.PNG" id="tank-target" class="h-btn" onclick="uiAnim(this); toggleWin('win-cart')" onerror="this.src='https://placehold.co/60?text=TANK'">
            <div id="tank-badge">0</div>
        </div>
    </header>

    <div id="shop-slider">
        <div id="page-1" class="shop-page"></div>
        <div id="page-2" class="shop-page"></div>
    </div>

    <footer>
        <img src="brand_name.png" class="brand" onclick="checkAdmin()" onerror="this.src='https://placehold.co/150x40?text=ADMIN'">
    </footer>

    <div id="win-cart" class="window">
        <div class="win-h"><span>IL TUO TANK</span><div class="win-x" onclick="closeAll()"></div></div>
        <div class="win-b">
            <div id="cart-list">VUOTO</div>
            <div id="cart-tot" style="margin-top:10px; font-weight:bold; border-top:2px solid #000; padding-top:5px;">TOT: 0€</div>
            <button class="btn" onclick="checkout()">ORDINA</button>
            <button class="btn" style="background:var(--red);" onclick="cart=[];updateCart();">SVUOTA</button>
        </div>
    </div>

    <div id="win-admin" class="window">
        <div class="win-h"><span>ADMIN PANEL</span><div class="win-x" onclick="closeAll()"></div></div>
        <div class="win-b">
            <div id="adm-list"></div>
            <button class="btn" onclick="saveAdmin()">SALVA</button>
        </div>
    </div>

    <div id="win-news" class="window">
        <div class="win-h"><span>NEWSLETTER</span><div class="win-x" onclick="closeAll()"></div></div>
        <div class="win-b">
            <input id="in-email" type="email" placeholder="Email...">
            <button class="btn" onclick="doSub()">ISCRIVITI</button>
        </div>
    </div>

    <div id="win-prof" class="window">
        <div class="win-h"><span>PROFILO</span><div class="win-x" onclick="closeAll()"></div></div>
        <div class="win-b"><p>COMING SOON</p></div>
    </div>

    <script>
        // --- DATA & CONFIG ---
        const CFG = {
            sbUrl: 'https://jwifyapbnsbbpsrstrow.supabase.co',
            sbKey: 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp3aWZ5YXBibnNiYnBzcnN0cm93Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA1NzM1OTUsImV4cCI6MjA4NjE0OTU5NX0.dmhdHZRJuYo7-OlpSR3S5ca7ink9w6a5DM-u2ac4c2Y',
            emKey: 'BThMV2knP0VG0s4nr', emSrv: 'service_4scv4hn', emTmp: 'template_8opoo1v'
        };

        // Inventario più ricco per riempire le pagine
        let items = [
            {id:0, name:'CAP', price:45, img:'image_cap.PNG'},
            {id:1, name:'TEE', price:65, img:'image_tee.PNG'},
            {id:2, name:'STICKER', price:10, img:'image_sticker.PNG'},
            {id:3, name:'HOODIE', price:85, img:'image_hoodie.PNG'},
            {id:4, name:'PANT', price:70, img:'image_pant.PNG'},
            {id:5, name:'SOCKS', price:15, img:'image_socks.PNG'},
            {id:6, name:'BEANIE', price:35, img:'image_cap.PNG'}, // Test scroll
            {id:7, name:'BAG', price:120, img:'image_tee.PNG'}
        ];
        let cart = [];
        let supabase = null;
        let tapCount = 0;

        // --- 1. LOADER (Timer Force) ---
        setTimeout(() => { document.getElementById('start-btn').style.display = 'block'; }, 2600);

        function startApp() {
            document.getElementById('loader-overlay').style.display='none';
            try { document.getElementById('sfx-eat').play(); } catch(e){}
            
            // Tentativo Connessione (Senza blocco)
            try {
                if(window.supabase) { supabase = window.supabase.createClient(CFG.sbUrl, CFG.sbKey); loadDB(); }
                if(window.emailjs) emailjs.init(CFG.emKey);
            } catch(e) { console.log("Offline"); }
            
            render();
        }

        async function loadDB() {
            if(!supabase) return;
            const { data } = await supabase.from('products').select('*');
            if(data && data.length) { items = data; render(); }
        }

        // --- 2. RENDER GRIGLIA ---
        function render() {
            // Divido gli item nelle pagine (max 9 per pagina)
            const p1 = document.getElementById('page-1');
            const p2 = document.getElementById('page-2');
            
            p1.innerHTML = items.slice(0, 9).map((i, idx) => createCard(i, idx)).join('');
            p2.innerHTML = items.slice(9, 18).map((i, idx) => createCard(i, idx+9)).join('');
        }

        function createCard(item, i) {
            return `
            <div class="item" id="itm-${i}" 
                 ontouchstart="touchStart(event, ${i})" 
                 onmousedown="touchStart(event, ${i})">
                <img src="${item.img}" onerror="this.src='https://placehold.co/80?text=${item.name}'">
                <div class="label">${item.name}</div>
                <div class="label">${item.price}€</div>
            </div>`;
        }

        // --- 3. LOGICA SCROLL vs DRAG (CUORE DEL FIX) ---
        let holdTimer = null;

        function touchStart(e, idx) {
            // Non prevenire default subito! Altrimenti lo scroll non parte.
            
            const el = document.getElementById(`itm-${idx}`);
            const ev = e.touches ? e.touches[0] : e;
            const rect = el.getBoundingClientRect();
            
            // TIMER: Se tieni premuto 200ms, inizia il DRAG
            holdTimer = setTimeout(() => {
                startDragProcess(idx, rect, ev.clientX, ev.clientY);
            }, 200);

            // Se l'utente muove il dito PRIMA dei 200ms, è uno SCROLL -> Cancella timer
            const cancel = () => { clearTimeout(holdTimer); };
            el.addEventListener('touchmove', cancel, {once:true});
            el.addEventListener('touchend', cancel, {once:true});
            // Per il mouse
            el.addEventListener('mousemove', cancel, {once:true});
            el.addEventListener('mouseup', cancel, {once:true});
        }

        function startDragProcess(idx, rect, startX, startY) {
            // Feedback vibrazione
            if(navigator.vibrate) navigator.vibrate(20);

            // Crea Ghost
            const ghost = document.getElementById(`itm-${idx}`).cloneNode(true);
            ghost.classList.add('ghost');
            // Importante: setta dimensione fissa altrimenti esplode
            ghost.style.width = '85px'; 
            ghost.style.left = rect.left + 'px';
            ghost.style.top = rect.top + 'px';
            document.body.appendChild(ghost);

            const offX = startX - rect.left;
            const offY = startY - rect.top;

            function move(e) {
                e.preventDefault(); // ORA blocchiamo lo scroll perché stiamo draggando
                const t = e.touches ? e.touches[0] : e;
                ghost.style.left = (t.clientX - offX) + 'px';
                ghost.style.top = (t.clientY - offY) + 'px';
            }

            function end(e) {
                document.removeEventListener('touchmove', move); document.removeEventListener('touchend', end);
                document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', end);

                // CONTROLLO TANK
                const tank = document.getElementById('tank-target').getBoundingClientRect();
                const gx = parseInt(ghost.style.left) + 40;
                const gy = parseInt(ghost.style.top) + 40;
                
                const tx = tank.left + tank.width/2;
                const ty = tank.top + tank.height/2;

                if(Math.hypot(gx-tx, gy-ty) < 60) {
                    ghost.classList.add('sucked');
                    try{document.getElementById('sfx-eat').play();}catch(e){}
                    setTimeout(() => {
                        cart.push(items[idx]);
                        updateCart();
                        ghost.remove();
                        openWin('win-cart');
                    }, 400);
                } else {
                    ghost.remove(); // Niente switch per semplicità, solo ritorno
                }
            }

            document.addEventListener('touchmove', move, {passive: false});
            document.addEventListener('touchend', end);
            document.addEventListener('mousemove', move);
            document.addEventListener('mouseup', end);
        }

        // --- 4. CART & UTILS ---
        function updateCart() {
            document.getElementById('tank-badge').innerText = cart.length;
            document.getElementById('tank-badge').style.display = cart.length ? 'block' : 'none';
            const list = document.getElementById('cart-list');
            if(!cart.length) list.innerHTML = "VUOTO";
            else list.innerHTML = cart.map((x,i)=>`<div class="row"><span>${x.name}</span><span style="cursor:pointer;color:red;" onclick="cart.splice(${i},1);updateCart()">X</span></div>`).join('');
            document.getElementById('cart-tot').innerText = "TOT: " + cart.reduce((a,b)=>a+parseInt(b.price),0) + "€";
        }

        async function checkout() {
            if(!cart.length) return alert("Vuoto!");
            let m=prompt("Email:");
            if(m) {
                if(supabase) await supabase.from('newsletter').insert([{email:m}]);
                if(window.emailjs) emailjs.send(CFG.emSrv, CFG.emTmp, {user_email:m, message:"ORDINE"});
                alert("Ordine Inviato!"); cart=[]; updateCart(); closeAll();
            }
        }

        function checkAdmin() {
            tapCount++;
            if(tapCount>=5) {
                if(prompt("PASSWORD")==="FRIENDLYFIRE26") {
                    const l = document.getElementById('adm-list');
                    l.innerHTML = items.map((x,i)=>`<div class="row"><input id="an${i}" value="${x.name}"><input id="ap${i}" value="${x.price}" type="number" style="width:30px"></div>`).join('');
                    openWin('win-admin');
                }
                tapCount=0;
            }
            setTimeout(()=>tapCount=0, 800);
        }

        async function saveAdmin() {
            items.forEach((x,i)=>{
                let n = document.getElementById(`an${i}`);
                if(n) { x.name=n.value; x.price=document.getElementById(`ap${i}`).value; }
            });
            render(); if(supabase) await supabase.from('products').upsert(items);
            alert("Salvato!"); closeAll();
        }

        function uiAnim(el) { el.classList.remove('pongo-anim'); void el.offsetWidth; el.classList.add('pongo-anim'); try{document.getElementById('sfx-eat').play();}catch(e){} }
        function openWin(id) { closeAll(); document.getElementById(id).style.display='flex'; }
        function toggleWin(id) { let e=document.getElementById(id); if(e.style.display==='flex') closeAll(); else { openWin(id); updateCart(); } }
        function closeAll() { document.querySelectorAll('.window').forEach(e=>e.style.display='none'); }
        async function doSub() { let e=document.getElementById('in-email').value; if(e&&supabase) await supabase.from('newsletter').insert([{email:e}]); alert("Iscritto!"); closeAll(); }

    </script>
</body>
</html>
