<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FRIENDLYFIRE CO.</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <script src="https://js.stripe.com/v3/" async></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <style>
        /* --- 1. CORE SYSTEM --- */
        :root { --bg-pongo: #2e4a1e; --white: #ffffff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; 
            font-family: 'Press Start 2P', cursive; 
            background-color: var(--bg-pongo);
            background-image: url('sfondo2.jpg'); /* Caricamento immediato */
            background-position: center; background-size: cover; background-repeat: no-repeat;
            /* IMPORTANTE: Questo sblocca lo scroll nativo su iOS */
            overscroll-behavior-x: none;
        }

        /* --- 2. LOADER "FAILSAFE" --- */
        #loader-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #fff; z-index: 999999; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            transition: opacity 0.5s ease;
        }
        .loader-img { width: 250px; max-width: 80%; margin-bottom: 20px; }
        .bar-box { width: 200px; height: 15px; border: 3px solid #000; padding: 2px; }
        .bar-fill { height: 100%; width: 0%; background: #32cd32; animation: load 2s forwards; }
        @keyframes load { 100% { width: 100%; } }
        
        #start-btn {
            display: none; /* Appare via JS o CSS delay */
            margin-top: 20px; background: #000; color: #fff; border: 2px solid #000; 
            padding: 15px 30px; font-family: inherit; cursor: pointer; 
            animation: blink 1s infinite;
        }
        @keyframes blink { 50% { opacity: 0.5; } }

        /* --- 3. HEADER FUNZIONANTE --- */
        header { 
            position: fixed; top: 0; left: 0; right: 0; height: 100px; 
            display: flex; justify-content: space-between; align-items: flex-start; 
            padding: 20px; z-index: 1000; pointer-events: none; /* Lascia passare click vuoti */
        }
        .icon-btn { 
            width: 70px; height: 70px; object-fit: contain; cursor: pointer; 
            pointer-events: auto; /* IMPORTANTE: Rende le icone cliccabili */
            transition: transform 0.1s; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.3));
        }
        .icon-btn:active { transform: scale(0.9); }
        
        .tank-wrap { position: relative; pointer-events: auto; }
        #badge { position: absolute; top: 0; right: -5px; background: #ff3a3a; color: #fff; border: 2px solid #000; font-size: 10px; padding: 2px 6px; display: none; }

        /* --- 4. SHOP ENGINE (SCROLL NATIVO) --- */
        #shop-container {
            width: 100%; height: 100%; 
            display: flex; 
            overflow-x: scroll; overflow-y: hidden; /* Scroll Orizzontale Puro */
            scroll-snap-type: x mandatory; 
            -webkit-overflow-scrolling: touch; /* Fluidità iOS */
            padding-top: 100px; padding-bottom: 80px; /* Spazio per Header/Footer */
            z-index: 10;
        }
        /* Nasconde scrollbar */
        #shop-container::-webkit-scrollbar { display: none; }

        .page { 
            min-width: 100vw; height: 100%; flex-shrink: 0; 
            scroll-snap-align: center; 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); /* 3 Colonne Mobile */
            grid-template-rows: repeat(4, 1fr); 
            align-items: center; justify-items: center;
        }

        .card { 
            position: relative; width: 100px; height: 120px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            /* Permette lo scroll ma rileva il tocco per drag */
            touch-action: pan-x pan-y; 
        }
        .card img { width: 90%; pointer-events: none; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5)); }
        .info { font-family: sans-serif; font-weight: 900; font-size: 10px; color: #fff; text-shadow: 0 1px 2px #000; margin-top: 5px; text-align: center; text-transform: uppercase; }

        /* GHOST DRAG */
        .ghost { position: fixed; z-index: 9999; pointer-events: none; opacity: 0.8; transform: scale(1.2) rotate(5deg); }

        /* --- 5. FOOTER & ADMIN --- */
        footer { 
            position: fixed; bottom: 0; left: 0; right: 0; height: 70px; 
            display: flex; justify-content: center; align-items: center; 
            z-index: 1000; pointer-events: none;
            background: linear-gradient(to top, rgba(0,0,0,0.5), transparent);
        }
        .brand { width: 160px; pointer-events: auto; cursor: pointer; }

        /* --- 6. OVERLAYS (FINESTRE) --- */
        .modal-bg { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 5000; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .window { width: 90%; max-width: 400px; background: #fff; border: 4px double #000; padding-bottom: 20px; box-shadow: 10px 10px 0 rgba(0,0,0,0.5); text-align: center; }
        .win-head { background: repeating-linear-gradient(45deg, #ddd, #ddd 5px, #fff 5px, #fff 10px); padding: 10px; border-bottom: 2px solid #000; font-weight: bold; margin-bottom: 15px; cursor: move; }
        
        .btn { background: #000; color: #fff; border: 2px solid #000; padding: 10px; width: 80%; margin: 5px auto; display: block; font-family: inherit; cursor: pointer; text-transform: uppercase; }
        .btn:active { transform: translate(2px,2px); }
        .inp { width: 80%; padding: 10px; margin: 5px auto; display: block; border: 2px solid #000; background: #eee; font-family: sans-serif; font-weight: bold; }

        /* --- 7. PC WIDESCREEN --- */
        @media (min-width: 1024px) {
            .page { 
                width: 100vw; 
                grid-template-columns: repeat(6, 1fr); /* 6 Colonne su PC */
                grid-template-rows: repeat(3, 1fr); 
                padding: 0 100px;
            }
            .card { width: 160px; height: 200px; }
            .icon-btn { width: 90px; height: 90px; }
            .brand { width: 250px; }
        }
    </style>
</head>
<body>

    <div id="loader-overlay">
        <img src="logo_ff_loader.png" class="loader-brand-img">
        <div class="bar-box"><div class="bar-fill"></div></div>
        <button id="start-btn" onclick="enterSite()">START</button>
    </div>

    <audio id="gnam" src="suono_gnam.mp3"></audio>

    <header>
        <img src="mondo_pongo.PNG" class="icon-btn" onclick="ui.open('world')">
        <img src="fuochini_centrali.png" class="icon-btn" onclick="ui.open('profile')">
        <div class="tank-wrap" onclick="ui.open('cart')">
            <img src="tank_header.PNG" class="icon-btn" id="tank-target">
            <div id="badge">0</div>
        </div>
    </header>

    <div id="shop-container">
        <div id="page-1" class="page"></div>
        <div id="page-2" class="page"></div>
        <div id="page-3" class="page"></div>
    </div>

    <footer>
        <img src="brand_name.png" class="brand" onclick="admin.trigger()">
    </footer>

    <div id="modal-cart" class="modal-bg"><div class="window"><div class="win-head">TANK</div><div id="cart-list" style="max-height:150px;overflow:auto;"></div><div style="margin:10px">TOTAL: <span id="total">0</span>€</div><button class="btn" onclick="ui.open('checkout')">CHECKOUT</button><button class="btn" onclick="cartSys.clear()">EMPTY</button><button class="btn" onclick="ui.close()">CLOSE</button></div></div>
    
    <div id="modal-checkout" class="modal-bg"><div class="window"><div class="win-head">PAYMENT</div><div id="co-list"></div><input id="co-name" class="inp" placeholder="NAME"><input id="co-email" class="inp" placeholder="EMAIL"><button class="btn" style="background:#5469d4" onclick="cartSys.pay()">PAY STRIPE</button><button class="btn" onclick="ui.close()">CANCEL</button></div></div>

    <div id="modal-world" class="modal-bg"><div class="window"><div class="win-head">WORLD</div><input id="sub-name" class="inp" placeholder="NAME"><input id="sub-email" class="inp" placeholder="EMAIL"><button class="btn" onclick="admin.sub()">SUBSCRIBE</button><button class="btn" onclick="window.open('https://instagram.com/friendlyfire')">INSTAGRAM</button><button class="btn" onclick="ui.close()">BACK</button></div></div>

    <div id="modal-profile" class="modal-bg"><div class="window"><div class="win-head">PROFILE</div><div id="avatars" style="display:grid;grid-template-columns:repeat(4,1fr);padding:10px;"></div><button class="btn" onclick="ui.close()">SAVE</button></div></div>

    <div id="modal-admin" class="modal-bg"><div class="window" style="height:80vh"><div class="win-head">CLOUD DB</div><div id="db-rows" style="height:60%;overflow:auto;"></div><button class="btn" onclick="admin.save()">SAVE ALL</button><button class="btn" onclick="ui.close()">EXIT</button></div></div>

    <script>
        // --- CONFIG ---
        const CFG = {
            stripe: 'pk_live_51SyKuT1PjKstwovYOCs5iNC2Ef8sun65gJ2pLXi4pyvfqM9o2Tiaec8NTQuHJEoYVPzDEDsktyZwlSWl6SjMKxzM00i7aB1Yvd',
            sbUrl: 'https://jwifyapbnsbbpsrstrow.supabase.co',
            sbKey: 'sb_publishable_KxgF0mfUyD1b0AFxoJQ2ww_klbphC9s',
            emailId: 'BThMV2knP0VG0s4nr'
        };
        const DEFAULTS = [
            {id:0, name:'CAP FIRE', img:'image_cap.PNG', price:45, stripeId:''}, 
            {id:1, name:'TEE FLAME', img:'image_tee.PNG', price:65, stripeId:''}
        ];

        let state = { items: [...DEFAULTS], cart: [], clicks: 0, loaded: false };
        let sb = null, strp = null;

        // --- CORE ---
        window.onload = () => {
            // 1. Mostra tasto start dopo 2s
            setTimeout(() => document.getElementById('start-btn').style.display = 'block', 2000);
            
            // 2. Render Iniziale
            shop.render();
            
            // 3. Init Servizi (Lazy)
            setTimeout(async () => {
                try {
                    strp = Stripe(CFG.stripe);
                    sb = supabase.createClient(CFG.sbUrl, CFG.sbKey);
                    emailjs.init(CFG.emailId);
                    
                    // Scarica dati
                    let { data } = await sb.from('products').select('*').order('id');
                    if(data && data.length) { state.items = data; shop.render(); }
                    
                    let { data: set } = await sb.from('settings').select('*').single();
                    if(set?.bg_url) document.body.style.backgroundImage = `url('${set.bg_url}')`;
                    
                } catch(e) { console.log("Offline:", e); }
            }, 500);
        };

        function enterSite() {
            document.getElementById('loader-overlay').remove(); // Distruzione
            try { document.getElementById('gnam').play(); } catch(e){}
        }

        // --- SHOP & PHYSICS ---
        const shop = {
            render: () => {
                [1,2,3].forEach(n => document.getElementById('page-'+n).innerHTML='');
                state.items.forEach((it, i) => {
                    let p = Math.floor(i/12)+1; if(p>3) return;
                    let div = document.createElement('div');
                    div.className = 'card';
                    div.innerHTML = `<img src="${it.img}"><div class="info">${it.name}<br>${it.price}€</div>`;
                    shop.physics(div, it);
                    document.getElementById('page-'+p).appendChild(div);
                });
            },
            physics: (el, item) => {
                let timer, isDrag = false, startX, startY, ghost;
                const cont = document.getElementById('shop-container');

                el.addEventListener('touchstart', e => {
                    startX = e.touches[0].clientX; startY = e.touches[0].clientY;
                    timer = setTimeout(() => {
                        isDrag = true;
                        if(navigator.vibrate) navigator.vibrate(50);
                        ghost = el.cloneNode(true); ghost.className = 'ghost';
                        ghost.style.left = (startX-50)+'px'; ghost.style.top = (startY-60)+'px';
                        document.body.appendChild(ghost); el.style.opacity = 0.3;
                    }, 300); // 300ms hold per draggare
                }, {passive:true});

                window.addEventListener('touchmove', e => {
                    if(!isDrag) {
                        if(Math.abs(e.touches[0].clientX - startX) > 10) clearTimeout(timer);
                        return;
                    }
                    e.preventDefault();
                    ghost.style.left = (e.touches[0].clientX-50)+'px';
                    ghost.style.top = (e.touches[0].clientY-60)+'px';
                }, {passive:false});

                window.addEventListener('touchend', e => {
                    clearTimeout(timer);
                    if(!isDrag) return;
                    isDrag = false;
                    
                    let tx = e.changedTouches[0].clientX, ty = e.changedTouches[0].clientY;
                    let tank = document.getElementById('tank-target').getBoundingClientRect();

                    // Collisione Tank
                    if(tx > tank.left && tx < tank.right && ty > tank.top && ty < tank.bottom) {
                        cartSys.add(item);
                        try{document.getElementById('gnam').play()}catch(e){}
                    }

                    ghost.remove(); el.style.opacity = 1;
                });
            }
        };

        // --- CART SYSTEM ---
        const cartSys = {
            add: (it) => { state.cart.push(it); cartSys.upd(); },
            clear: () => { state.cart = []; cartSys.upd(); ui.close(); },
            upd: () => {
                document.getElementById('badge').innerText = state.cart.length;
                document.getElementById('badge').style.display = state.cart.length ? 'block' : 'none';
                let t = state.cart.reduce((a,b)=>a+b.price,0);
                document.getElementById('total').innerText = t;
                document.getElementById('cart-list').innerHTML = state.cart.map(i=>`<div>${i.name} ${i.price}€</div>`).join('');
            },
            pay: async () => {
                if(!state.cart.length) return alert("EMPTY");
                let items = state.cart.map(i => i.stripeId ? {price: i.stripeId, quantity: 1} : null).filter(i=>i);
                if(!items.length) return alert("NO STRIPE IDS");
                let email = document.getElementById('co-email').value;
                if(!email) return alert("EMAIL REQUIRED");
                
                await strp.redirectToCheckout({
                    lineItems: items, mode: 'payment', customerEmail: email,
                    successUrl: window.location.href, cancelUrl: window.location.href
                });
            }
        };

        // --- UI & ADMIN ---
        const ui = {
            open: (id) => { 
                document.querySelectorAll('.modal-bg').forEach(m=>m.style.display='none');
                document.getElementById('modal-'+id).style.display='flex';
                if(id==='profile') ui.avatars();
                if(id==='admin') ui.dbList();
            },
            close: () => document.querySelectorAll('.modal-bg').forEach(m=>m.style.display='none'),
            avatars: () => {
                let c = document.getElementById('avatars'); c.innerHTML='';
                for(let i=0;i<8;i++) c.innerHTML+=`<img src="https://api.dicebear.com/7.x/pixel-art/svg?seed=${i}" width="100%" style="border:2px solid #000">`;
            },
            dbList: () => {
                let c = document.getElementById('db-rows'); c.innerHTML='';
                state.items.forEach(i => {
                    c.innerHTML += `<div style="display:flex;gap:5px;margin:5px;border-bottom:1px solid #ccc">
                        <input id="n-${i.id}" value="${i.name}" class="inp" style="width:30%">
                        <input id="p-${i.id}" value="${i.price}" class="inp" style="width:20%">
                        <button class="btn" style="width:20%;background:red" onclick="admin.del(${i.id})">X</button>
                    </div>`;
                });
            }
        };

        const admin = {
            trigger: () => {
                state.clicks++;
                if(state.clicks >= 5) {
                    if(prompt("PASS") === "FRIENDLYFIRE26") ui.open('admin');
                    state.clicks = 0;
                }
                setTimeout(()=>state.clicks=0, 800);
            },
            save: async () => {
                if(!sb) return;
                let ups = state.items.map(i => {
                    let n = document.getElementById('n-'+i.id);
                    if(n) { i.name = n.value; i.price = parseInt(document.getElementById('p-'+i.id).value); }
                    return i;
                });
                await sb.from('products').upsert(ups);
                alert("SAVED"); location.reload();
            },
            del: async (id) => { if(confirm("DEL?")) { await sb.from('products').delete().eq('id',id); location.reload(); } },
            sub: async () => {
                let e = document.getElementById('sub-email').value;
                if(e) { 
                    if(sb) await sb.from('newsletter').insert([{email:e}]);
                    alert("DONE"); ui.close();
                }
            }
        };
    </script>
</body>
</html>
