<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friendly Fire - Loading</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: sans-serif;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            /* L'immagine di sfondo rinominata come richiesto */
            background-image: url('momifire.png'); 
            background-size: cover;
            background-position: center;
        }

        /* EFFETTO CRT / MAGNETICO */
        #crt-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 10;
            pointer-events: none;
            transition: opacity 1.5s ease-out;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 3px, 3px 100%;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.95; }
            50% { opacity: 0.85; }
            100% { opacity: 0.95; }
        }

        /* BARRA DI CARICAMENTO */
        #loading-wrapper {
            position: absolute;
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            transition: opacity 1s ease-out;
        }

        .loading-bar-container {
            display: flex;
            gap: 4px;
            background: #1a1a1a;
            padding: 6px 8px;
            border-radius: 12px;
            box-shadow: 
                inset 0px 3px 5px rgba(0, 0, 0, 0.8), 
                inset 0px -2px 2px rgba(255, 255, 255, 0.2),
                0px 10px 15px rgba(0, 0, 0, 0.6);
            border: 2px solid #0a0a0a;
        }

        .segment {
            width: 22px;
            height: 35px;
            background-color: #0f0f0f;
            border-radius: 4px;
            box-shadow: 
                inset 0px 2px 4px rgba(0, 0, 0, 0.9),
                inset 0px -1px 1px rgba(255, 255, 255, 0.1);
            transition: background-color 0.2s ease, box-shadow 0.2s ease;
        }

        .segment.lit-1 { background-color: #630000; color: #ff0000; }
        .segment.lit-2 { background-color: #990000; color: #ff0000; }
        .segment.lit-3 { background-color: #cc0000; color: #ff0000; }
        .segment.lit-4 { background-color: #d82b00; color: #ff3300; }
        .segment.lit-5 { background-color: #e65c00; color: #ff6600; }
        .segment.lit-6 { background-color: #f28c00; color: #ff9900; }
        .segment.lit-7 { background-color: #ffb300; color: #ffcc00; }
        .segment.lit-8 { background-color: #ffcc00; color: #ffe600; }
        .segment.lit-9 { background-color: #ffe666; color: #ffff66; }
        .segment.lit-10{ background-color: #fff9b3; color: #ffffcc; }

        .segment[class*="lit-"] {
            box-shadow: 
                inset 0px 2px 5px rgba(255,255,255,0.4),
                0px 0px 8px currentColor;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="crt-overlay"></div>
        
        <div id="loading-wrapper">
            <div class="loading-bar-container" id="loading-bar">
                <div class="segment" id="seg-1"></div>
                <div class="segment" id="seg-2"></div>
                <div class="segment" id="seg-3"></div>
                <div class="segment" id="seg-4"></div>
                <div class="segment" id="seg-5"></div>
                <div class="segment" id="seg-6"></div>
                <div class="segment" id="seg-7"></div>
                <div class="segment" id="seg-8"></div>
                <div class="segment" id="seg-9"></div>
                <div class="segment" id="seg-10"></div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            let currentSegment = 1;
            const totalSegments = 10;
            
            const loadingInterval = setInterval(() => {
                if (currentSegment <= totalSegments) {
                    const segmentElement = document.getElementById(`seg-${currentSegment}`);
                    segmentElement.classList.add(`lit-${currentSegment}`);
                    currentSegment++;
                } else {
                    clearInterval(loadingInterval);
                    setTimeout(() => {
                        document.getElementById('crt-overlay').style.opacity = '0';
                        document.getElementById('loading-wrapper').style.opacity = '0';
                    }, 500);
                }
            }, 400);
        });
    </script>
</body>
</html>
