<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friendly Fire - Loading</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace; 
        }

        /* SCHERMATA DI CARICAMENTO */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background-image: url('momifire.png'); 
            background-size: cover;
            background-position: center;
            display: block;
        }

        /* EFFETTO CRT / MAGNETICO */
        #crt-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 50; /* AUMENTATO: ora sta fisicamente sopra a tutto, inclusa la barra */
            pointer-events: none; /* Permette di cliccare gli elementi sottostanti */
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 3px, 3px 100%;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.95; }
            50% { opacity: 0.85; }
            100% { opacity: 0.95; }
        }

        /* BARRA DI CARICAMENTO RIGIDA E TESTURIZZATA */
        #loading-wrapper {
            position: absolute;
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20; /* INFERIORE al crt-overlay: ora sta sotto lo schermo */
        }

        .loading-bar-container {
            display: flex;
            gap: 2px;
            padding: 4px;
            background-color: #2b2b2b;
            background-image: repeating-linear-gradient(45deg, transparent, transparent 2px, #1a1a1a 2px, #1a1a1a 4px);
            border-top: 3px solid #666;
            border-left: 3px solid #666;
            border-bottom: 3px solid #111;
            border-right: 3px solid #111;
        }

        .segment {
            width: 24px;
            height: 32px;
            background-color: #050505;
            border: 1px solid #000;
        }

        .segment.lit-1 { background-color: #630000; }
        .segment.lit-2 { background-color: #990000; }
        .segment.lit-3 { background-color: #cc0000; }
        .segment.lit-4 { background-color: #d82b00; }
        .segment.lit-5 { background-color: #e65c00; }
        .segment.lit-6 { background-color: #f28c00; }
        .segment.lit-7 { background-color: #ffb300; }
        .segment.lit-8 { background-color: #ffcc00; }
        .segment.lit-9 { background-color: #ffe666; }
        .segment.lit-10{ background-color: #fff9b3; }

        /* TASTO START */
        #start-btn {
            display: none; 
            position: absolute;
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20; /* INFERIORE al crt-overlay */
            background: transparent;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 28px;
            font-weight: bold;
            border: none;
            text-shadow: 3px 3px 0px #000; 
            cursor: pointer;
            animation: blink 1s steps(2, start) infinite;
        }

        @keyframes blink {
            to { visibility: hidden; }
        }

        /* SCHERMATA HOME DEL SITO */
        #home-screen {
            display: none; 
            width: 100%;
            height: 100%;
            background-color: #121212;
            color: #4ade80; 
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #home-screen h1 {
            font-size: 3rem;
            text-shadow: 4px 4px 0px #000;
        }

    </style>
</head>
<body>

    <div id="game-container">
        <div id="crt-overlay"></div>
        
        <div id="loading-wrapper">
            <div class="loading-bar-container" id="loading-bar">
                <div class="segment" id="seg-1"></div>
                <div class="segment" id="seg-2"></div>
                <div class="segment" id="seg-3"></div>
                <div class="segment" id="seg-4"></div>
                <div class="segment" id="seg-5"></div>
                <div class="segment" id="seg-6"></div>
                <div class="segment" id="seg-7"></div>
                <div class="segment" id="seg-8"></div>
                <div class="segment" id="seg-9"></div>
                <div class="segment" id="seg-10"></div>
            </div>
        </div>

        <button id="start-btn">PRESS START</button>
    </div>

    <div id="home-screen">
        <h1>FRIENDLY FIRE</h1>
        <p>Menu Principale del Sito</p>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            let currentSegment = 1;
            const totalSegments = 10;
            
            const loadingInterval = setInterval(() => {
                if (currentSegment <= totalSegments) {
                    const segmentElement = document.getElementById(`seg-${currentSegment}`);
                    segmentElement.classList.add(`lit-${currentSegment}`);
                    currentSegment++;
                } else {
                    clearInterval(loadingInterval);
                    document.getElementById('loading-wrapper').style.display = 'none';
                    document.getElementById('start-btn').style.display = 'block';
                }
            }, 300); 

            document.getElementById('start-btn').addEventListener('click', () => {
                document.getElementById('game-container').style.display = 'none';
                document.getElementById('home-screen').style.display = 'flex';
            });
        });
    </script>
</body>
</html>
