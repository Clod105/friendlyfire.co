<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FRIENDLYFIRE CO.</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <script src="https://js.stripe.com/v3/"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <style>
        :root { --red: #ff3a3a; --bg-pongo: #2e4a1e; --white: #ffffff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; outline: none; }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; 
            font-family: 'Press Start 2P', cursive; 
            background-color: var(--bg-pongo);
            background-image: url('sfondo2.jpg');
            background-position: center center; background-repeat: no-repeat; background-size: cover;
            overscroll-behavior: none; position: fixed; 
        }

        /* --- LOADER --- */
        #loader-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background-color: var(--white); z-index: 999999; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            transition: opacity 0.5s ease-out;
        }
        .loader-brand-img { width: 260px; max-width: 80%; height: auto; object-fit: contain; margin-bottom: 10px; }
        .gif-wrapper { width: 280px; height: 280px; display: flex; justify-content: center; align-items: center; }
        #loader-gif { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; transform: scale(1.1); }
        .loading-area-bottom { display: flex; flex-direction: column; align-items: center; margin-top: 20px; width: 100%; height: 120px; justify-content: flex-start; }
        .pixel-bar-container { width: 180px; height: 16px; background: #fff; border: 3px solid #000; padding: 2px; box-shadow: 6px 6px 0 rgba(0,0,0,0.1); margin-bottom: 10px; }
        .pixel-bar-fill { height: 100%; width: 0%; background-color: #32cd32; animation: fillBar 2s linear forwards; }
        @keyframes fillBar { 0% { width: 0%; } 100% { width: 100%; } }
        #start-btn { 
            opacity: 0; pointer-events: none; background: #000; color: #fff; border: 2px solid #000; 
            padding: 14px 30px; font-family: 'Press Start 2P'; font-size: 10px; cursor: pointer; 
            animation: showBtn 0.5s ease-out 2s forwards, blink 1s infinite 2.5s; 
        }
        @keyframes showBtn { to { opacity: 1; pointer-events: auto; } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }

        /* --- HEADER --- */
        header { display: flex; justify-content: space-between; align-items: flex-start; padding: 15px 20px; position: absolute; top: 0; left: 0; right: 0; z-index: 2000; pointer-events: none; }
        .pongo-btn { width: 70px; height: 70px; object-fit: contain; cursor: pointer; pointer-events: auto; filter: drop-shadow(0 4px 2px rgba(0,0,0,0.4)); }
        .pongo-anim { animation: pongo 0.3s ease-out; }
        @keyframes pongo { 0%{transform:scale(1);} 50%{transform:scale(1.2,0.8);} 100%{transform:scale(1);} }
        .tank-wrapper { position: relative; pointer-events: auto; }
        #tank-badge { position: absolute; top: 0; right: -5px; background: var(--red); color: white; border: 2px solid #000; font-size: 9px; padding: 3px 6px; border-radius: 50%; display: none; z-index: 10003; }

        /* --- GRID --- */
        #shop-slider { width: 100vw; height: 100%; display: flex; overflow-x: scroll; overflow-y: hidden; scroll-snap-type: x mandatory; z-index: 1; }
        #shop-slider.free-flow { scroll-snap-type: none !important; }
        #shop-slider::-webkit-scrollbar { display: none; }
        .shop-page { min-width: 100vw; height: 100%; flex: 0 0 100vw; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr); padding: 110px 10px 100px 10px; gap: 5px; scroll-snap-align: start; justify-items: center; align-items: center; }
        .item-card { display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 100; transform: translateZ(0); cursor: grab; }
        .item-card img { width: 90px; pointer-events: none; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5)); transition: transform 0.2s; }
        .clean-tag { font-family: sans-serif; font-weight: 800; font-size: 9px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.9); margin-top: 5px; text-transform: uppercase; }

        /* --- FOOTER --- */
        #app-footer { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; display: flex; align-items: center; justify-content: center; z-index: 20000; pointer-events: none; }
        .footer-logo { width: 150px; cursor: pointer; pointer-events: auto; }

        /* --- WINDOWS --- */
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 50000; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .mac-window { width: 90%; max-width: 360px; background: #fff; border: 3px double #000; padding: 0 0 15px 0; box-shadow: 15px 15px 0 rgba(0,0,0,0.5); text-align: center; position: relative; }
        .mac-title-bar { width: 100%; background: repeating-linear-gradient(45deg, #ccc, #ccc 2px, #fff 2px, #fff 4px); border-bottom: 2px solid #000; padding: 10px; font-size: 10px; font-weight: 800; cursor: move; }
        .btn-pixel { background: #000; color: #fff; border: 2px solid #000; padding: 14px; font-family: 'Press Start 2P'; font-size: 9px; cursor: pointer; margin: 6px; width: 85%; }
        .input-pixel { border: 2px solid #000; padding: 12px; font-family: sans-serif; font-weight: bold; width: 85%; font-size: 11px; margin-bottom: 10px; }

        @media (min-width: 1024px) {
            .shop-page { grid-template-columns: repeat(4, 1fr); padding: 160px 100px; }
            .item-card img { width: 140px; } .footer-logo { width: 240px; }
        }
    </style>
</head>
<body>

    <div id="loader-overlay">
        <img src="logo_ff_loader.png" class="loader-brand-img">
        <div class="gif-wrapper"><img id="loader-gif" src="loadernob.gif"></div>
        <div class="loading-area-bottom">
            <div class="pixel-bar-container"><div class="pixel-bar-fill"></div></div>
            <button id="start-btn" onclick="document.getElementById('loader-overlay').remove(); playSfx();">START</button>
        </div>
    </div>

    <audio id="sfx-gnam" src="suono_gnam.mp3" preload="auto"></audio>

    <header>
        <img src="mondo_pongo.PNG" class="pongo-btn" onclick="pongoClick(this, 'ov-world')">
        <img src="fuochini_centrali.png" class="pongo-btn" onclick="pongoClick(this, 'ov-profile')">
        <div class="tank-wrapper" onclick="pongoClick(document.getElementById('tank-btn'), 'ov-cart')">
            <img src="tank_header.PNG" class="pongo-btn" id="tank-btn">
            <div id="tank-badge">0</div>
        </div>
    </header>

    <div id="shop-slider">
        <div id="page-1" class="shop-page"></div>
        <div id="page-2" class="shop-page"></div>
        <div id="page-3" class="shop-page"></div>
    </div>

    <footer id="app-footer">
        <img src="brand_name.png" class="footer-logo" onclick="adminTrigger()">
    </footer>

    <div id="ov-cart" class="overlay"><div class="mac-window"><div class="mac-title-bar draggable-handle">TANK</div><div id="cart-list" style="max-height:150px; overflow-y:auto; padding:10px;"></div><div style="margin:10px;">TOTAL: <span id="cart-total">0</span>€</div><button class="btn-pixel" onclick="openOv('ov-checkout')">CHECKOUT</button><button class="btn-pixel" onclick="closeAll()">CLOSE</button></div></div>
    <div id="ov-world" class="overlay"><div class="mac-window"><div class="mac-title-bar">WORLD</div><input type="text" id="news-name" class="input-pixel" placeholder="NAME"><input type="email" id="news-email" class="input-pixel" placeholder="EMAIL"><button class="btn-pixel" onclick="subscribeNewsletter()">JOIN CLUB</button><button class="btn-pixel" onclick="window.open('https://instagram.com/friendlyfire')">INSTAGRAM</button><button class="btn-pixel" onclick="closeAll()">BACK</button></div></div>
    <div id="ov-profile" class="overlay"><div class="mac-window"><div class="mac-title-bar">PROFILE</div><div id="avatar-grid" style="display:grid; grid-template-columns:repeat(4,1fr); gap:5px; padding:10px;"></div><button class="btn-pixel" onclick="closeAll()">CLOSE</button></div></div>
    <div id="ov-db" class="overlay"><div class="mac-window" style="max-width:95%; height:80vh;"><div class="mac-title-bar">ADMIN</div><div id="db-list" style="overflow-y:auto; height:60vh;"></div><button class="btn-pixel" onclick="saveAllChanges()">SAVE ALL</button><button class="btn-pixel" onclick="closeAll()">EXIT</button></div></div>

    <script>
        let stripe, supabase, inventory = [], cart = [], dbClicks = 0;
        const defaultItems = [{id:0, name:'CAP FIRE', img:'image_cap.PNG', price:45, stripeId:''}, {id:1, name:'TEE FLAME', img:'image_tee.PNG', price:65, stripeId:''}];
        
        window.onload = function() {
            renderShop(defaultItems); renderAvatars(); initDraggable();
            try {
                stripe = Stripe('pk_live_51SyKuT1PjKstwovYOCs5iNC2Ef8sun65gJ2pLXi4pyvfqM9o2Tiaec8NTQuHJEoYVPzDEDsktyZwlSWl6SjMKxzM00i7aB1Yvd');
                supabase = supabase.createClient('https://jwifyapbnsbbpsrstrow.supabase.co', 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp3aWZ5YXBibnNiYnBzcnN0cm93Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA1NzM1OTUsImV4cCI6MjA4NjE0OTU5NX0.dmhdHZRJuYo7-OlpSR3S5ca7ink9w6a5DM-u2ac4c2Y');
                emailjs.init("BThMV2knP0VG0s4nr");
                loadDB();
            } catch(e) { console.log(e); }
        };

        async function loadDB() {
            const { data } = await supabase.from('products').select('*').order('id');
            if(data) { inventory = data; renderShop(data); }
        }

        function renderShop(items) {
            [1,2,3].forEach(n => document.getElementById('page-'+n).innerHTML = '');
            items.forEach((item, i) => {
                let p = Math.floor(i/12)+1; if(p>3) return;
                let el = document.createElement('div'); el.className = 'item-card'; el.id = 'itm-'+item.id;
                el.innerHTML = `<img src="${item.img}"><div class="clean-tag">${item.name}<br>${item.price}€</div>`;
                attachPhysics(el, item);
                document.getElementById('page-'+p).appendChild(el);
            });
        }

        function pongoClick(el, id) { playSfx(); el.classList.add('pongo-anim'); setTimeout(()=>el.classList.remove('pongo-anim'), 300); if(id) openOv(id); }
        function playSfx() { let s = document.getElementById('sfx-gnam'); if(s) { s.currentTime=0; s.play().catch(()=>{}); } }
        function adminTrigger() { dbClicks++; if(dbClicks>=5) { if(prompt("PASS")==="FRIENDLYFIRE26") openDB(); dbClicks=0; } setTimeout(()=>dbClicks=0,1000); }

        function attachPhysics(el, item) {
            let startX, startY, isDragging = false, ghost, timer;
            el.addEventListener('touchstart', e => {
                timer = setTimeout(() => {
                    isDragging = true; ghost = el.cloneNode(true); ghost.classList.add('ghost-card');
                    document.body.appendChild(ghost); el.style.opacity = '0';
                }, 200);
                startX = e.touches[0].clientX; startY = e.touches[0].clientY;
            });
            window.addEventListener('touchmove', e => {
                if(!isDragging) return; e.preventDefault();
                ghost.style.left = (e.touches[0].clientX - 45)+'px'; ghost.style.top = (e.touches[0].clientY - 45)+'px';
            });
            window.addEventListener('touchend', e => {
                clearTimeout(timer); if(!isDragging) return; isDragging = false;
                let tx = e.changedTouches[0].clientX, ty = e.changedTouches[0].clientY;
                let tank = document.getElementById('tank-btn').getBoundingClientRect();
                if(Math.hypot(tx-(tank.left+35), ty-(tank.top+35)) < 60) { addToCart(item); playSfx(); }
                ghost.remove(); el.style.opacity = '1';
            });
        }

        function addToCart(item) { cart.push(item); updateCartUI(); }
        function updateCartUI() {
            document.getElementById('tank-badge').innerText = cart.length;
            document.getElementById('tank-badge').style.display = cart.length ? 'block' : 'none';
            document.getElementById('cart-total').innerText = cart.reduce((a,b)=>a+b.price,0);
            document.getElementById('cart-list').innerHTML = cart.map(i=>`<div>${i.name} - ${i.price}€</div>`).join('');
        }

        async function subscribeNewsletter() {
            let n = document.getElementById('news-name').value, e = document.getElementById('news-email').value;
            if(!e) return alert("EMAIL REQUIRED");
            await supabase.from('newsletter').insert([{email: e}]);
            await emailjs.send("service_4scv4hn", "template_8opoo1v", {to_name: n, user_email: e});
            alert("WELCOME!"); closeAll();
        }

        async function processStripeRedirect() {
            const items = cart.map(i => ({price: i.stripeId, quantity: 1}));
            const {error} = await stripe.redirectToCheckout({lineItems: items, mode: 'payment', successUrl: window.location.href, cancelUrl: window.location.href});
            if(error) alert(error.message);
        }

        function openOv(id) { closeAll(); document.getElementById(id).style.display='flex'; }
        function closeAll() { document.querySelectorAll('.overlay').forEach(o=>o.style.display='none'); }
        function initDraggable() { /* Logica drag finestre */ }
        function renderAvatars() { /* Generazione avatar */ }
        function openDB() { openOv('ov-db'); /* Popola lista admin */ }
    </script>
</body>
</html>
