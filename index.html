<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STREET PONGO - GOD MODE</title>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;900&display=swap" rel="stylesheet">
    <style>
        /* --- VARIABILI STANDARD (Modo Soldato) --- */
        :root {
            --bg-color: #4f634f;        /* Verde Militare */
            --bg-dark: #2f3b2f;         /* Verde Scuro */
            --accent-color: #e07a38;    /* Arancione Pongo (Tasti/Popup) */
            --accent-hover: #b35e27;    /* Arancione Scuro */
            --text-main: #f0f0f0;       /* Bianco Sporco */
            --text-dark: #2f3b2f;       /* Testo su bottoni */
            --shelf-shadow: rgba(0,0,0,0.4);
            --cursor-border: #fff;
        }

        /* --- GOD MODE (Attivata via JS) --- */
        body.god-mode {
            --bg-color: #1a1a1a;        /* Nero "Black Ops" */
            --bg-dark: #000000;         /* Nero Assoluto */
            --accent-color: #ffd700;    /* ORO PURO */
            --accent-hover: #d4af37;    /* Oro Antico */
            --text-main: #ffd700;       /* Testo Oro */
            --text-dark: #000000;       /* Testo su bottoni (Nero) */
            --shelf-shadow: rgba(255, 215, 0, 0.2); /* Bagliore dorato */
            --cursor-border: #ffd700;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Rubik', sans-serif;
            height: 100vh;
            overflow: hidden;
            cursor: none; /* Cursore nascosto */
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        /* Texture sfondo (comune a entrambe le modalità) */
        .locker-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background-image: 
                linear-gradient(90deg, rgba(0,0,0,0.1) 0%, transparent 10%, transparent 90%, rgba(0,0,0,0.3) 100%);
            box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
            position: relative;
        }

        /* --- CURSORE CUSTOM --- */
        .cursor-dot {
            width: 30px;
            height: 30px;
            background-color: var(--accent-color);
            border: 3px solid var(--cursor-border);
            border-radius: 50%;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
            pointer-events: none; 
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: width 0.2s, height 0.2s, background-color 0.5s, border-color 0.5s;
        }

        .cursor-dot.hovered {
            width: 50px;
            height: 50px;
            background-color: transparent;
            border-color: var(--accent-color);
        }

        /* --- HEADER (Trigger God Mode) --- */
        header {
            text-align: center;
            padding: 20px;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 3px 3px 0px var(--bg-dark);
            border-bottom: 5px solid var(--bg-dark);
            background: rgba(0,0,0,0.1);
            cursor: pointer; /* Indica che è cliccabile */
            transition: color 0.3s;
        }
        
        header:hover {
            opacity: 0.8;
        }

        .god-badge {
            display: none;
            font-size: 0.8rem;
            background: #ffd700;
            color: black;
            padding: 2px 8px;
            border-radius: 5px;
            vertical-align: middle;
            margin-left: 10px;
        }
        body.god-mode .god-badge { display: inline-block; }

        /* --- SCAFFALI --- */
        .shelves-area {
            flex: 2;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .shelf {
            background-color: rgba(0,0,0,0.2);
            border-bottom: 15px solid var(--bg-dark);
            padding: 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 20px 20px -10px var(--shelf-shadow);
            transform: perspective(500px) rotateX(2deg);
            transition: border-color 0.5s;
        }

        /* --- PRODOTTI --- */
        .product-card {
            background-color: rgba(255,255,255,0.1); /* Neutro, si adatta allo sfondo */
            border-radius: 15px;
            padding: 15px;
            width: 180px;
            text-align: center;
            position: relative;
            transition: transform 0.2s;
            box-shadow: 
                inset 5px 5px 10px rgba(255,255,255,0.1),
                inset -5px -5px 10px rgba(0,0,0,0.3),
                5px 10px 15px rgba(0,0,0,0.3);
        }

        .product-card:hover {
            transform: translateY(-5px) scale(1.05);
        }

        .icon-display {
            font-size: 4rem;
            margin-bottom: 10px;
            display: block;
            filter: drop-shadow(0px 5px 0px rgba(0,0,0,0.2));
        }

        .price-tag {
            background: var(--text-main);
            color: var(--bg-dark);
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: 900;
            display: inline-block;
            transform: rotate(-3deg);
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        }

        /* --- BOTTONI UNIFICATI (Regola richiesta) --- */
        /* Tutti i tasti usano --accent-color */
        .btn-universal {
            margin-top: 15px;
            background-color: var(--accent-color);
            border: none;
            padding: 10px 20px;
            color: var(--text-dark); /* Testo scuro per contrasto su oro/arancio */
            font-weight: 900;
            border-radius: 10px;
            width: 100%;
            cursor: none;
            box-shadow: 0 5px 0 var(--accent-hover);
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .btn-universal:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 var(--accent-hover);
        }

        /* --- ZAINO --- */
        .backpack-area {
            flex: 1;
            background-color: rgba(0,0,0,0.3);
            border-top: 5px solid var(--bg-dark);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: border-color 0.5s;
        }

        .cart-item {
            background-color: var(--text-main);
            color: var(--bg-dark);
            padding: 8px 15px;
            border-radius: 50px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 5px;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.2);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Tasto Rimuovi (Uniformato allo stile) */
        .remove-btn {
            background: var(--accent-color); /* Stesso colore dei tasti principali! */
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: none;
            color: var(--text-dark);
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: none;
            transition: background 0.3s;
        }
        .remove-btn:hover {
             transform: scale(1.2);
        }

        /* --- POP UP (NOTIFICA) UNIFICATO --- */
        #notification-popup {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: var(--accent-color); /* Stesso colore dei tasti! */
            color: var(--text-dark);
            padding: 20px 30px;
            border-radius: 15px;
            font-weight: 900;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transform: translateY(150%); /* Nascosto */
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 4px solid var(--text-main);
        }

        #notification-popup.show {
            transform: translateY(0);
        }

        @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }

    </style>
</head>
<body>

    <div class="cursor-dot" id="cursor"></div>

    <div class="locker-container">
        <header onclick="toggleGodMode()">
            Diego's War Locker <span class="god-badge">GOD</span>
        </header>

        <div class="shelves-area">
            <div class="shelf">
                <div class="product-card">
                    <span class="icon-display">🧢</span>
                    <div class="price-tag">45€</div>
                    <h3>Cappello Rebel</h3>
                    <button class="btn-universal" onclick="addToLocker('Cappello Rebel')">PRENDI</button>
                </div>
                <div class="product-card">
                    <span class="icon-display">🚁</span>
                    <div class="price-tag">120€</div>
                    <h3>Drone Scout</h3>
                    <button class="btn-universal" onclick="addToLocker('Drone Scout')">PRENDI</button>
                </div>
            </div>

            <div class="shelf">
                <div class="product-card">
                    <span class="icon-display">🪖</span>
                    <div class="price-tag">85€</div>
                    <h3>Casco Clay</h3>
                    <button class="btn-universal" onclick="addToLocker('Casco Clay')">PRENDI</button>
                </div>
                <div class="product-card">
                    <span class="icon-display">💣</span>
                    <div class="price-tag">15€</div>
                    <h3>Pongo Granata</h3>
                    <button class="btn-universal" onclick="addToLocker('Pongo Granata')">PRENDI</button>
                </div>
            </div>
        </div>

        <div class="backpack-area">
            <div class="backpack-title">ZAINO TATTICO</div>
            <div id="cart-display" style="display:flex; flex-wrap:wrap; justify-content:center; gap:10px; width:100%;"></div>
        </div>
    </div>

    <div id="notification-popup">
        <span style="font-size: 1.5rem">✅</span>
        <span id="popup-text">Oggetto Aggiunto!</span>
    </div>

    <script>
        /* --- GESTIONE LOGICA E DATABASE --- */
        const MY_LOCKER_KEY = 'diego_v9003_cart';
        
        // 1. Cursore
        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        // 2. Database
        function getLocker() {
            return JSON.parse(localStorage.getItem(MY_LOCKER_KEY)) || [];
        }
        function saveLocker(cart) {
            localStorage.setItem(MY_LOCKER_KEY, JSON.stringify(cart));
            renderCart();
        }

        function addToLocker(item) {
            const cart = getLocker();
            cart.push(item);
            saveLocker(cart);
            showPopup(`Preso: ${item}`);
        }

        function removeFromLocker(index) {
            const cart = getLocker();
            cart.splice(index, 1);
            saveLocker(cart);
        }

        function renderCart() {
            const cart = getLocker();
            const display = document.getElementById('cart-display');
            display.innerHTML = '';
            
            if(cart.length === 0) {
                display.innerHTML = '<span style="opacity:0.6">Zaino vuoto</span>';
                return;
            }

            cart.forEach((item, index) => {
                const el = document.createElement('div');
                el.className = 'cart-item';
                // Notare: il bottone X ora usa classi coerenti
                el.innerHTML = `${item} <button class="remove-btn" onclick="removeFromLocker(${index})">X</button>`;
                display.appendChild(el);
            });
            refreshHoverEffects();
        }

        // 3. Sistema Pop-up (Notifica)
        function showPopup(text) {
            const popup = document.getElementById('notification-popup');
            const popupText = document.getElementById('popup-text');
            
            popupText.innerText = text;
            popup.classList.add('show');

            // Nascondi dopo 2 secondi
            setTimeout(() => {
                popup.classList.remove('show');
            }, 2000);
        }

        // 4. GOD MODE TOGGLE
        function toggleGodMode() {
            document.body.classList.toggle('god-mode');
            const isGod = document.body.classList.contains('god-mode');
            
            if(isGod) {
                showPopup("GOD MODE ATTIVATA");
            } else {
                showPopup("Modalità Soldato");
            }
        }

        // 5. Gestione Hover Globale (per cursore)
        function refreshHoverEffects() {
            const interactives = document.querySelectorAll('button, header');
            interactives.forEach(el => {
                el.addEventListener('mouseenter', () => cursor.classList.add('hovered'));
                el.addEventListener('mouseleave', () => cursor.classList.remove('hovered'));
            });
        }

        // Init
        renderCart();
        refreshHoverEffects();

    </script>
</body>
</html>
