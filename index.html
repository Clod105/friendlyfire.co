<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friendly Fire - PS1 Experience</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000;
            overflow: hidden; font-family: 'Courier New', Courier, monospace; 
        }

        /* TEXTURE CRT GLOBALE ESTESA */
        #crt-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; pointer-events: none; 
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 3px, 3px 100%; animation: flicker 0.15s infinite;
        }
        @keyframes flicker { 0% { opacity: 0.95; } 50% { opacity: 0.85; } 100% { opacity: 0.95; } }

        /* SCHERMATA PRINCIPALE */
        #game-container {
            position: relative; width: 100%; height: 100%;
            background-image: url('momifire.png'); background-size: cover; background-position: center; display: block;
        }

        #loading-wrapper { position: absolute; bottom: 12%; left: 50%; transform: translateX(-50%); z-index: 20; }
        .loading-bar-container {
            display: flex; gap: 2px; padding: 4px; background-color: #2b2b2b;
            background-image: repeating-linear-gradient(45deg, transparent, transparent 2px, #1a1a1a 2px, #1a1a1a 4px);
            border-top: 3px solid #666; border-left: 3px solid #666; border-bottom: 3px solid #111; border-right: 3px solid #111;
        }
        .segment { width: 24px; height: 32px; background-color: #050505; border: 1px solid #000; }
        .segment.lit-1 { background-color: #630000; } .segment.lit-2 { background-color: #990000; }
        .segment.lit-3 { background-color: #cc0000; } .segment.lit-4 { background-color: #d82b00; }
        .segment.lit-5 { background-color: #e65c00; } .segment.lit-6 { background-color: #f28c00; }
        .segment.lit-7 { background-color: #ffb300; } .segment.lit-8 { background-color: #ffcc00; }
        .segment.lit-9 { background-color: #ffe666; } .segment.lit-10{ background-color: #fff9b3; }

        #start-btn {
            display: none; position: absolute; bottom: 12%; left: 50%; transform: translateX(-50%);
            z-index: 20; background: transparent; color: #ffffff; font-family: 'Courier New', Courier, monospace;
            font-size: 28px; font-weight: bold; border: none; text-shadow: 3px 3px 0px #000; cursor: pointer; animation: blink 1s steps(2, start) infinite;
        }
        @keyframes blink { to { visibility: hidden; } }

        /* MENU PRINCIPALE */
        #main-menu {
            display: none; position: absolute; bottom: 15%; left: 50%; transform: translateX(-50%);
            z-index: 20; flex-direction: column; align-items: flex-start; gap: 15px;
        }
        .menu-item { color: #ffffff; text-decoration: none; font-family: 'Courier New', Courier, monospace; font-size: 26px; font-weight: bold; text-shadow: 3px 3px 0px #000; position: relative; cursor: pointer; }
        .menu-item:hover { color: #ffcc00; }
        .menu-item:hover::before { content: "▶"; position: absolute; left: -30px; top: 2px; color: #ffcc00; }

        /* STRUTTURA SUB-PAGES */
        .sub-page {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000; background-size: cover; background-position: center; 
            z-index: 10; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 40px;
            overflow-y: auto; overflow-x: hidden; 
        }

        /* SFONDI SPECIFICI */
        #PAGINA-STORE, #PAGINA-MUSIC, #PAGINA-CONTACTS {
            background-image: url('momifire_bg.png'); 
        }
        #PAGINA-PICTURES {
            background-image: url('bakeka.jpg'); 
        }

        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: -1; }
        
        /* FIX SFONDO SCURO: Rimuoviamo l'overlay nero dalla pagina Pictures per mostrare bene bakeka.jpg */
        #PAGINA-PICTURES .bg-overlay { display: none; }

        .back-btn {
            position: fixed; bottom: 30px; right: 30px; font-family: 'Courier New', Courier, monospace; font-size: 20px; font-weight: bold;
            background: #111; color: #fff; padding: 10px 20px; border: 2px solid #666; cursor: pointer; box-shadow: 4px 4px 0px #000; z-index: 50;
        }
        .back-btn:hover { background: #ffcc00; color: #000; border-color: #fff; }

        /* LAYOUT DELLO STORE - VERO 3D */
        .store-layout-centered { display: flex; flex-direction: column; align-items: center; width: 90%; max-width: 600px; gap: 20px; margin-top: 20px; }
        .viewer-container {
            width: 100%; height: 480px; background: #1a1a1a;
            border: 4px solid #444; border-top-color: #888; border-left-color: #888;
            box-shadow: inset 0 0 30px #000, 10px 10px 0 rgba(0,0,0,0.8);
            position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        model-viewer { width: 100%; height: 100%; --poster-color: transparent; image-rendering: pixelated; }

        .controls-container-stacked { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 600px; }
        .item-selector { display: flex; align-items: center; justify-content: space-between; background: #222; border: 2px solid #555; padding: 10px; box-shadow: 4px 4px 0 #000; }
        .item-selector button { background: transparent; border: none; font-family: 'Courier New', Courier, monospace; color: #ffcc00; font-size: 24px; cursor: pointer; }
        .item-selector button:hover { color: #fff; }
        #item-name-display { font-size: 20px; font-weight: bold; color: #fff; text-align: center; flex-grow: 1; text-transform: uppercase; }
        .size-section { background: #111; padding: 10px; border: 2px solid #333; box-shadow: 4px 4px 0 #000; display: flex; align-items: center; justify-content: space-between; }
        .size-section p { margin: 0; color: #aaa; font-size: 16px; }
        .size-grid { display: flex; gap: 5px; }
        .size-btn { background: #2b2b2b; color: #fff; border: 2px solid #000; border-top-color: #555; border-left-color: #555; font-family: 'Courier New', Courier, monospace; font-weight: bold; font-size: 18px; width: 40px; height: 35px; cursor: pointer; }
        .size-btn.active { background: #ffcc00; color: #000; border-color: #fff; box-shadow: inset 0 0 8px #cc8800; }
        #buy-btn {
            background: #ff00ff; color: #40E0D0; font-family: 'Courier', monospace; font-size: 24px; font-weight: bold;
            padding: 12px; border: 3px solid #fff; border-bottom-color: #8b008b; border-right-color: #8b008b;
            cursor: pointer; text-align: center; box-shadow: 5px 5px 0 #000; transition: transform 0.1s;
        }
        #buy-btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 #000; }

        /* PAGINA PICTURES - POLAROID INTERATTIVE */
        /* FIX POLAROID SCURA: Rimosso z-index dal contenitore per permettere alla polaroid di scavalcare lo sfondo nero */
        .polaroid-area { position: relative; width: 100%; height: 80vh; max-width: 800px; margin: 0 auto; }
        
        #polaroid-backdrop {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85); z-index: 80; cursor: pointer;
        }

        .polaroid { 
            background: #eaeaea; padding: 10px 10px 35px 10px; box-shadow: 6px 6px 0px rgba(0,0,0,0.8); 
            position: absolute; border: 1px solid #999; cursor: pointer; transition: transform 0.3s ease;
        }
        .polaroid-inner { 
            background: #111; width: 160px; height: 160px; box-shadow: inset 2px 2px 5px #000; border: 1px solid #000; 
        }
        
        .pol-1 { top: 10%; left: 10%; transform: rotate(-8deg); }
        .pol-2 { top: 40%; left: 40%; transform: rotate(12deg); }
        .pol-3 { top: 15%; left: 65%; transform: rotate(-5deg); }
        .pol-4 { top: 55%; left: 15%; transform: rotate(4deg); }

        /* La polaroid ingrandita scavalca tutto grazie allo z-index 100 (superiore all'80 del backdrop) */
        .polaroid.zoomed {
            position: fixed;
            top: 50% !important; left: 50% !important;
            transform: translate(-50%, -50%) scale(1.8) !important;
            z-index: 100;
            box-shadow: 15px 15px 0px rgba(0,0,0,0.9);
        }

        /* PAGINA MUSIC E PS1-IPOD */
        .music-layout { display: flex; flex-direction: column; align-items: center; gap: 40px; width: 100%; max-width: 600px; }
        .music-list { display: flex; flex-direction: column; gap: 15px; width: 80%; background: #111; padding: 20px; border: 4px solid #333; box-shadow: 5px 5px 0 #000; text-align: center;}
        .music-track { color: #aaa; font-size: 18px; cursor: pointer; text-shadow: 2px 2px 0 #000; transition: 0.1s;}
        .music-track:hover { color: #fff; }
        .music-track.playing { color: #ffcc00; font-weight: bold; }
        .music-track.playing::before { content: "▶ "; color: #4ade80; }
        
        .ps1-ipod {
            background: #7a7a7a; border: 4px solid #b3b3b3; border-bottom-color: #333; border-right-color: #333; border-radius: 10px;
            padding: 20px; width: 260px; display: flex; flex-direction: column; align-items: center; gap: 25px; box-shadow: 10px 10px 0px rgba(0,0,0,0.8);
        }
        .ipod-screen {
            width: 90%; height: 70px; background: #0f1c0f; border: 4px solid #444; border-top-color: #111; border-left-color: #111;
            box-shadow: inset 0 0 10px #000; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 10px;
        }
        #ipod-status { color: #aaa; font-size: 12px; margin-bottom: 5px; }
        #ipod-track-display { color: #4ade80; font-size: 13px; text-shadow: 2px 2px 0px #000; text-align: center; font-weight: bold; }
        
        .ipod-wheel {
            position: relative; width: 160px; height: 160px; background: #555; border-radius: 50%; border: 4px solid #333; border-top-color: #999; border-left-color: #999;
            display: flex; justify-content: center; align-items: center; box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }
        .wheel-btn { 
            position: absolute; background: transparent; border: none; color: #ccc; 
            font-family: 'Courier New', Courier, monospace; font-weight: bold; font-size: 18px; 
            cursor: pointer; text-shadow: 2px 2px 0 #000; padding: 10px; 
        }
        .wheel-btn:hover { color: #4ade80; }
        .wheel-btn:active { transform: scale(0.9); }
        .btn-menu { top: 5px; } .btn-prev { left: 5px; } .btn-next { right: 5px; } .btn-play { bottom: 5px; }
        .btn-center { width: 60px; height: 60px; background: #888; border-radius: 50%; border: 3px solid #ccc; border-bottom-color: #333; border-right-color: #333; cursor: pointer; box-shadow: 2px 2px 5px rgba(0,0,0,0.5); }
        .btn-center:active { border-top-color: #333; border-left-color: #333; border-bottom-color: #ccc; border-right-color: #ccc; }

        /* PAGINA CONTACTS - FORM DIRETTO PULITO */
        .contacts-container { display: flex; flex-direction: column; align-items: center; gap: 30px; margin-top: 50px; width: 100%; padding-bottom: 80px;}
        
        .memo-paper {
            background: #dcdcdc; padding: 20px 30px; width: 85%; max-width: 500px;
            border: 2px solid #000; box-shadow: 10px 10px 0px rgba(0,0,0,0.9);
            display: flex; flex-direction: column; gap: 15px;
        }
        
        .memo-form { display: flex; flex-direction: column; gap: 15px; }
        .memo-input {
            background: transparent; border: none; border-bottom: 2px dashed #555;
            font-family: 'Courier New', Courier, monospace; font-size: 18px; color: #000; padding: 5px 0; font-weight: bold;
        }
        .memo-input:focus { outline: none; border-bottom: 2px solid #000; }
        textarea.memo-input { resize: none; height: 100px; }
        
        .memo-submit {
            background: #ff00ff; color: #fff; font-family: 'Courier New', Courier, monospace; font-size: 20px; font-weight: bold;
            border: 3px solid #000; padding: 12px; cursor: pointer; box-shadow: 4px 4px 0 #000; margin-top: 10px;
            text-shadow: 2px 2px 0 #000; transition: transform 0.1s; text-transform: uppercase;
        }
        .memo-submit:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 #000; }

    </style>
</head>
<body>

    <div id="crt-overlay"></div>

    <div id="game-container">
        <div id="loading-wrapper">
            <div class="loading-bar-container" id="loading-bar">
                <div class="segment" id="seg-1"></div><div class="segment" id="seg-2"></div>
                <div class="segment" id="seg-3"></div><div class="segment" id="seg-4"></div>
                <div class="segment" id="seg-5"></div><div class="segment" id="seg-6"></div>
                <div class="segment" id="seg-7"></div><div class="segment" id="seg-8"></div>
                <div class="segment" id="seg-9"></div><div class="segment" id="seg-10"></div>
            </div>
        </div>
        <button id="start-btn">PRESS START</button>
        <nav id="main-menu">
            <div class="menu-item" onclick="openPage('PAGINA-STORE')">STORE</div>
            <div class="menu-item" onclick="openPage('PAGINA-PICTURES')">PICTURES</div>
            <div class="menu-item" onclick="openPage('PAGINA-MUSIC')">MUSIC</div>
            <div class="menu-item" onclick="openPage('PAGINA-CONTACTS')">CONTACTS</div>
        </nav>
    </div>

    <div id="PAGINA-STORE" class="sub-page">
        <div class="bg-overlay"></div>
        <div class="store-layout-centered">
            <div class="viewer-container">
                <model-viewer id="real-3d-model" src="shorts.glb" alt="Modello 3D PS1" auto-rotate camera-controls disable-zoom interaction-prompt="none" shadow-intensity="0" exposure="1"></model-viewer>
            </div>
            <div class="controls-container-stacked">
                <div class="item-selector">
                    <button onclick="changeItem(-1)">◀</button>
                    <div id="item-name-display">PANTALONCINI FIRE</div>
                    <button onclick="changeItem(1)">▶</button>
                </div>
                <div class="size-section">
                    <p>SIZE:</p>
                    <div class="size-grid">
                        <button class="size-btn active" onclick="selectSize(this)">S</button>
                        <button class="size-btn" onclick="selectSize(this)">M</button>
                        <button class="size-btn" onclick="selectSize(this)">L</button>
                        <button class="size-btn" onclick="selectSize(this)">XL</button>
                    </div>
                </div>
                <button id="buy-btn" onclick="buyItem()">ACQUISTA</button>
            </div>
        </div>
        <button class="back-btn" onclick="closePage()">BACK</button>
    </div>

    <div id="PAGINA-PICTURES" class="sub-page">
        <div class="bg-overlay"></div>
        <div id="polaroid-backdrop" onclick="closePolaroid()"></div>
        <div class="polaroid-area">
            <div class="polaroid pol-1" onclick="togglePolaroid(this)"><div class="polaroid-inner"></div></div>
            <div class="polaroid pol-2" onclick="togglePolaroid(this)"><div class="polaroid-inner"></div></div>
            <div class="polaroid pol-3" onclick="togglePolaroid(this)"><div class="polaroid-inner"></div></div>
            <div class="polaroid pol-4" onclick="togglePolaroid(this)"><div class="polaroid-inner"></div></div>
        </div>
        <button class="back-btn" onclick="closePage()">BACK</button>
    </div>
    
    <div id="PAGINA-MUSIC" class="sub-page">
        <div class="bg-overlay"></div>
        <div class="music-layout">
            <div class="music-list">
                <div class="music-track playing" onclick="selectTrack(0)">Tyrell - Marijuana Miracle or MYTH</div>
            </div>
            <div class="ps1-ipod">
                <div class="ipod-screen">
                    <div id="ipod-status">PAUSED</div>
                    <div id="ipod-track-display">Tyrell - Marijuana Miracle or MYTH</div>
                </div>
                <div class="ipod-wheel">
                    <button class="wheel-btn btn-menu" onclick="stopTrack()">STOP</button>
                    <button class="wheel-btn btn-prev" onclick="prevTrack()">|&lt;&lt;</button>
                    <button class="wheel-btn btn-next" onclick="nextTrack()">&gt;&gt;|</button>
                    <button class="wheel-btn btn-play" onclick="togglePlay()">&gt;||</button>
                    <button class="btn-center" onclick="togglePlay()"></button>
                </div>
            </div>
        </div>
        <button class="back-btn" onclick="closePage()">BACK</button>
    </div>

    <div id="PAGINA-CONTACTS" class="sub-page">
        <div class="bg-overlay"></div>
        <div class="contacts-container">
            <div class="memo-paper">
                <form class="memo-form" action="https://formsubmit.co/info@friendlyfireclo.com" method="POST">
                    <input type="hidden" name="_captcha" value="false">
                    <input type="text" name="ID_Giocatore" id="contact-name" class="memo-input" placeholder="ID NAME" required>
                    <textarea name="Messaggio" id="contact-msg" class="memo-input" placeholder="Scrivi qui...." required></textarea>
                    <button type="submit" class="memo-submit">INVIA</button>
                </form>
            </div>
        </div>
        <button class="back-btn" onclick="closePage()">BACK</button>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            let currentSegment = 1;
            const totalSegments = 10;
            const loadingInterval = setInterval(() => {
                if (currentSegment <= totalSegments) {
                    document.getElementById(`seg-${currentSegment}`).classList.add(`lit-${currentSegment}`);
                    currentSegment++;
                } else {
                    clearInterval(loadingInterval);
                    document.getElementById('loading-wrapper').style.display = 'none';
                    document.getElementById('start-btn').style.display = 'block';
                }
            }, 300); 

            document.getElementById('start-btn').addEventListener('click', () => {
                document.getElementById('start-btn').style.display = 'none';
                document.getElementById('main-menu').style.display = 'flex';
            });
        });

        function openPage(pageId) {
            document.getElementById('game-container').style.display = 'none';
            document.getElementById(pageId).style.display = 'flex';
        }
        function closePage() {
            const pages = document.querySelectorAll('.sub-page');
            pages.forEach(p => p.style.display = 'none');
            closePolaroid();
            document.getElementById('game-container').style.display = 'block';
        }

        function togglePolaroid(element) {
            const isZoomed = element.classList.contains('zoomed');
            document.querySelectorAll('.polaroid').forEach(p => p.classList.remove('zoomed'));
            if (!isZoomed) {
                element.classList.add('zoomed');
                document.getElementById('polaroid-backdrop').style.display = 'block';
            } else {
                document.getElementById('polaroid-backdrop').style.display = 'none';
            }
        }
        function closePolaroid() {
            document.querySelectorAll('.polaroid').forEach(p => p.classList.remove('zoomed'));
            document.getElementById('polaroid-backdrop').style.display = 'none';
        }

        const storeItems = [
            { name: "PANTALONCINI FIRE", modelSrc: "shorts.glb" },
            { name: "FELPA FLAME", modelSrc: "felpa.glb" },
            { name: "GIACCA CAMO", modelSrc: "giacca.glb" }
        ];
        let currentItemIndex = 0;

        function changeItem(direction) {
            currentItemIndex += direction;
            if (currentItemIndex < 0) currentItemIndex = storeItems.length - 1;
            if (currentItemIndex >= storeItems.length) currentItemIndex = 0;
            const newItem = storeItems[currentItemIndex];
            document.getElementById("item-name-display").innerText = newItem.name;
            document.getElementById("real-3d-model").src = newItem.modelSrc;
        }

        function selectSize(btnElement) {
            document.querySelectorAll('.size-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
        }
        function buyItem() {
            const activeSize = document.querySelector('.size-btn.active').innerText;
            const currentItemName = storeItems[currentItemIndex].name;
            alert(`Acquisto simulato: ${currentItemName} (${activeSize})`);
        }

        const playlist = [
            { title: "Tyrell - Marijuana Miracle or MYTH", file: "marijuana.mp3" }
        ];
        let currentTrack = 0;
        let isPlaying = false; 
        
        let audioPlayer = new Audio(playlist[currentTrack].file);
        audioPlayer.addEventListener('ended', nextTrack);

        function updatePlayerUI() {
            document.getElementById('ipod-track-display').innerText = playlist[currentTrack].title;
            document.getElementById('ipod-status').innerText = isPlaying ? "PLAYING..." : "PAUSED";
            const trackElements = document.querySelectorAll('.music-track');
            trackElements.forEach((el, index) => {
                if(index === currentTrack) el.classList.add('playing');
                else el.classList.remove('playing');
            });
        }

        function togglePlay() {
            if (isPlaying) { audioPlayer.pause(); } else { audioPlayer.play(); }
            isPlaying = !isPlaying;
            updatePlayerUI();
        }

        function stopTrack() {
            audioPlayer.pause();
            audioPlayer.currentTime = 0; 
            isPlaying = false;
            updatePlayerUI();
        }

        function loadAndPlayNewTrack() {
            audioPlayer.pause(); 
            audioPlayer = new Audio(playlist[currentTrack].file); 
            audioPlayer.addEventListener('ended', nextTrack);
            if (isPlaying) { audioPlayer.play(); }
            updatePlayerUI();
        }

        function nextTrack() {
            currentTrack = (currentTrack + 1) % playlist.length;
            loadAndPlayNewTrack();
        }

        function prevTrack() {
            currentTrack = (currentTrack - 1 + playlist.length) % playlist.length;
            loadAndPlayNewTrack();
        }

        function selectTrack(index) {
            if (currentTrack === index) { togglePlay(); return; }
            currentTrack = index;
            isPlaying = true;
            loadAndPlayNewTrack();
        }
    </script>
</body>
</html>
