<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FRIENDLYFIRE CO.</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <script src="https://js.stripe.com/v3/"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <style>
        /* --- STILI ORIGINALI MANTENUTI --- */
        :root { --red: #ff3a3a; --bg-pongo: #2e4a1e; --loader-bg: #ffffff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; outline: none; touch-action: manipulation; }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; 
            font-family: 'Press Start 2P', cursive; 
            background: var(--bg-pongo) url('sfondo_pongo.PNG') repeat fixed center; 
            background-size: 450px; 
            overscroll-behavior: none; position: fixed; 
        }

        /* --- LOADER --- */
        #loader-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--loader-bg); 
            z-index: 999999; 
            display: flex; flex-direction: column; 
            justify-content: center; align-items: center;
            padding: 20px;
        }
        .loader-center { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; }
        .pixel-bar-container { width: 160px; height: 16px; background: #fff; border: 3px solid #000; border-radius: 10px; padding: 3px; box-shadow: 4px 4px 0 rgba(0,0,0,0.1); margin-top: 10px; }
        .pixel-bar-fill { height: 100%; width: 0%; background-color: #32cd32; border-radius: 4px; transition: width 0.05s linear; }
        #start-btn { visibility: visible; opacity: 0; pointer-events: none; margin-top: 20px; z-index: 200; transition: opacity 0s; }
        #start-btn.visible { opacity: 1; pointer-events: auto; }

        /* --- UI ELEMENTS --- */
        header { display: flex; justify-content: space-between; align-items: flex-start; padding: 15px 25px; position: absolute; top: 0; left: 0; right: 0; z-index: 10000; pointer-events: none; }
        .pongo-btn { width: 70px; height: 70px; object-fit: contain; cursor: pointer; pointer-events: auto; filter: drop-shadow(0 4px 0 rgba(0,0,0,0.5)); transition: transform 0.2s; }
        .pongo-btn:active { transform: scale(0.9); }
        
        .tank-wrapper { position: relative; pointer-events: auto; z-index: 10002; }
        #tank-badge { position: absolute; top: 5px; right: 0; background: var(--red); color: white; border: 2px solid #000; font-size: 8px; padding: 4px; border-radius: 50%; min-width: 22px; text-align: center; display: none; pointer-events: none; z-index: 10003; }
        
        #shop-slider { width: 100vw; height: 100%; display: flex; overflow-x: scroll; scroll-snap-type: x mandatory; scroll-behavior: smooth; }
        .shop-page { min-width: 100vw; height: 100%; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr); padding: 110px 15px 150px 15px; gap: 10px; scroll-snap-align: start; }
        
        .item-card { display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 100; transition: transform 0.3s; }
        .item-card img { width: 85px; pointer-events: none; filter: drop-shadow(0 5px 8px rgba(0,0,0,0.6)); margin-bottom: 5px; }
        .clean-tag { font-family: sans-serif; font-weight: 800; font-size: 8px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.8); text-transform: uppercase; }
        .item-card.sold-out { filter: grayscale(1); opacity: 0.8; pointer-events: none !important; }

        #app-footer { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; display: flex; align-items: center; justify-content: center; z-index: 20000; pointer-events: none; }
        .footer-logo { width: 160px; pointer-events: auto; cursor: pointer; }

        #cart-popup { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; max-width: 320px; background: #fff; border: 3px double #000; padding: 10px; z-index: 90000; box-shadow: 15px 15px 0 rgba(0,0,0,0.8); text-align: center; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 50000; flex-direction: column; align-items: center; justify-content: center; }
        .mac-window { width: 90%; max-width: 350px; background: #fff; border: 3px double #000; padding: 10px; text-align: center; display: flex; flex-direction: column; align-items: center; }
        .mac-title-bar { width: 100%; background: #ccc; border-bottom: 2px solid #000; padding: 8px; margin-bottom: 15px; font-weight: 800; font-size: 10px; }
        
        .btn-pixel { background: #000; color: #fff; border: 2px solid #000; padding: 14px; font-family: 'Press Start 2P'; font-size: 8px; cursor: pointer; margin: 8px 0; width: 90%; text-transform: uppercase; }
        .input-pixel { border: 2px solid #000; background: #fff; color: #000; padding: 10px; font-family: sans-serif; font-weight: bold; font-size: 10px; width: 90%; margin: 8px 0; }
        .db-panel { width: 90%; height: 250px; overflow-y: scroll; background: #fff; border: 2px solid #000; margin-bottom: 10px; padding: 5px; color: #000; text-align: left; }
        .db-row { display: flex; align-items: center; gap: 5px; border-bottom: 1px solid #ccc; padding: 5px 0; }
        
        /* Loading Status */
        #sync-status { position:fixed; bottom:5px; right:5px; font-size:6px; color:white; z-index:999999; }
    </style>
</head>
<body>

    <div id="sync-status">OFFLINE</div>

    <div id="loader-overlay">
        <div class="loader-center">
            <img src="loadernob.gif" alt="Loading..." style="width: 150px;">
            <div style="font-size: 10px; margin-top: 20px;">LOADING...</div>
            <div class="pixel-bar-container"><div id="pixel-bar-fill" class="pixel-bar-fill"></div></div>
            <button id="start-btn" class="btn-pixel">START</button>
        </div>
    </div>

    <audio id="sfx" src="suono_gnam.mp3" preload="auto"></audio>

    <header>
        <img src="mondo_pongo.PNG" class="pongo-btn" onclick="openPage('ov-world')">
        <img src="fuochini_centrali.png" class="pongo-btn" onclick="openPage('ov-profile')">
        <div class="tank-wrapper">
            <img src="tank_header.PNG" class="pongo-btn" id="tank-btn" onclick="toggleCart()">
            <div id="tank-badge">0</div>
        </div>
    </header>

    <div id="shop-slider">
        <div id="page-1" class="shop-page"></div>
        <div id="page-2" class="shop-page"></div>
        <div id="page-3" class="shop-page"></div>
    </div>

    <footer id="app-footer">
        <img src="brand_name.png" class="footer-logo">
    </footer>

    <div id="cart-popup">
        <div class="mac-title-bar">TANK SUMMARY</div>
        <div id="cart-preview" style="width:90%; font-size:6px; margin-bottom:10px; max-height:60px; overflow-y:auto; color:#000; background:#eee; padding:5px; border:2px solid #000; text-align:left;"></div>
        <p style="font-size:12px; margin-bottom:15px; color:#000;">TOTAL: <span id="cart-total">0</span>€</p>
        <button class="btn-pixel" onclick="openPage('ov-checkout')">CHECKOUT</button>
        <button class="btn-pixel" style="background:#fff; color:#000;" onclick="emptyTank()">EMPTY</button>
        <button class="btn-pixel" style="background:transparent; color:#000; border:none;" onclick="toggleCart()">CLOSE</button>
    </div>

    <div id="ov-profile" class="overlay">
        <div class="mac-window">
            <div class="mac-title-bar">PROFILE</div>
            <img src="fuochini_centrali.png" style="width:100px; margin-bottom:10px;">
            <div id="av-grid" style="display:grid; grid-template-columns:repeat(4,1fr); gap:4px; margin-bottom:15px; width:90%;"></div>
            <button class="btn-pixel" onclick="closeAll()">BACK</button>
        </div>
    </div>

    <div id="ov-checkout" class="overlay">
        <div class="mac-window">
            <div class="mac-title-bar">CHECKOUT</div>
            <div style="text-align:left; width:90%; font-size:8px; margin-bottom:10px;">
                TOTAL: <span id="checkout-total">0</span>€
            </div>
            <input type="text" id="cust-name" class="input-pixel" placeholder="FULL NAME">
            <input type="email" id="cust-email" class="input-pixel" placeholder="E-MAIL">
            <input type="text" id="cust-addr" class="input-pixel" placeholder="ADDRESS">
            
            <button id="pay-btn" class="btn-pixel" style="background:#5469d4;" onclick="sendOrder()">
                CONFIRM & PAY
            </button>
            <button class="btn-pixel" style="background:transparent; color:#000;" onclick="closeAll()">CANCEL</button>
        </div>
    </div>

    <div id="ov-db" class="overlay">
        <div class="mac-window" style="max-width:95%;">
            <div class="mac-title-bar">TITANIUM DB (GLOBAL)</div>
            <p style="font-size:8px; color:red;">CHANGES ARE LIVE FOR EVERYONE</p>
            <input id="db-bg-input" class="input-pixel" placeholder="MAIN BG URL..." style="margin-bottom:5px;">
            <div class="db-panel" id="db-list"></div>
            <div style="display:flex; gap:5px; width:90%; flex-wrap: wrap;">
                <button class="btn-pixel" style="width:48%;" onclick="addItem()">+ ADD</button>
                <button class="btn-pixel" style="width:48%; background: green;" onclick="saveGlobalDB()">SAVE GLOBAL</button>
            </div>
            <button class="btn-pixel" onclick="closeAll()">EXIT</button>
        </div>
    </div>

    <script>
        // ======================================================
        // 1. CONFIGURAZIONE CHIAVI (DA MODIFICARE!)
        // ======================================================
        
        // EMAILJS: Vai su emailjs.com -> Crea account free -> Crea Service e Template
        const EMAILJS_PUBLIC_KEY = "TUO_PUBLIC_KEY_QUI"; 
        const EMAILJS_SERVICE_ID = "TUO_SERVICE_ID_QUI"; 
        const EMAILJS_TEMPLATE_ID = "TUO_TEMPLATE_ID_QUI";

        // SUPABASE: Vai su supabase.com -> Crea progetto free
        const SUPABASE_URL = "https://tuo-progetto.supabase.co";
        const SUPABASE_KEY = "tua-anon-public-key-qui";

        // ======================================================
        
        // Inizializzazione Servizi
        (function(){ emailjs.init(EMAILJS_PUBLIC_KEY); })();
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Inventario Default (se DB offline o vuoto)
        let inventory = [
            {id:0, name: 'CAP FIRE', img:'image_cap.PNG', price:45, stock:5}, 
            {id:1, name: 'TEE FLAME', img:'image_tee.PNG', price:65, stock:5},
            // ... puoi aggiungere gli altri qui come fallback
        ];
        
        let cart = []; 
        let dbClicks = 0;

        // --- CARICAMENTO DATI DAL CLOUD ---
        window.addEventListener('DOMContentLoaded', async () => {
            startLoaderSequence();
            await loadGlobalData(); // Carica dati veri dal server
        });

        async function loadGlobalData() {
            document.getElementById('sync-status').innerText = "SYNCING...";
            
            // Scarica impostazioni (tabella 'config')
            // Devi creare una tabella 'config' su Supabase con colonne: id, bg_url, inventory_json
            const { data, error } = await supabase
                .from('config')
                .select('*')
                .eq('id', 1)
                .single();

            if (data && !error) {
                // Se trova i dati online, li usa per tutti
                if(data.bg_url) document.body.style.backgroundImage = `url('${data.bg_url}')`;
                if(data.inventory_json) inventory = data.inventory_json;
                document.getElementById('sync-status').innerText = "ONLINE";
                
                // Salva localmente per velocità futura
                localStorage.setItem('ff_bg_main', data.bg_url);
            } else {
                console.log("Uso dati locali (Offline o primo avvio)");
                document.getElementById('sync-status').innerText = "LOCAL MODE";
                // Fallback locale
                const localBg = localStorage.getItem('ff_bg_main');
                if(localBg) document.body.style.backgroundImage = `url('${localBg}')`;
            }
            renderShop();
        }

        // --- FUNZIONE ORDINE VIA EMAIL ---
        function sendOrder() {
            const name = document.getElementById('cust-name').value;
            const email = document.getElementById('cust-email').value;
            const addr = document.getElementById('cust-addr').value;
            const total = cart.reduce((s,i)=>s+inventory[i].price,0);

            if(!name || !email || !addr) { alert("FILL ALL FIELDS"); return; }
            if(cart.length === 0) { alert("CART EMPTY"); return; }

            const btn = document.getElementById('pay-btn');
            btn.innerText = "SENDING...";
            btn.disabled = true;

            // Prepara lista oggetti
            let itemsList = cart.map(i => `${inventory[i].name} (${inventory[i].price}€)`).join("\n");

            // Parametri per il template EmailJS
            // Nel template EmailJS usa variabili: {{to_name}}, {{customer_email}}, {{address}}, {{order_items}}, {{total_price}}
            const templateParams = {
                to_name: "Diego", // La mail arriva a te
                customer_name: name,
                customer_email: email,
                address: addr,
                order_items: itemsList,
                total_price: total + "€"
            };

            emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams)
                .then(function() {
                    alert("ORDER SENT! CHECK YOUR MAIL DIEGO.");
                    btn.innerText = "CONFIRM & PAY";
                    btn.disabled = false;
                    cart = [];
                    updateCartUI();
                    closeAll();
                    // Qui potresti anche aggiornare lo stock su Supabase (avanzato)
                }, function(error) {
                    alert("FAILED: " + JSON.stringify(error));
                    btn.innerText = "RETRY";
                    btn.disabled = false;
                });
        }

        // --- SISTEMA AMMINISTRATORE (SALVA SU CLOUD) ---
        // Accesso Admin: Clicca 3 volte sul logo nel footer
        document.querySelector('.footer-logo').onclick = () => { 
            dbClicks++; playSfx(); 
            if(dbClicks === 3) { 
                setTimeout(() => { 
                    const pwd = prompt("ADMIN ACCESS"); 
                    if(pwd === "FRIENDLYFIRE26") initDB(); 
                    else alert("WRONG"); 
                }, 100); 
                dbClicks = 0; 
            } 
            setTimeout(() => dbClicks = 0, 800); 
        };

        function initDB() { 
            const db = document.getElementById('ov-db'); closeAll(); db.style.display = 'flex'; 
            const l = document.getElementById('db-list'); l.innerHTML=''; 
            // Prendi sfondo attuale
            let currentBg = document.body.style.backgroundImage.slice(4, -1).replace(/"/g, "");
            document.getElementById('db-bg-input').value = currentBg; 
            
            inventory.forEach((t,i)=>{ 
                l.innerHTML+=`<div class="db-row"><span style="font-size:8px;">#${i}</span><input id="d-n-${i}" value="${t.name}" class="input-pixel" placeholder="Name" style="width:50px;"><input id="d-i-${i}" value="${t.img}" class="input-pixel" placeholder="IMG" style="width:50px;"><input id="d-p-${i}" value="${t.price}" class="input-pixel" style="width:30px;" placeholder="€"><input id="d-s-${i}" value="${t.stock}" type="number" class="input-pixel" style="width:30px;" placeholder="Stk"><button onclick="removeItem(${i})" style="background:red; color:white; border:none; cursor:pointer;">X</button></div>`; 
            }); 
        }

        async function saveGlobalDB() {
            // 1. Raccogli i dati dal pannello
            const newBg = document.getElementById('db-bg-input').value;
            inventory.forEach((t,i)=>{ 
                if(document.getElementById(`d-n-${i}`)) { 
                    t.name = document.getElementById(`d-n-${i}`).value; 
                    t.img = document.getElementById(`d-i-${i}`).value; 
                    t.price = parseInt(document.getElementById(`d-p-${i}`).value) || 0; 
                    t.stock = parseInt(document.getElementById(`d-s-${i}`).value) || 0; 
                } 
            });

            const saveBtn = document.querySelector('#ov-db button[style*="green"]');
            saveBtn.innerText = "SAVING TO CLOUD...";

            // 2. Invia a Supabase
            const { error } = await supabase
                .from('config')
                .upsert({ id: 1, bg_url: newBg, inventory_json: inventory });

            if (!error) {
                // Aggiorna anche visivamente subito
                if(newBg) document.body.style.backgroundImage = `url('${newBg}')`;
                localStorage.setItem('ff_bg_main', newBg); // Cache locale
                alert("SAVED TO CLOUD! EVERYONE WILL SEE THIS.");
                renderShop(); 
                closeAll();
            } else {
                alert("ERROR SAVING TO CLOUD: " + error.message);
            }
            saveBtn.innerText = "SAVE GLOBAL";
        }

        function addItem() { inventory.push({name:'NEW', img:'image_tee.PNG', price:0, stock:1}); initDB(); }
        function removeItem(i) { inventory.splice(i,1); initDB(); }

        // --- FUNZIONI UI STANDARD (Invariate) ---
        function startLoaderSequence() {
            const fillBar = document.getElementById('pixel-bar-fill');
            const startBtn = document.getElementById('start-btn');
            let fillLevel = 0;
            const interval = setInterval(() => {
                fillLevel += 1; 
                if (fillLevel >= 100) {
                    fillLevel = 100; fillBar.style.width = fillLevel + '%'; clearInterval(interval);
                    setTimeout(() => { startBtn.classList.add('visible'); playSfx(); }, 400);
                } else { fillBar.style.width = fillLevel + '%'; }
            }, 20);
            startBtn.onclick = () => { playSfx(); document.getElementById('loader-overlay').style.display = 'none'; };
        }

        const sfx = document.getElementById('sfx');
        function playSfx() { sfx.currentTime=0; sfx.play().catch(()=>{}); }
        function openPage(id) { 
            playSfx(); closeAll(); 
            const page = document.getElementById(id);
            if(page) {
                page.style.display='flex';
                if(id === 'ov-checkout') {
                    const total = cart.reduce((s,i)=>s+inventory[i].price,0);
                    document.getElementById('checkout-total').innerText = total;
                }
            }
        }
        function closeAll() { document.querySelectorAll('.overlay').forEach(o=>o.style.display='none'); document.getElementById('cart-popup').style.display='none'; }
        function toggleCart() { 
            playSfx(); const p = document.getElementById('cart-popup'); 
            const isVisible = window.getComputedStyle(p).display !== 'none';
            if(isVisible) { p.style.display = 'none'; } 
            else { p.style.display = 'block'; }
        }

        function renderShop() {
            [1,2,3].forEach(n => {
                const el = document.getElementById('page-'+n);
                if(el) el.innerHTML='';
            });
            inventory.forEach((item, idx) => {
                const pageNum = Math.floor(idx / 12) + 1;
                const pageEl = document.getElementById('page-'+pageNum);
                if(!pageEl) return;
                const card = document.createElement('div'); card.className = 'item-card'; card.id = `item-${idx}`;
                let priceDisplay = item.price + "€"; 
                if(item.stock <= 0) { card.classList.add('sold-out'); priceDisplay = "SOLD OUT"; }
                card.innerHTML = `<img src="${item.img}"><div class="clean-tag">${item.name}</div><div class="clean-tag">${priceDisplay}</div>`;
                if(cart.includes(idx)) card.style.opacity = '0.3';
                if(item.stock > 0 && !cart.includes(idx)) {
                    card.onclick = () => { addToCart(idx); };
                }
                pageEl.appendChild(card);
            });
        }

        function addToCart(idx) { if(!cart.includes(idx) && inventory[idx].stock > 0) { cart.push(idx); updateCartUI(); const tank = document.getElementById('tank-btn'); tank.classList.add('pacman'); setTimeout(()=>tank.classList.remove('pacman'), 500); renderShop(); } }
        function updateCartUI() { const b = document.getElementById('tank-badge'); b.innerText = cart.length; b.style.display = cart.length > 0 ? 'block' : 'none'; const total = cart.reduce((s,i)=>s+inventory[i].price,0); document.getElementById('cart-total').innerText = total; const list = document.getElementById('cart-preview'); list.innerHTML = cart.map(i => { return `<div style="display:flex; justify-content:space-between; border-bottom:1px dashed #999; padding:4px 0;"><span>${inventory[i].name}</span><span>${inventory[i].price}€</span></div>`; }).join(""); }
        function emptyTank() { cart=[]; updateCartUI(); renderShop(); toggleCart(); }

    </script>
</body>
</html>
