<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FRIENDLYFIRE | V21000 GALLERY</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        /* --- 1. SETTAGGI UNIVERSALI --- */
        :root { 
            --red: #ff3a3a; --green: #4AF626; --bg-pongo: #2e4a1e; --holo-cyan: #00f3ff; 
            --black: #000; --white: #fff;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; outline: none; }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; 
            font-family: 'Press Start 2P', cursive; 
            background-color: var(--bg-pongo); background-image: url('sfondo2.jpg'); 
            background-size: cover; background-position: center; background-repeat: no-repeat;
            overscroll-behavior: none; position: fixed; transition: all 0.4s ease;
        }

        /* --- 2. MODALITÀ HOLOGRAM --- */
        body.hologram-mode { background-image: none !important; background-color: #050a14; }
        body.hologram-mode::after {
            content: " "; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 255, 255, 0.05) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 6px 100%; pointer-events: none; z-index: 1;
        }
        body.hologram-mode .window { background: rgba(0, 15, 30, 0.9); border-color: var(--holo-cyan); color: var(--holo-cyan); box-shadow: 0 0 20px rgba(0, 243, 255, 0.2); }
        body.hologram-mode .win-h { background: rgba(0, 243, 255, 0.1); border-bottom: 1px solid var(--holo-cyan); color: var(--holo-cyan); }
        body.hologram-mode .btn { background: transparent !important; border: 1px solid var(--holo-cyan); color: var(--holo-cyan) !important; }

        /* --- 3. LOADER --- */
        #loader-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #ffffff; z-index: 2147483647; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; transition: opacity 0.3s; }
        .loader-logo { width: 80%; max-width: 280px; margin-bottom: 30px; object-fit: contain; }
        .bar-container { width: 80%; max-width: 280px; height: 20px; background: #fff; border: 3px solid #000; padding: 2px; }
        .bar-fill { height: 100%; width: 0%; background-color: var(--green); animation: fillLoad 1.5s forwards; }
        @keyframes fillLoad { 0%{width:0%} 100%{width:100%} }
        #start-btn { visibility: hidden; background: #000; color: #fff; border: 3px solid #000; padding: 15px 40px; font-family: inherit; font-size: 12px; margin-top: 20px; cursor: pointer; position: relative; z-index: 2147483647; }
        #start-btn.visible { visibility: visible; animation: flash 1s infinite alternate; }
        @keyframes flash { from{transform:scale(1)} to{transform:scale(1.05)} }

        /* --- 4. HEADER --- */
        header { position: fixed; top: 0; left: 0; width: 100%; height: 100px; z-index: 20000; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; padding-top: env(safe-area-inset-top, 10px); pointer-events: none; }
        .h-btn { width: 65px; height: 65px; object-fit: contain; pointer-events: auto; cursor: pointer; filter: drop-shadow(0 4px 0 rgba(0,0,0,0.5)); transition: transform 0.1s; }
        .h-btn:active { transform: scale(0.9); }
        .pongo-anim { animation: sq 0.3s; } @keyframes sq { 0%,100%{transform:scale(1);} 50%{transform:scale(0.8);} }
        #tank-wrapper { position: relative; pointer-events: auto; }
        #tank-badge { position: absolute; top: 0; right: -5px; background: var(--red); color: white; border: 2px solid #000; font-size: 9px; padding: 4px; border-radius: 50%; display: none; }

        /* --- 5. SHOP --- */
        #shop-view { width: 100vw; height: 100%; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; padding-top: 110px; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; position: relative; z-index: 10; }
        #shop-view::-webkit-scrollbar { display: none; }
        .shop-page { min-width: 100vw; height: 100%; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr); gap: 10px; padding: 0 15px 120px 15px; scroll-snap-align: start; align-content: start; }
        .item { display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; touch-action: pan-x pan-y; width: 100%; height: 100%; min-height: 100px; cursor: grab; }
        .item:active { cursor: grabbing; }
        .item img { width: 85px; height: 85px; object-fit: contain; pointer-events: none; filter: drop-shadow(0 5px 6px rgba(0,0,0,0.5)); }
        .label { font-family: sans-serif; font-weight: 900; font-size: 8px; color: #fff; text-shadow: 0 1px 2px #000; margin-top: 5px; text-align:center;}
        .sold-out { opacity: 0.4; filter: grayscale(100%); pointer-events: none; cursor: default; }

        /* --- 6. GHOST --- */
        .ghost { position: fixed; z-index: 99999; pointer-events: none; width: 85px !important; height: 85px !important; display: flex; justify-content: center; align-items: center; opacity: 0.9; transform: scale(1.1); filter: drop-shadow(0 15px 15px rgba(0,0,0,0.6)); }
        .ghost img { width: 100% !important; height: 100% !important; object-fit: contain !important; }

        /* --- 7. WINDOWS --- */
        .window { display: none; position: fixed; top: 10%; left: 5%; width: 90%; max-width: 380px; background: #fff; border: 3px solid #000; box-shadow: 10px 10px 0 rgba(0,0,0,0.6); z-index: 50000; flex-direction: column; max-height: 85vh; }
        .win-h { background: #000; color: #fff; border-bottom: 2px solid #000; padding: 12px; cursor: move; display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 10px; }
        .win-x { background: var(--red); width: 20px; height: 20px; border: 1px solid #fff; cursor: pointer; }
        .win-b { padding: 15px; overflow-y: auto; }
        .btn { width: 100%; padding: 12px; margin-top: 10px; background: #000; color: #fff; border: 2px solid #000; font-size: 10px; cursor: pointer; font-family: inherit; transition: 0.1s; }
        .btn:active { transform: scale(0.98); background: #333; }
        .btn-red { background: var(--red); color: #fff; border: 2px solid #000; }
        .btn-white { background: #fff; color: #000; border: 2px solid #000; }
        .row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #ccc; padding: 8px 0; font-size: 10px; }
        input, select, textarea { width: 100%; padding: 8px; border: 2px solid #000; background: #fff; color: #000; font-family: monospace; font-size: 10px; }
        textarea { height: 80px; resize: none; margin-top: 10px; font-family: inherit; }

        /* --- AVATAR UI --- */
        .avatar-box { width: 100px; height: 120px; border: 3px solid #000; margin: 10px auto; position: relative; background: #ddd; overflow: hidden; }
        .av-body { position: absolute; bottom: -10px; left: 20px; width: 60px; height: 80px; background: #ffcc99; border-radius: 30px 30px 0 0; border: 2px solid #000; }
        .av-head { position: absolute; top: 15px; left: 25px; width: 50px; height: 50px; background: #ffcc99; border-radius: 50%; border: 2px solid #000; }
        .av-hair { position: absolute; top: 10px; left: 20px; width: 60px; height: 30px; background: #000; border-radius: 30px 30px 0 0; border: 2px solid #000; }
        .inv-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 10px; }
        .inv-slot { width: 100%; aspect-ratio: 1; border: 1px dashed #000; display: flex; justify-content: center; align-items: center; background:#f9f9f9; }
        .inv-slot img { width: 80%; height: 80%; object-fit: contain; }

        footer { position: fixed; bottom: 0; left: 0; width: 100%; height: 80px; display: flex; justify-content: center; align-items: center; z-index: 12000; pointer-events: none; }
        .brand { width: 160px; pointer-events: auto; cursor: pointer; padding: 20px; }
    </style>
</head>
<body>

    <div id="loader-overlay">
        <img src="logo_ff_loader.png" class="loader-logo" onerror="this.src='https://placehold.co/300x80?text=FRIENDLYFIRE'">
        <div class="bar-container"><div id="bar-fill" class="bar-fill"></div></div>
        <button id="start-btn" onclick="startApp()" ontouchstart="startApp()">START WORLD</button>
    </div>

    <header>
        <img src="mondo_pongo.PNG" class="h-btn" onclick="anim(this); showWin('win-news')" onerror="this.src='https://placehold.co/60?text=NEWS'">
        <img src="fuochini_centrali.png" class="h-btn" onclick="anim(this); showWin('win-prof')" onerror="this.src='https://placehold.co/60?text=PROF'">
        <div id="tank-wrapper">
            <img src="tank_header.PNG" id="tank-target" class="h-btn" onclick="anim(this); toggleWin('win-cart')" onerror="this.src='https://placehold.co/60?text=TANK'">
            <div id="tank-badge">0</div>
        </div>
    </header>

    <div id="shop-view">
        <div id="page-1" class="shop-page"></div>
        <div id="page-2" class="shop-page"></div>
        <div id="page-3" class="shop-page"></div>
    </div>

    <footer><img src="brand_name.png" class="brand" id="brand-target" onclick="adminTrigger()" onerror="this.src='https://placehold.co/150x40?text=ADMIN'"></footer>

    <div id="win-cart" class="window">
        <div class="win-h" onmousedown="dragWin(event,'win-cart')" ontouchstart="dragWin(event,'win-cart')"><span>IL TUO TANK</span><div class="win-x" onclick="hideAll()"></div></div>
        <div class="win-b">
            <div id="cart-list">VUOTO</div>
            <div id="cart-tot" style="margin-top:10px;border-top:2px solid #000;padding-top:10px;font-weight:bold;">TOT: 0€</div>
            <button class="btn" onclick="pay()">ORDINA / PRENOTA</button>
            <button class="btn btn-red" onclick="cart=[];upCart();">SVUOTA</button>
        </div>
    </div>

    <div id="win-prof" class="window">
        <div class="win-h" onmousedown="dragWin(event,'win-prof')" ontouchstart="dragWin(event,'win-prof')"><span>PROFILO & AVATAR</span><div class="win-x" onclick="hideAll()"></div></div>
        <div class="win-b">
            <input type="text" id="prof-nick" placeholder="NICKNAME" style="text-align:center; font-weight:bold; margin-bottom:10px;" onchange="saveProfile()">
            <div style="display:flex; justify-content:space-between; font-size:8px;">
                <label>PELLE: <input type="color" id="prof-skin" value="#ffcc99" style="height:25px; padding:0;" onchange="updateAvatar()"></label>
                <label>CAPELLI: <input type="color" id="prof-hair" value="#000000" style="height:25px; padding:0;" onchange="updateAvatar()"></label>
            </div>
            <div class="avatar-box"><div class="av-body" id="av-body-el"></div><div class="av-head" id="av-head-el"></div><div class="av-hair" id="av-hair-el"></div></div>
            <div style="font-weight:bold; font-size:10px; margin-top:15px; border-bottom:2px solid #000;">IL TUO INVENTARIO</div>
            <div class="inv-grid" id="inv-grid"></div>
        </div>
    </div>

    <div id="win-admin" class="window">
        <div class="win-h" onmousedown="dragWin(event,'win-admin')" ontouchstart="dragWin(event,'win-admin')"><span>ADMIN</span><div class="win-x" onclick="hideAll()"></div></div>
        <div class="win-b">
            <div style="display:flex; justify-content:space-between; font-size:8px; font-weight:bold; margin-bottom:5px;">
                <span style="width:20%">IMG (2click)</span><span style="width:20%">NOME</span><span style="width:15%">€</span><span style="width:35%">TAGLIE/QTY</span><span style="width:10%">X</span>
            </div>
            <div id="adm-list"></div>
            <button class="btn btn-white" onclick="addItm()">+ NUOVO ITEM</button>
            <button class="btn" onclick="saveAdm()">SALVA (DB)</button>
        </div>
    </div>

    <div id="win-details" class="window">
        <div class="win-h" onmousedown="dragWin(event,'win-details')" ontouchstart="dragWin(event,'win-details')"><span>DETTAGLI</span><div class="win-x" onclick="hideAll()"></div></div>
        <div class="win-b" style="display:flex; flex-direction:column; align-items:center;">
            
            <div style="display:flex; align-items:center; justify-content:space-between; width:100%; position:relative; margin-bottom:5px; height: 180px;">
                <button id="btn-prev-img" class="btn-white" style="width:30px; height:30px; padding:0; z-index:2; display:none;" onclick="changeGallery(-1)"><</button>
                <img id="det-img" src="" style="width:70%; max-height:180px; object-fit:contain; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.3)); flex-grow:1;">
                <button id="btn-next-img" class="btn-white" style="width:30px; height:30px; padding:0; z-index:2; display:none;" onclick="changeGallery(1)">></button>
            </div>
            <div id="det-img-dots" style="font-size:8px; font-weight:bold; margin-bottom:10px; text-align:center; height:10px;"></div>
            
            <h3 id="det-title" style="margin:0; font-size:14px; text-align:center;"></h3>
            <p id="det-price" style="margin:5px 0 10px 0; font-size:12px; color:var(--red); font-weight:bold;"></p>
            
            <div id="det-size-container" style="width:100%; display:none; margin-bottom:10px;">
                <span style="font-size:8px; margin-bottom:5px; display:block;">SELEZIONA TAGLIA:</span>
                <select id="det-size"></select>
            </div>
            <textarea id="det-desc" placeholder="Descrizione prodotto..." readonly></textarea>
            
            <button id="btn-add-tank" class="btn" onclick="addFromDetails()">AGGIUNGI AL TANK</button>
            <button id="btn-save-desc" class="btn btn-white" style="display:none;" onclick="saveDesc()">SALVA DESCRIZIONE (ADMIN)</button>
        </div>
    </div>

    <div id="win-news" class="window"><div class="win-h"><span>NEWSLETTER</span><div class="win-x" onclick="hideAll()"></div></div><div class="win-b"><input id="nm" type="email" placeholder="Email"><button class="btn" onclick="sub()">ISCRIVITI AL DROP</button></div></div>

    <script>
        const CFG = { 
            u:'https://jwifyapbnsbbpsrstrow.supabase.co', 
            k:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp3aWZ5YXBibnNiYnBzcnN0cm93Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA1NzM1OTUsImV4cCI6MjA4NjE0OTU5NX0.dmhdHZRJuYo7-OlpSR3S5ca7ink9w6a5DM-u2ac4c2Y', 
            ek:'BThMV2knP0VG0s4nr', es:'service_4scv4hn', et:'template_8opoo1v' 
        };
        
        let items=[];
        let cart=[], sb=null, taps=0;
        let adminActive = false;
        
        // Variabili Galleria
        let curDetIdx = -1;
        let curGallery = [];
        let curGalleryIdx = 0;

        // USER PROFILE SYSTEM (LOCAL STORAGE)
        let userProfile = { nick: '', skin: '#ffcc99', hair: '#000000', inv: [] };

        function loadProfile() {
            let saved = localStorage.getItem('ff_user');
            if (saved) { userProfile = JSON.parse(saved); document.getElementById('prof-nick').value = userProfile.nick; document.getElementById('prof-skin').value = userProfile.skin; document.getElementById('prof-hair').value = userProfile.hair; }
            updateAvatar(); renderInventory();
        }
        function saveProfile() { userProfile.nick = document.getElementById('prof-nick').value; userProfile.skin = document.getElementById('prof-skin').value; userProfile.hair = document.getElementById('prof-hair').value; localStorage.setItem('ff_user', JSON.stringify(userProfile)); updateAvatar(); }
        function updateAvatar() { let s = document.getElementById('prof-skin').value; let h = document.getElementById('prof-hair').value; document.getElementById('av-body-el').style.backgroundColor = s; document.getElementById('av-head-el').style.backgroundColor = s; document.getElementById('av-hair-el').style.backgroundColor = h; saveProfile(); }
        function renderInventory() { let grid = document.getElementById('inv-grid'); if (userProfile.inv.length === 0) { grid.innerHTML = '<div style="grid-column: span 3; text-align:center; font-size:8px; padding:20px 0;">Nessun drop acquisito.</div>'; return; } grid.innerHTML = userProfile.inv.map(x => `<div class="inv-slot" title="${x.name}"><img src="${x.img}"></div>`).join(''); }

        setTimeout(()=>{ let b=document.getElementById('start-btn'); if(b) b.classList.add('visible'); document.getElementById('bar-fill').style.width='100%'; }, 1600);

        function startApp() {
            let o = document.getElementById('loader-overlay'); o.style.opacity='0'; o.style.pointerEvents='none'; setTimeout(()=>{o.style.display='none'},300);
            loadProfile();
            try{ if(window.supabase){ sb=window.supabase.createClient(CFG.u,CFG.k); loadDB(); setupRealtime(); } if(window.emailjs)emailjs.init(CFG.ek); }catch(e){}
        }
        
        async function loadDB(){ if(!sb)return; const{data}=await sb.from('products').select('*').order('id'); if(data&&data.length){ items=data.map(x=>formatItem(x)); render(); } }
        function formatItem(x) { return {id:x.id, name:x.name, p:x.price, q:x.qty, i:x.img, d:x.desc || '', sz:x.sizes || ''}; }

        function setupRealtime() {
            if(!sb) return; sb.channel('public:products').on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, (payload) => {
                if(payload.eventType === 'INSERT') items.push(formatItem(payload.new));
                if(payload.eventType === 'UPDATE') { let idx = items.findIndex(x => x.id === payload.new.id); if(idx !== -1) items[idx] = formatItem(payload.new); }
                if(payload.eventType === 'DELETE') items = items.filter(x => x.id !== payload.old.id);
                render(); 
            }).subscribe();
        }

        function getRealQty(item) {
            if (item.sz && item.sz.includes(':')) { return item.sz.split(',').reduce((tot, part) => { let val = parseInt(part.split(':')[1]); return tot + (isNaN(val) ? 0 : val); }, 0); }
            return parseInt(item.q) || 0;
        }

        function render(){
            const pages = [document.getElementById('page-1'), document.getElementById('page-2'), document.getElementById('page-3')];
            pages.forEach(p => p.innerHTML = ''); 
            
            items.forEach((item, i) => {
                let pageIdx = Math.floor(i / 9);
                if (pageIdx < pages.length) {
                    let realQty = getRealQty(item); let sold = realQty <= 0;
                    
                    // PRENDIAMO SOLO LA PRIMA IMMAGINE PER LO SHOP (SE CE NE SONO DI PIÙ, SONO SEPARATE DA VIRGOLA)
                    let firstImg = item.i.split(',')[0].trim();
                    
                    pages[pageIdx].innerHTML += `<div class="item ${sold?'sold-out':''}" id="i-${i}" 
                        ontouchstart="handleTouch(event,${i})" onmousedown="handleMouse(event,${i})">
                        <img src="${firstImg}" onerror="this.src='https://placehold.co/80?text=${item.name}'">
                        <div class="label">${item.name}</div><div class="label">${item.p}€</div>
                    </div>`;
                }
            });
        }

        let lastTap = 0, dragTimer = null, startX=0, startY=0, isDragging = false;
        function handleTouch(e, i) {
            let now = Date.now(); let touch = e.touches[0];
            if (now - lastTap < 350) { e.preventDefault(); clearTimeout(dragTimer); showDetails(i); lastTap = 0; return; }
            lastTap = now; startX = touch.clientX; startY = touch.clientY; isDragging = false;
            dragTimer = setTimeout(() => { isDragging = true; let el = document.getElementById(`i-${i}`); startGhostDrag(i, el.getBoundingClientRect(), startX, startY); }, 300); 
            let el = document.getElementById(`i-${i}`);
            function onMove(ev) { let t = ev.touches[0]; if (!isDragging && (Math.abs(t.clientX - startX) > 10 || Math.abs(t.clientY - startY) > 10)) { clearTimeout(dragTimer); el.removeEventListener('touchmove', onMove); } }
            function onEnd() { if (!isDragging) clearTimeout(dragTimer); el.removeEventListener('touchmove', onMove); el.removeEventListener('touchend', onEnd); }
            el.addEventListener('touchmove', onMove); el.addEventListener('touchend', onEnd);
        }

        function handleMouse(e, i) {
            let el = document.getElementById(`i-${i}`); el.ondblclick = () => { clearTimeout(dragTimer); showDetails(i); };
            dragTimer = setTimeout(() => { startGhostDrag(i, el.getBoundingClientRect(), e.clientX, e.clientY); }, 250);
            let onUp = () => { clearTimeout(dragTimer); document.removeEventListener('mouseup', onUp); }; document.addEventListener('mouseup', onUp);
        }

        function startGhostDrag(i, rect, inputX, inputY) {
            let g = document.getElementById(`i-${i}`).cloneNode(true); g.className = 'ghost'; 
            let halfW = 42.5; let halfH = 42.5; g.style.left = (inputX - halfW) + 'px'; g.style.top = (inputY - halfH) + 'px';
            document.body.appendChild(g); let offsetX = inputX - rect.left, offsetY = inputY - rect.top, lastEdgeScroll = 0;

            function move(ev) {
                ev.preventDefault(); let cx = ev.type.includes('touch') ? ev.touches[0].clientX : ev.clientX; let cy = ev.type.includes('touch') ? ev.touches[0].clientY : ev.clientY;
                g.style.left = (cx - halfW) + 'px'; g.style.top = (cy - halfH) + 'px';
                let sv = document.getElementById('shop-view'), now = Date.now();
                if (now - lastEdgeScroll > 800) { if (cx > window.innerWidth - 60) { sv.scrollBy({left: window.innerWidth, behavior: 'smooth'}); lastEdgeScroll = now; } else if (cx < 60) { sv.scrollBy({left: -window.innerWidth, behavior: 'smooth'}); lastEdgeScroll = now; } }
            }
            function end(ev) {
                document.removeEventListener('touchmove', move); document.removeEventListener('touchend', end); document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', end);
                let gx = parseInt(g.style.left) + 40, gy = parseInt(g.style.top) + 40;
                let tk = document.getElementById('tank-target').getBoundingClientRect();
                if (Math.hypot(gx - (tk.left + tk.width/2), gy - (tk.top + tk.height/2)) < 60) { g.remove(); if (items[i].sz && items[i].sz.includes(':')) { showDetails(i); } else { cart.push({...items[i], selSize: ''}); upCart(); showWin('win-cart'); } return; }
                g.style.display='none'; let bel=document.elementFromPoint(gx,gy); g.style.display='flex';
                let trg=bel?bel.closest('.item'):null; if(trg && trg.id!==`i-${i}` && !trg.classList.contains('sold-out')){ let ti=parseInt(trg.id.split('-')[1]); [items[i],items[ti]]=[items[ti],items[i]]; render(); }
                g.remove();
            }
            document.addEventListener('touchmove', move, {passive:false}); document.addEventListener('touchend', end); document.addEventListener('mousemove', move); document.addEventListener('mouseup', end);
        }

        // --- SISTEMA GALLERIA NEI DETTAGLI ---
        function showDetails(i) {
            curDetIdx = i; let item = items[i];
            
            // Creiamo l'array della galleria separando le virgole
            curGallery = item.i.split(',').map(img => img.trim()).filter(Boolean);
            curGalleryIdx = 0;
            updateGalleryUI();
            
            document.getElementById('det-title').innerText = item.name; 
            document.getElementById('det-price').innerText = item.p + " €";
            
            let sizeCont = document.getElementById('det-size-container'); let sizeSelect = document.getElementById('det-size'); sizeSelect.innerHTML = '';
            let btnAdd = document.getElementById('btn-add-tank');

            if (item.sz && item.sz.includes(':')) {
                sizeCont.style.display = 'block'; let parts = item.sz.split(',').map(s => s.trim().split(':')); let hasAvailable = false;
                parts.forEach(p => { let name = p[0].trim(); let q = parseInt(p[1]); if (q > 0) { sizeSelect.innerHTML += `<option value="${name}">${name} (Disp: ${q})</option>`; hasAvailable = true; } });
                if(!hasAvailable) { sizeSelect.innerHTML = `<option value="">TUTTE LE TAGLIE ESAURITE</option>`; sizeSelect.disabled = true; btnAdd.style.display = 'none'; } 
                else { sizeSelect.disabled = false; btnAdd.style.display = 'block'; }
            } else { sizeCont.style.display = 'none'; btnAdd.style.display = getRealQty(item) > 0 ? 'block' : 'none'; }
            
            let descArea = document.getElementById('det-desc'); descArea.value = item.d || ""; let saveBtn = document.getElementById('btn-save-desc');
            if(adminActive) { descArea.readOnly = false; descArea.style.border = "2px solid blue"; saveBtn.style.display = "block"; } 
            else { descArea.readOnly = true; descArea.style.border = "2px solid #000"; saveBtn.style.display = "none"; }
            
            showWin('win-details');
        }

        function updateGalleryUI() {
            if(curGallery.length === 0) curGallery = ['https://placehold.co/80?text=NO+IMG'];
            document.getElementById('det-img').src = curGallery[curGalleryIdx];
            
            let btnP = document.getElementById('btn-prev-img');
            let btnN = document.getElementById('btn-next-img');
            let dots = document.getElementById('det-img-dots');
            
            if(curGallery.length > 1) {
                btnP.style.display = 'block'; btnN.style.display = 'block';
                dots.innerText = `${curGalleryIdx + 1} / ${curGallery.length}`;
            } else {
                btnP.style.display = 'none'; btnN.style.display = 'none';
                dots.innerText = '';
            }
        }

        function changeGallery(dir) {
            curGalleryIdx += dir;
            if(curGalleryIdx >= curGallery.length) curGalleryIdx = 0;
            if(curGalleryIdx < 0) curGalleryIdx = curGallery.length - 1;
            updateGalleryUI();
        }

        function addFromDetails() {
            let item = items[curDetIdx]; let sSize = '';
            if (item.sz && item.sz.includes(':')) { let sel = document.getElementById('det-size'); if(!sel.value) return alert("Scegli una taglia!"); sSize = sel.value; }
            cart.push({...item, selSize: sSize}); upCart(); hideAll(); showWin('win-cart');
        }

        async function saveDesc() {
            if(curDetIdx === -1) return; items[curDetIdx].d = document.getElementById('det-desc').value;
            if(sb) { const { error } = await sb.from('products').update({ desc: items[curDetIdx].d }).eq('id', items[curDetIdx].id); if(error) alert("Errore DB: " + error.message); else alert("Descrizione Aggiornata!"); }
            hideAll();
        }

        function upCart(){ 
            document.getElementById('tank-badge').innerText=cart.length; document.getElementById('tank-badge').style.display=cart.length?'block':'none'; 
            document.getElementById('cart-list').innerHTML=cart.length?cart.map((x,n)=>`<div class="row"><span>${x.name} ${x.selSize?'- '+x.selSize:''}</span><span>${x.p}€</span><span onclick="cart.splice(${n},1);upCart()" style="color:red;cursor:pointer;font-weight:bold;">X</span></div>`).join(''):"VUOTO"; 
            document.getElementById('cart-tot').innerText="TOT: "+cart.reduce((a,b)=>a+parseInt(b.p),0)+"€"; 
        }

        async function pay(){ 
            if(!cart.length)return alert("Il Tank è vuoto"); let m=prompt("Email per completare l'ordine:"); 
            if(m){ 
                let uName = userProfile.nick || "Utente";
                if(sb) await sb.from('newsletter').insert([{email:m}]); 
                if(window.emailjs) emailjs.send(CFG.es,CFG.et,{ user_email: m, user_name: uName, message: "NUOVO ORDINE RICEVUTO" }); 
                cart.forEach(c => { userProfile.inv.push({ name: c.name, img: c.i.split(',')[0].trim() }); }); saveProfile(); renderInventory();
                alert("Grazie " + uName + "! Gli oggetti sono nel tuo Profilo."); cart=[]; upCart(); hideAll(); 
            } 
        }

        async function sub(){ 
            let m=document.getElementById('nm').value; 
            if(m) { 
                let uName = userProfile.nick || "Amico";
                if(sb) await sb.from('newsletter').insert([{email:m}]); 
                if(window.emailjs) { try { await emailjs.send(CFG.es, CFG.et, { user_email: m, user_name: uName, message: "BENVENUTO NEL MONDO FRIENDLYFIRE!" }); } catch(e) {} } 
                alert("Iscritto, " + uName + "!"); hideAll(); 
            } 
        }

        function adminTrigger(){ taps++; if(taps>=3){ if(prompt("PWD")==="FRIENDLYFIRE26") { adminActive=true; showAdm(); } taps=0; } setTimeout(()=>taps=0, 1000); }
        
        // --- FUNZIONE AGGIUNGI FOTO ALLA GALLERIA DA ADMIN ---
        function addGalleryImg(idx) {
            let input = document.getElementById(`i${idx}`);
            let newUrl = prompt("Incolla qui l'URL della nuova foto per la galleria:");
            if (newUrl && newUrl.trim() !== '') {
                let current = input.value.trim();
                // Aggiungiamo la virgola solo se c'è già una foto
                input.value = current ? current + ',' + newUrl.trim() : newUrl.trim();
                alert("Foto aggiunta in coda! Ricordati di premere SALVA (DB).");
            }
        }

        function showAdm(){
            // Ho aggiunto ondblclick="addGalleryImg(${i})" sul campo immagine
            document.getElementById('adm-list').innerHTML=items.map((x,i)=>`<div class="row">
                <input id="i${i}" value="${x.i}" ondblclick="addGalleryImg(${i})" title="DOPPIO CLICK PER AGGIUNGERE FOTO" style="width:20%;font-size:8px;color:#000;">
                <input id="n${i}" value="${x.name}" style="width:20%;color:#000;">
                <input id="p${i}" value="${x.p}" type="number" style="width:15%;color:#000;">
                <input id="s${i}" value="${x.sz || x.q}" placeholder="S:5,M:0" style="width:35%; font-size:8px;color:#000;">
                <button class="btn-red" style="width:10%;" onclick="deleteItem(${i})">X</button>
            </div>`).join('');
            showWin('win-admin');
        }
        
        function addItm(){ items.push({id:Date.now(),name:'NEW',p:0,q:1,i:'image_cap.png',d:'',sz:''}); showAdm(); }
        
        async function deleteItem(i) {
            if(!confirm('Eliminare definitivamente?')) return;
            let item = items[i];
            if(item.id && sb) { const { error } = await sb.from('products').delete().eq('id', item.id); if(error) { alert("Errore: " + error.message); return; } }
            items.splice(i, 1); showAdm(); render();
        }

        async function saveAdm(){ 
            items.forEach((x,i)=>{ 
                if(document.getElementById(`n${i}`)){ 
                    x.name=document.getElementById(`n${i}`).value; x.p=document.getElementById(`p${i}`).value; x.i=document.getElementById(`i${i}`).value;
                    let sVal = document.getElementById(`s${i}`).value;
                    if(sVal.includes(':')) { x.sz = sVal; x.q = 0; } else { x.q = sVal; x.sz = ''; }
                } 
            });
            render(); 
            if(sb) {
                const updates = items.map(x => ({ id: x.id, name: x.name, price: parseInt(x.p), qty: parseInt(x.q), sizes: x.sz, img: x.i, desc: x.d }));
                const { error } = await sb.from('products').upsert(updates);
                if(error) alert("Errore: " + error.message); else alert("Salvato nel Database!");
            }
            hideAll();
        }

        function anim(el){ el.classList.remove('pongo-anim'); void el.offsetWidth; el.classList.add('pongo-anim'); }
        function showWin(id){ hideAll(); document.getElementById(id).style.display='flex'; }
        function toggleWin(id){ let w=document.getElementById(id); if(w.style.display==='flex') hideAll(); else { showWin(id); upCart(); } }
        function hideAll(){ document.querySelectorAll('.window').forEach(w=>w.style.display='none'); }

        let wDrag=null,wx=0,wy=0;
        function dragWin(e,id){ wDrag=document.getElementById(id); let t=e.touches?e.touches[0]:e, r=wDrag.getBoundingClientRect(); wx=t.clientX-r.left; wy=t.clientY-r.top; function mv(ev){ let c=ev.touches?ev.touches[0]:ev; wDrag.style.left=(c.clientX-wx)+'px'; wDrag.style.top=(c.clientY-wy)+'px'; ev.preventDefault(); } function st(){ document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',st); document.removeEventListener('touchmove',mv); document.removeEventListener('touchend',st); } document.addEventListener('mousemove',mv); document.addEventListener('mouseup',st); document.addEventListener('touchmove',mv,{passive:false}); document.addEventListener('touchend',st); }
    </script>
</body>
</html>
