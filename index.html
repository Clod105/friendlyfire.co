<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FRIENDLYFIRE CO.</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://js.stripe.com/v3/"></script>

    <style>
        /* --- 1. SETUP --- */
        :root { --red: #ff3a3a; --bg-pongo: #2e4a1e; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; outline: none; touch-action: manipulation; }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; 
            font-family: 'Press Start 2P', cursive; 
            background: var(--bg-pongo) url('sfondo2.jpg') no-repeat center center fixed; 
            background-size: cover; 
            overscroll-behavior: none; position: fixed; 
        }

        /* --- 2. LOADER (CLASSICO CON MARK & COPYRIGHT) --- */
        #loader-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background-color: #ffffff; z-index: 999999; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            transition: opacity 0.5s ease-out; 
        }
        .loader-brand-img { width: 280px; max-width: 85%; height: auto; object-fit: contain; margin-bottom: 20px; }
        
        .gif-wrapper { width: 180px; height: 180px; display: flex; justify-content: center; align-items: center; }
        #loader-gif { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; }
        
        .loading-area-bottom { display: flex; flex-direction: column; align-items: center; margin-top: 10px; width: 100%; min-height: 70px; }
        .loading-text { font-size: 10px; color: #000; margin-bottom: 10px; letter-spacing: 2px; text-transform: uppercase; }
        
        .pixel-bar-container { width: 180px; height: 16px; background: #fff; border: 3px solid #000; padding: 2px; box-shadow: 4px 4px 0 rgba(0,0,0,0.1); }
        .pixel-bar-fill { height: 100%; width: 0%; background-color: #32cd32; transition: width 0.1s linear; }
        
        #start-btn { display: none; background: #000; color: #fff; border: 2px solid #000; padding: 15px 30px; font-family: 'Press Start 2P'; font-size: 12px; cursor: pointer; margin-top: 15px; animation: blink 1s infinite; box-shadow: 4px 4px 0 #999; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }
        
        /* COPYRIGHT SECTION */
        .loader-footer { 
            position: absolute; bottom: 20px; width: 100%; 
            display: flex; flex-direction: column; align-items: center; text-align: center; 
        }
        .copyright-mark { width: 35px; height: auto; margin-bottom: 8px; opacity: 0.8; }
        .copyright-text { font-family: Arial, sans-serif; font-weight: bold; font-size: 9px; color: #000; opacity: 0.6; line-height: 1.4; }

        /* --- 3. HEADER --- */
        header { 
            display: flex; justify-content: space-between; align-items: flex-start; 
            padding: 15px 20px; position: absolute; top: 0; left: 0; right: 0; 
            z-index: 10000; pointer-events: none; 
        }
        .pongo-btn { 
            width: 65px; height: 65px; object-fit: contain; 
            cursor: pointer; pointer-events: auto; 
            transition: transform 0.1s; filter: drop-shadow(0 4px 2px rgba(0,0,0,0.4)); 
        }
        .pongo-btn:active { transform: scale(0.9); }
        .tank-wrapper { position: relative; pointer-events: auto; }
        #tank-badge { position: absolute; top: 0; right: -5px; background: var(--red); color: white; border: 2px solid #000; font-size: 9px; padding: 3px 6px; border-radius: 50%; display: none; z-index: 10003; }

        /* --- 4. SHOP SLIDER --- */
        #shop-slider { 
            width: 100vw; height: 100%; 
            display: flex; 
            overflow-x: scroll; overflow-y: hidden;
            scroll-snap-type: x mandatory; 
            -webkit-overflow-scrolling: touch; 
            scroll-behavior: smooth;
        }
        #shop-slider::-webkit-scrollbar { display: none; }
        
        .shop-page { 
            min-width: 100vw; height: 100%; flex: 0 0 100vw;
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            grid-template-rows: repeat(4, 1fr); 
            padding: 100px 15px 90px 15px; 
            gap: 10px; 
            scroll-snap-align: start; 
            justify-items: center; align-items: center;
        }

        .item-card { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            position: relative; z-index: 100; 
            touch-action: pan-x pan-y; transform: translateZ(0);
        }
        .item-card img { width: 90px; pointer-events: none; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5)); }
        .clean-tag { font-family: sans-serif; font-weight: 800; font-size: 9px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.9); margin-top: 5px; text-transform: uppercase; text-align: center; }

        .item-card.dragging { 
            position: fixed; z-index: 99999; 
            transform: scale(1.25) rotate(-3deg); opacity: 0.95; 
            pointer-events: none; 
            filter: drop-shadow(0 15px 20px rgba(0,0,0,0.6));
        }
        .item-card.sucked { transform: scale(0) rotate(180deg) !important; opacity: 0 !important; transition: all 0.5s; }

        /* --- 5. UI COMPONENTS --- */
        #app-footer { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; display: flex; align-items: center; justify-content: center; z-index: 20000; pointer-events: none; background: linear-gradient(to top, rgba(0,0,0,0.2), transparent); }
        .footer-logo { width: 150px; cursor: pointer; pointer-events: auto; }

        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 50000; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
        
        .mac-window { 
            width: 90%; max-width: 360px; background: #fff; 
            border: 3px double #000; padding: 0 0 15px 0; 
            box-shadow: 10px 10px 0 rgba(0,0,0,0.6); text-align: center; 
            display: flex; flex-direction: column; align-items: center; 
        }
        .mac-title-bar { width: 100%; background: repeating-linear-gradient(45deg, #ccc, #ccc 2px, #fff 2px, #fff 4px); border-bottom: 2px solid #000; padding: 10px; margin-bottom: 10px; color: #000; font-size: 10px; font-weight: 800; }

        .btn-pixel { 
            background: #000; color: #fff; border: 2px solid #000; 
            padding: 14px; font-family: 'Press Start 2P'; font-size: 10px; 
            cursor: pointer; box-shadow: 4px 4px 0 #888; margin: 6px; 
            width: 85%; text-transform: uppercase; 
        }
        .btn-pixel:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #888; }
        
        /* CHECKOUT INPUTS */
        .checkout-group { width: 85%; display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
        .input-pixel { 
            border: 2px solid #000; padding: 10px; font-family: sans-serif; font-weight: bold; 
            width: 100%; font-size: 12px; background: #eee; border-radius: 0;
        }

        .db-row { display: flex; gap: 4px; width: 95%; margin: 4px 0; align-items: center; justify-content: center; border-bottom: 1px dashed #ccc; padding-bottom: 2px; }
        
        /* --- 6. PC ADAPT --- */
        @media (min-width: 1024px) {
            .loader-brand-img { width: 450px; }
            .pixel-bar-container { width: 300px; height: 24px; }
            header { padding: 30px 60px; }
            .pongo-btn { width: 110px; height: 110px; }
            .shop-page { padding: 160px 120px; gap: 40px; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 1fr); }
            .item-card img { width: 150px; } 
            .mac-window { max-width: 500px; }
            .footer-logo { width: 240px; }
        }
    </style>
</head>
<body>

    <div id="loader-overlay">
        <img src="logo_ff_loader.png" alt="FRIENDLYFIRE" class="loader-brand-img">
        <div class="gif-wrapper"><img id="loader-gif" src="loadernob.gif"></div>
        <div class="loading-area-bottom">
            <div id="loading-txt" class="loading-text">LOADING...</div>
            <div class="pixel-bar-container"><div id="pixel-bar-fill" class="pixel-bar-fill"></div></div>
            <button id="start-btn">START</button>
        </div>
        <div class="loader-footer">
            <img src="mark_c.png" alt="C" class="copyright-mark">
            <div class="copyright-text">Friendlyfire Co. - Made in Italy<br>System V90 - Diego Edition 2026</div>
        </div>
    </div>

    <audio id="sfx-gnam" src="suono_gnam.mp3" preload="auto"></audio>

    <header>
        <img src="mondo_pongo.PNG" class="pongo-btn" onclick="openOv('ov-world')">
        <img src="fuochini_centrali.png" class="pongo-btn" onclick="openOv('ov-profile')">
        <div class="tank-wrapper">
            <img src="tank_header.PNG" class="pongo-btn" id="tank-btn" onclick="openOv('ov-cart')">
            <div id="tank-badge">0</div>
        </div>
    </header>

    <div id="shop-slider">
        <div id="page-1" class="shop-page"></div>
        <div id="page-2" class="shop-page"></div>
        <div id="page-3" class="shop-page"></div>
    </div>

    <footer id="app-footer">
        <img src="brand_name.png" class="footer-logo">
    </footer>

    <div id="ov-cart" class="overlay">
        <div class="mac-window">
            <div class="mac-title-bar">YOUR TANK</div>
            <div id="cart-list" style="max-height:160px; overflow-y:auto; background:#f0f0f0; border:2px solid #000; width:85%; margin:10px auto; padding:8px; font-size:10px; text-align:left;"></div>
            <div style="margin:15px; font-weight:bold; font-size:12px;">TOTAL: <span id="cart-total">0</span>€</div>
            <button class="btn-pixel" onclick="openOv('ov-checkout')">GO TO CHECKOUT</button>
            <button class="btn-pixel" style="background:#555;" onclick="emptyCart()">EMPTY TANK</button>
            <button class="btn-pixel" style="background:transparent; color:#000; border:none; box-shadow:none;" onclick="closeAll()">CLOSE</button>
        </div>
    </div>

    <div id="ov-checkout" class="overlay">
        <div class="mac-window">
            <div class="mac-title-bar">SHIPPING DATA</div>
            <form id="shipping-form" style="width:100%; display:flex; flex-direction:column; align-items:center;">
                <div class="checkout-group">
                    <input type="text" id="ship-name" class="input-pixel" placeholder="NOME E COGNOME" required>
                    <input type="email" id="ship-email" class="input-pixel" placeholder="E-MAIL" required>
                </div>
                <div class="checkout-group">
                    <input type="text" id="ship-address" class="input-pixel" placeholder="INDIRIZZO (Via/Piazza, N. Civico)" required>
                    <div style="display:flex; gap:5px;">
                        <input type="text" id="ship-zip" class="input-pixel" placeholder="CAP" style="width:30%;" required>
                        <input type="text" id="ship-city" class="input-pixel" placeholder="CITTÀ" style="width:70%;" required>
                    </div>
                </div>
                
                <div style="font-size:10px; margin:10px 0;">TOTAL: <span id="checkout-total-display" style="font-weight:bold;">0</span>€</div>
                
                <button type="button" class="btn-pixel" style="background:#5469d4; border-color:#5469d4;" onclick="processStripeRedirect()">
                    PAGA ORA (STRIPE)
                </button>
            </form>
            <button class="btn-pixel" style="background:transparent; color:#000; border:none; box-shadow:none;" onclick="closeAll()">CANCEL</button>
        </div>
    </div>

    <div id="ov-profile" class="overlay">
        <div class="mac-window">
            <div class="mac-title-bar">PILOT PROFILE</div>
            <div style="border:3px solid #000; width:100px; height:100px; margin:10px auto; background:#fff;">
                <img id="profile-img-big" src="" style="width:100%; height:100%; object-fit:cover;">
            </div>
            <div id="avatar-grid" style="display:grid; grid-template-columns:repeat(4,1fr); gap:6px; width:85%; margin:10px auto;"></div>
            <input type="text" class="input-pixel" placeholder="NICKNAME" value="DIEGO" style="width:85%;">
            <button class="btn-pixel" onclick="closeAll()">SAVE PROFILE</button>
        </div>
    </div>

    <div id="ov-world" class="overlay">
        <div class="mac-window">
            <div class="mac-title-bar">WORLD</div>
            <img src="mondo_pongo.PNG" style="width:120px; margin:20px;">
            <button class="btn-pixel" onclick="window.open('https://instagram.com')">INSTAGRAM</button>
            <button class="btn-pixel" onclick="closeAll()">BACK</button>
        </div>
    </div>

    <div id="ov-db" class="overlay">
        <div class="mac-window" style="max-width:95%; height:85vh; justify-content:flex-start;">
            <div class="mac-title-bar">ADMIN DATABASE</div>
            <div style="font-size:8px; color:red; margin-bottom:5px;">INSERISCI PRICE IDs DI STRIPE</div>
            <div id="db-list" style="overflow-y:auto; width:100%; flex-grow:1; border-bottom:2px solid #000; margin-bottom:10px;"></div>
            <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:5px; width:100%;">
                <button class="btn-pixel" style="width:40%; background:#00f;" onclick="addItem()">ADD</button>
                <button class="btn-pixel" style="width:40%; background:#0f0; color:#000;" onclick="saveDB()">SAVE</button>
                <button class="btn-pixel" style="width:40%; background:red;" onclick="resetDB()">RESET</button>
                <button class="btn-pixel" style="width:40%;" onclick="closeAll()">EXIT</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. CHIAVI & DATI ---
        const stripe = Stripe('pk_live_51SyKuT1PjKstwovYOCs5iNC2Ef8sun65gJ2pLXi4pyvfqM9o2Tiaec8NTQuHJEoYVPzDEDsktyZwlSWl6SjMKxzM00i7aB1Yvd');
        
        // Items Default
        const defaultItems = [
            {id: 0, name: 'CAP FIRE', img:'image_cap.PNG', price:45, stripeId: 'INSERISCI_QUI'}, 
            {id: 1, name: 'TEE FLAME', img:'image_tee.PNG', price:65, stripeId: 'INSERISCI_QUI'},
            {id: 2, name: 'CAP BLK', img:'image_cap.PNG', price:45, stripeId: 'INSERISCI_QUI'}, 
            {id: 3, name: 'TEE WHT', img:'image_tee.PNG', price:65, stripeId: 'INSERISCI_QUI'},
            {id: 4, name: 'CAP RED', img:'image_cap.PNG', price:45, stripeId: 'INSERISCI_QUI'}, 
            {id: 5, name: 'TEE LTD', img:'image_tee.PNG', price:85, stripeId: 'INSERISCI_QUI'},
            {id: 6, name: 'CAP V1', img:'image_cap.PNG', price:45, stripeId: ''}, 
            {id: 7, name: 'TEE V1', img:'image_tee.PNG', price:65, stripeId: ''},
            {id: 8, name: 'CAP V2', img:'image_cap.PNG', price:45, stripeId: ''}, 
            {id: 9, name: 'TEE V2', img:'image_tee.PNG', price:65, stripeId: ''},
            {id: 10, name: 'CAP V3', img:'image_cap.PNG', price:45, stripeId: ''}, 
            {id: 11, name: 'TEE V3', img:'image_tee.PNG', price:65, stripeId: ''}
        ];

        let inventory = [];
        let cart = [];
        let dbClicks = 0;
        let autoScrollSpeed = 0; // Per lo scroll automatico

        window.onload = () => {
            loadDB();
            initLoader();
            renderShop();
            renderAvatars();
            startAutoScrollLoop(); // Avvia il motore scroll
        };

        // --- 2. LOADER ---
        function initLoader() {
            let bar = document.getElementById('pixel-bar-fill');
            let w = 0;
            let iv = setInterval(() => {
                w += 2; bar.style.width = w + '%';
                if(w >= 100) {
                    clearInterval(iv);
                    document.getElementById('loading-txt').style.display='none';
                    document.getElementById('start-btn').style.display='block';
                }
            }, 30);
            document.getElementById('start-btn').onclick = () => {
                playSfx();
                let o = document.getElementById('loader-overlay');
                o.style.opacity = '0'; o.style.pointerEvents = 'none';
                setTimeout(() => o.style.display='none', 500);
            };
        }
        function playSfx() { let s = document.getElementById('sfx-gnam'); if(s) { s.currentTime=0; s.play().catch(()=>{}); } }

        // --- 3. LOGICA DATA ---
        function loadDB() {
            try {
                let s = localStorage.getItem('ff_db_v90');
                if(s) inventory = JSON.parse(s);
                else inventory = JSON.parse(JSON.stringify(defaultItems));
            } catch(e) { inventory = JSON.parse(JSON.stringify(defaultItems)); }
        }

        function renderShop() {
            [1,2,3].forEach(n => document.getElementById('page-'+n).innerHTML='');
            inventory.forEach((item, idx) => {
                let page = Math.floor(idx/12) + 1;
                if(page > 3) return;
                let el = document.createElement('div');
                el.className = 'item-card';
                el.id = 'itm-'+idx;
                el.innerHTML = `<img src="${item.img}"><div class="clean-tag">${item.name}</div><div class="clean-tag">${item.price}€</div>`;
                attachLogic(el, item);
                document.getElementById('page-'+page).appendChild(el);
            });
        }

        // --- 4. ENGINE (SCROLL + DRAG + AUTO-SCROLL) ---
        function attachLogic(el, item) {
            let timer = null;
            let isDragging = false;
            let startX = 0, startY = 0;

            const onStart = (e) => {
                if(cart.some(c => c.id === item.id)) return;
                let cx = e.touches ? e.touches[0].clientX : e.clientX;
                let cy = e.touches ? e.touches[0].clientY : e.clientY;
                startX = cx; startY = cy;

                timer = setTimeout(() => {
                    isDragging = true;
                    playSfx();
                    let rect = el.getBoundingClientRect();
                    el.style.width = rect.width + 'px'; el.style.height = rect.height + 'px';
                    el.style.position = 'fixed';
                    el.style.left = (cx - rect.width/2) + 'px'; el.style.top = (cy - rect.height/2) + 'px';
                    el.classList.add('dragging');
                    if(navigator.vibrate) navigator.vibrate(20);
                }, 200);
            };

            const onMove = (e) => {
                let cx = e.touches ? e.touches[0].clientX : e.clientX;
                let cy = e.touches ? e.touches[0].clientY : e.clientY;

                if(!isDragging) {
                    if(Math.abs(cx - startX) > 10 || Math.abs(cy - startY) > 10) clearTimeout(timer);
                    return;
                }
                
                if(e.cancelable) e.preventDefault();
                el.style.left = (cx - el.offsetWidth/2) + 'px';
                el.style.top = (cy - el.offsetHeight/2) + 'px';

                // --- AUTO SCROLL LOGIC ---
                // Se trascini ai bordi, scorre lo slider
                if (cx > window.innerWidth - 60) {
                    autoScrollSpeed = 10; // Destra
                } else if (cx < 60) {
                    autoScrollSpeed = -10; // Sinistra
                } else {
                    autoScrollSpeed = 0; // Ferma
                }
            };

            const onEnd = (e) => {
                clearTimeout(timer);
                autoScrollSpeed = 0; // Stop scroll

                if(isDragging) {
                    isDragging = false;
                    let cx = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
                    let cy = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
                    let tank = document.getElementById('tank-btn');
                    let tr = tank.getBoundingClientRect();
                    
                    if(Math.hypot(cx - (tr.left+tr.width/2), cy - (tr.top+tr.height/2)) < 80) {
                        el.style.left = (tr.left+tr.width/2 - el.offsetWidth/2) + 'px';
                        el.style.top = (tr.top+tr.height/2 - el.offsetHeight/2) + 'px';
                        el.classList.add('sucked'); playSfx(); addToCart(item);
                    } else {
                        el.style.position = ''; el.style.width = ''; el.style.height = ''; 
                        el.style.left = ''; el.style.top = ''; el.classList.remove('dragging');
                    }
                }
            };

            el.addEventListener('touchstart', onStart, {passive:true});
            el.addEventListener('touchmove', onMove, {passive:false});
            el.addEventListener('touchend', onEnd);
            el.addEventListener('mousedown', onStart);
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onEnd);
        }

        // Loop Animazione Scroll
        function startAutoScrollLoop() {
            const loop = () => {
                if (autoScrollSpeed !== 0) {
                    document.getElementById('shop-slider').scrollBy(autoScrollSpeed, 0);
                }
                requestAnimationFrame(loop);
            };
            requestAnimationFrame(loop);
        }

        // --- 5. CART & STRIPE (CON DATI) ---
        function addToCart(item) {
            cart.push(item);
            updateCartUI();
            let b = document.getElementById('tank-badge');
            b.style.transform = 'scale(1.5)'; setTimeout(()=>b.style.transform='scale(1)', 250);
        }

        function updateCartUI() {
            let b = document.getElementById('tank-badge');
            b.innerText = cart.length; b.style.display = cart.length > 0 ? 'block' : 'none';
            let t = cart.reduce((a,c)=>a+c.price,0);
            document.getElementById('cart-total').innerText = t;
            document.getElementById('checkout-total-display').innerText = t;
            let l = document.getElementById('cart-list');
            l.innerHTML = cart.map(i=>`<div style="display:flex; justify-content:space-between; border-bottom:1px dashed #ccc;"><span>${i.name}</span><span>${i.price}€</span></div>`).join('');
        }

        function emptyCart() { cart=[]; updateCartUI(); renderShop(); closeAll(); }

        async function processStripeRedirect() {
            if(cart.length === 0) { alert("TANK VUOTO"); return; }
            
            // Check campi obbligatori form
            const name = document.getElementById('ship-name').value;
            const addr = document.getElementById('ship-address').value;
            const city = document.getElementById('ship-city').value;
            const email = document.getElementById('ship-email').value;

            if(!name || !addr || !city || !email) {
                alert("COMPILA TUTTI I DATI DI SPEDIZIONE!");
                return;
            }

            let lineItems = [];
            for(let item of cart) {
                if(!item.stripeId || item.stripeId.length < 5) {
                    alert(`ERRORE: ${item.name} non ha Price ID. Inseriscilo in Admin.`); return;
                }
                lineItems.push({ price: item.stripeId, quantity: 1 });
            }

            // REDIRECT STRIPE CON RICHIESTA INDIRIZZO
            // customer_email pre-compila la mail
            // shipping_address_collection obbliga l'utente a confermare l'indirizzo su Stripe
            const { error } = await stripe.redirectToCheckout({
                mode: 'payment',
                lineItems: lineItems,
                customerEmail: email, 
                shippingAddressCollection: { allowedCountries: ['IT', 'FR', 'DE', 'ES', 'US'] }, 
                successUrl: window.location.href + '?success=true',
                cancelUrl: window.location.href,
            });

            if(error) alert("STRIPE ERROR: " + error.message);
        }

        // --- 6. ADMIN ---
        document.querySelector('.footer-logo').onclick = () => {
            dbClicks++;
            if(dbClicks >= 5) {
                if(prompt("PWD:")==="FRIENDLYFIRE26") openDB();
                dbClicks=0;
            }
            setTimeout(()=>dbClicks=0, 800);
        };

        function openDB() {
            closeAll(); document.getElementById('ov-db').style.display='flex';
            let l = document.getElementById('db-list'); l.innerHTML = '';
            inventory.forEach((item, i) => {
                l.innerHTML += `
                <div class="db-row">
                    <span style="font-size:8px;">${i}</span>
                    <input id="dn-${i}" value="${item.name}" style="width:50px;">
                    <input id="ds-${i}" value="${item.stripeId}" placeholder="Price ID" style="flex-grow:1;">
                    <input id="dp-${i}" value="${item.price}" type="number" style="width:30px;">
                    <button onclick="delItem(${i})" style="background:red; color:#fff; border:none;">X</button>
                </div>`;
            });
        }
        function addItem() { inventory.push({id:Date.now(), name:'NEW', img:'image_cap.PNG', price:0, stripeId:''}); openDB(); }
        function delItem(i) { inventory.splice(i,1); openDB(); }
        function saveDB() {
            inventory.forEach((t, i) => {
                if(document.getElementById(`dn-${i}`)) {
                    t.name = document.getElementById(`dn-${i}`).value;
                    t.stripeId = document.getElementById(`ds-${i}`).value;
                    t.price = parseInt(document.getElementById(`dp-${i}`).value);
                }
            });
            localStorage.setItem('ff_db_v90', JSON.stringify(inventory));
            location.reload();
        }
        function resetDB() { if(confirm("RESET?")) { localStorage.removeItem('ff_db_v90'); location.reload(); } }

        // --- 7. NAV & UTILS ---
        function openOv(id) { playSfx(); closeAll(); document.getElementById(id).style.display='flex'; if(id==='ov-checkout') updateCartUI(); }
        function closeAll() { document.querySelectorAll('.overlay').forEach(e=>e.style.display='none'); }
        function renderAvatars() {
            let g = document.getElementById('avatar-grid');
            for(let i=0; i<8; i++) {
                let u = `https://api.dicebear.com/7.x/pixel-art/svg?seed=diego${i}`;
                let d = document.createElement('div'); d.style.border='2px solid #000'; d.style.cursor='pointer';
                d.innerHTML=`<img src="${u}" style="width:100%">`;
                d.onclick=()=>{document.getElementById('profile-img-big').src=u; playSfx();};
                if(i===0) d.click(); g.appendChild(d);
            }
        }

        if(window.location.search.includes('success')) {
            alert("ORDINE RICEVUTO! GRAZIE DIEGO.");
            localStorage.removeItem('ff_db_v90'); cart=[]; updateCartUI();
        }
    </script>
</body>
</html>
