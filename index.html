<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friendly Fire - PS1 Big Store</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace; 
        }

        /* TEXTURE CRT GLOBALE (Sempre sopra a tutto) */
        #crt-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 100; 
            pointer-events: none; 
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 3px, 3px 100%;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.95; }
            50% { opacity: 0.85; }
            100% { opacity: 0.95; }
        }

        /* SCHERMATA DI CARICAMENTO E MENU */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background-image: url('momifire.png'); 
            background-size: cover;
            background-position: center;
            display: block;
        }

        /* BARRA DI CARICAMENTO */
        #loading-wrapper {
            position: absolute;
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20; 
        }

        .loading-bar-container {
            display: flex;
            gap: 2px;
            padding: 4px;
            background-color: #2b2b2b;
            background-image: repeating-linear-gradient(45deg, transparent, transparent 2px, #1a1a1a 2px, #1a1a1a 4px);
            border-top: 3px solid #666;
            border-left: 3px solid #666;
            border-bottom: 3px solid #111;
            border-right: 3px solid #111;
        }

        .segment {
            width: 24px;
            height: 32px;
            background-color: #050505;
            border: 1px solid #000;
        }

        .segment.lit-1 { background-color: #630000; }
        .segment.lit-2 { background-color: #990000; }
        .segment.lit-3 { background-color: #cc0000; }
        .segment.lit-4 { background-color: #d82b00; }
        .segment.lit-5 { background-color: #e65c00; }
        .segment.lit-6 { background-color: #f28c00; }
        .segment.lit-7 { background-color: #ffb300; }
        .segment.lit-8 { background-color: #ffcc00; }
        .segment.lit-9 { background-color: #ffe666; }
        .segment.lit-10{ background-color: #fff9b3; }

        /* TASTO START */
        #start-btn {
            display: none; 
            position: absolute;
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20; 
            background: transparent;
            color: #ffffff;
            font-size: 28px;
            font-weight: bold;
            border: none;
            text-shadow: 3px 3px 0px #000; 
            cursor: pointer;
            animation: blink 1s steps(2, start) infinite;
        }

        @keyframes blink {
            to { visibility: hidden; }
        }

        /* MENU PRINCIPALE */
        #main-menu {
            display: none; 
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            flex-direction: column;
            align-items: flex-start; 
            gap: 15px;
        }

        .menu-item {
            color: #ffffff;
            text-decoration: none;
            font-size: 26px;
            font-weight: bold;
            text-shadow: 3px 3px 0px #000;
            text-transform: uppercase;
            position: relative;
            cursor: pointer;
        }

        .menu-item:hover { color: #ffcc00; }
        .menu-item:hover::before {
            content: "▶";
            position: absolute;
            left: -30px;
            top: 2px;
            color: #ffcc00;
        }

        /* =========================================
           STRUTTURA PAGINE BIANCHE (Sub-Menu)
           ========================================= */
        .sub-page {
            display: none; 
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: #000; 
            background-image: url('momifire_bg.png'); 
            background-size: cover;
            background-position: center;
            z-index: 10;
            flex-direction: column;
            align-items: center; /* Centralizza tutto */
            justify-content: flex-start; /* Inizia dall'alto */
            color: #fff; 
            text-shadow: 2px 2px 0px #000;
            padding-top: 20px;
        }

        .bg-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); /* Filtro più scuro */
            z-index: -1;
        }

        .page-header {
            margin-top: 10px;
            margin-bottom: 0px;
            font-size: 36px;
            color: #fff;
            text-align: center;
            width: 100%;
            text-shadow: 4px 4px 0 #000;
            text-transform: uppercase;
        }

        .back-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 20px;
            font-weight: bold;
            background: #111;
            color: #fff;
            padding: 10px 20px;
            border: 2px solid #666;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 4px 4px 0px #000;
        }

        .back-btn:hover {
            background: #ffcc00;
            color: #000;
            border-color: #fff;
        }

        /* =========================================
           LAYOUT DELLO STORE CENTRALIZZATO
           ========================================= */
        .store-layout-centered {
            display: flex;
            flex-direction: column; /* Incolonna gli elementi */
            align-items: center; /* Centralizza gli elementi */
            width: 90%;
            max-width: 600px; /* Ridotto per compattezza centrale */
            gap: 20px; /* Spazio tra viewer e comandi */
            margin-top: 20px;
        }

        /* -- VISORE 3D PS1 STYLE (GRANDE E CENTRALE) -- */
        .viewer-container {
            width: 100%; /* Usa tutta la larghezza del layout */
            height: 480px; /* Molto più grande */
            background: #1a1a1a;
            border: 4px solid #444;
            border-top-color: #888;
            border-left-color: #888;
            box-shadow: inset 0 0 30px #000, 10px 10px 0 rgba(0,0,0,0.8);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .viewer-ui-text {
            position: absolute;
            top: 10px; left: 10px;
            color: #ffcc00;
            font-size: 14px;
        }

        /* CSS 3D Scene (Ingrandita) */
        .scene {
            width: 200px; /* Più larga */
            height: 280px; /* Più alta */
            perspective: 1000px; /* Perspective adjusted for larger scene */
        }

        .torso-3d {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transform: translateZ(-50px); /* adjusted for larger size */
            animation: rotate3D 6s infinite linear;
        }

        @keyframes rotate3D {
            from { transform: translateZ(-50px) rotateY(0deg); }
            to { transform: translateZ(-50px) rotateY(360deg); }
        }

        .face {
            position: absolute;
            border: 1px solid #000;
            background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.1) 0px, rgba(0,0,0,0.1) 2px, transparent 2px, transparent 4px);
            image-rendering: pixelated;
        }

        /* Dimensioni e posizioni delle facce ingrandite */
        .front, .back { width: 200px; height: 280px; }
        .right, .left { width: 100px; height: 280px; left: 50px; }
        .top, .bottom { width: 200px; height: 100px; top: 90px; }

        .front  { transform: rotateY(  0deg) translateZ(50px); }
        .right  { transform: rotateY( 90deg) translateZ(100px); }
        .back   { transform: rotateY(180deg) translateZ(50px); }
        .left   { transform: rotateY(-90deg) translateZ(100px); }
        .top    { transform: rotateX( 90deg) translateZ(140px); }
        .bottom { transform: rotateX(-90deg) translateZ(140px); }

        /* Colori dinamici */
        .item-theme-1 .face { background-color: #d82b00; } /* Felpa Fuoco */
        .item-theme-2 .face { background-color: #222222; } /* T-Shirt Nera */
        .item-theme-3 .face { background-color: #4ade80; } /* Giacca Camo */

        .front::after {
            content: "FF";
            position: absolute;
            top: 40%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 50px; /* Logo più grande */
            font-weight: bold;
            color: rgba(0,0,0,0.5);
            text-shadow: 2px 2px 0 rgba(255,255,255,0.2);
        }

        /* -- PANNELLO CONTROLLI (SOTTO IL VIEWER) -- */
        .controls-container-stacked {
            display: flex;
            flex-direction: column; /* Incolonna i comandi */
            gap: 15px; /* Spazio ridotto */
            width: 100%; /* Usa tutta la larghezza disponibile */
            max-width: 600px;
        }

        .item-selector {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #222;
            border: 2px solid #555;
            padding: 10px;
            box-shadow: 4px 4px 0 #000;
        }

        .item-selector button {
            background: transparent;
            border: none;
            color: #ffcc00;
            font-size: 24px;
            cursor: pointer;
        }
        .item-selector button:hover { color: #fff; }

        #item-name-display {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            text-align: center;
            flex-grow: 1;
            text-transform: uppercase;
        }

        .size-section {
            background: #111;
            padding: 10px;
            border: 2px solid #333;
            box-shadow: 4px 4px 0 #000;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .size-section p { margin: 0; color: #aaa; font-size: 16px; text-transform: uppercase; }

        .size-grid {
            display: flex;
            gap: 5px;
        }

        .size-btn {
            background: #2b2b2b;
            color: #fff;
            border: 2px solid #000;
            border-top-color: #555;
            border-left-color: #555;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 18px;
            width: 40px; height: 35px;
            cursor: pointer;
        }

        .size-btn.active {
            background: #ffcc00;
            color: #000;
            border-color: #fff;
            box-shadow: inset 0 0 8px #cc8800;
        }

        #buy-btn {
            background: #4ade80;
            color: #000;
            font-family: 'Courier New', Courier, monospace;
            font-size: 24px;
            font-weight: bold;
            padding: 12px;
            border: 3px solid #fff;
            border-bottom-color: #1a5e20;
            border-right-color: #1a5e20;
            cursor: pointer;
            text-align: center;
            box-shadow: 5px 5px 0 #000;
            text-transform: uppercase;
        }

        #buy-btn:active {
            transform: translate(3px, 3px);
            box-shadow: 2px 2px 0 #000;
        }

    </style>
</head>
<body>

    <div id="crt-overlay"></div>

    <div id="game-container">
        <div id="loading-wrapper">
            <div class="loading-bar-container" id="loading-bar">
                <div class="segment" id="seg-1"></div>
                <div class="segment" id="seg-2"></div>
                <div class="segment" id="seg-3"></div>
                <div class="segment" id="seg-4"></div>
                <div class="segment" id="seg-5"></div>
                <div class="segment" id="seg-6"></div>
                <div class="segment" id="seg-7"></div>
                <div class="segment" id="seg-8"></div>
                <div class="segment" id="seg-9"></div>
                <div class="segment" id="seg-10"></div>
            </div>
        </div>
        <button id="start-btn">PRESS START</button>
        <nav id="main-menu">
            <div class="menu-item" onclick="openPage('PAGINA-STORE')">STORE</div>
            <div class="menu-item" onclick="openPage('PAGINA-PICTURES')">PICTURES</div>
            <div class="menu-item" onclick="openPage('PAGINA-MUSIC')">MUSIC</div>
            <div class="menu-item" onclick="openPage('PAGINA-CONTACTS')">CONTACTS</div>
        </nav>
    </div>

    <div id="PAGINA-STORE" class="sub-page">
        <div class="bg-overlay"></div>
        <h1 class="page-header">STORE EQUIP.</h1>
        
        <div class="store-layout-centered">
            
            <div class="viewer-container">
                <div class="viewer-ui-text">ITEM_VIEWER_v2.0</div>
                <div class="scene">
                    <div class="torso-3d item-theme-1" id="3d-model">
                        <div class="face front"></div>
                        <div class="face back"></div>
                        <div class="face right"></div>
                        <div class="face left"></div>
                        <div class="face top"></div>
                        <div class="face bottom"></div>
                    </div>
                </div>
            </div>

            <div class="controls-container-stacked">
                <div class="item-selector">
                    <button onclick="changeItem(-1)">◀</button>
                    <div id="item-name-display">FELPA FLAME</div>
                    <button onclick="changeItem(1)">▶</button>
                </div>

                <div class="size-section">
                    <p>SIZE:</p>
                    <div class="size-grid">
                        <button class="size-btn active" onclick="selectSize(this)">S</button>
                        <button class="size-btn" onclick="selectSize(this)">M</button>
                        <button class="size-btn" onclick="selectSize(this)">L</button>
                        <button class="size-btn" onclick="selectSize(this)">XL</button>
                    </div>
                </div>

                <button id="buy-btn" onclick="buyItem()">ACQUISTA</button>
            </div>
        </div>

        <button class="back-btn" onclick="closePage()">BACK</button>
    </div>

    <div id="PAGINA-PICTURES" class="sub-page">
        <div class="bg-overlay"></div>
        <h1 class="page-header">PAGINA PICTURES</h1>
        <button class="back-btn" onclick="closePage()">BACK</button>
    </div>

    <div id="PAGINA-MUSIC" class="sub-page">
        <div class="bg-overlay"></div>
        <h1 class="page-header">PAGINA MUSIC</h1>
        <button class="back-btn" onclick="closePage()">BACK</button>
    </div>

    <div id="PAGINA-CONTACTS" class="sub-page">
        <div class="bg-overlay"></div>
        <h1 class="page-header">PAGINA CONTACTS</h1>
        <button class="back-btn" onclick="closePage()">BACK</button>
    </div>

    <script>
        // Logica di caricamento base
        document.addEventListener("DOMContentLoaded", () => {
            let currentSegment = 1;
            const totalSegments = 10;
            const loadingInterval = setInterval(() => {
                if (currentSegment <= totalSegments) {
                    document.getElementById(`seg-${currentSegment}`).classList.add(`lit-${currentSegment}`);
                    currentSegment++;
                } else {
                    clearInterval(loadingInterval);
                    document.getElementById('loading-wrapper').style.display = 'none';
                    document.getElementById('start-btn').style.display = 'block';
                }
            }, 300); 

            document.getElementById('start-btn').addEventListener('click', () => {
                document.getElementById('start-btn').style.display = 'none';
                document.getElementById('main-menu').style.display = 'flex';
            });
        });

        // Navigazione pagine
        function openPage(pageId) {
            document.getElementById('game-container').style.display = 'none';
            document.getElementById(pageId).style.display = 'flex';
        }

        function closePage() {
            const pages = document.querySelectorAll('.sub-page');
            pages.forEach(p => p.style.display = 'none');
            document.getElementById('game-container').style.display = 'block';
        }

        // ==========================================
        // LOGICA DELLO STORE
        // ==========================================
        
        const storeItems = [
            { name: "FELPA FLAME", themeClass: "item-theme-1" },
            { name: "T-SHIRT NERA", themeClass: "item-theme-2" },
            { name: "GIACCA CAMO", themeClass: "item-theme-3" }
        ];
        
        let currentItemIndex = 0;

        function changeItem(direction) {
            currentItemIndex += direction;
            if (currentItemIndex < 0) currentItemIndex = storeItems.length - 1;
            if (currentItemIndex >= storeItems.length) currentItemIndex = 0;

            const newItem = storeItems[currentItemIndex];
            document.getElementById("item-name-display").innerText = newItem.name;
            const model3D = document.getElementById("3d-model");
            model3D.className = `torso-3d ${newItem.themeClass}`;
        }

        function selectSize(btnElement) {
            const allSizeBtns = document.querySelectorAll('.size-btn');
            allSizeBtns.forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
        }

        function buyItem() {
            const activeSize = document.querySelector('.size-btn.active').innerText;
            const currentItemName = storeItems[currentItemIndex].name;
            alert(`Acquisto simulato: ${currentItemName} (Taglia: ${activeSize}).`);
        }

    </script>
</body>
</html>
