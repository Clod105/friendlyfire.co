<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FRIENDLYFIRE | V33000 FULL DYNAMIC BG</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        /* --- 1. SETTAGGI UNIVERSALI --- */
        :root { 
            --red: #d12525; /* Rosso FriendlyFire */
            --holo-cyan: #00f3ff; 
            --black: #000; 
            --white: #fff;
            --bg-default: #ffffff; /* Sfondo di default diventato bianco, addio verde */
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; outline: none; }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; 
            font-family: 'Press Start 2P', cursive; 
            background-color: var(--bg-default); 
            background-size: cover; background-position: center; background-repeat: no-repeat;
            overscroll-behavior: none; position: fixed; transition: all 0.4s ease;
        }

        /* --- 2. MODALITÀ HOLOGRAM (LAB MODE) --- */
        body.hologram-mode { background-image: none !important; background-color: #050a14 !important; }
        body.hologram-mode::after {
            content: " "; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 255, 255, 0.05) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 6px 100%; pointer-events: none; z-index: 1;
        }
        
        body.hologram-mode .h-btn, body.hologram-mode .brand { filter: grayscale(100%) sepia(100%) hue-rotate(180deg) saturate(500%) brightness(1.5) drop-shadow(0 0 10px #00f3ff) !important; }
        body.hologram-mode .item img { filter: contrast(1.1) !important; }
        body.hologram-mode .window { background: rgba(0, 15, 30, 0.9); border-color: var(--holo-cyan); color: var(--holo-cyan); box-shadow: 0 0 20px rgba(0, 243, 255, 0.2); }
        body.hologram-mode .win-h { background: rgba(0, 243, 255, 0.1); border-bottom: 1px solid var(--holo-cyan); color: var(--holo-cyan); }
        body.hologram-mode .btn { background: transparent !important; border: 1px solid var(--holo-cyan); color: var(--holo-cyan) !important; }
        body.hologram-mode input, body.hologram-mode select, body.hologram-mode textarea { background: transparent; color: var(--holo-cyan); border: 1px solid var(--holo-cyan); }
        body.hologram-mode .magic-img { mix-blend-mode: normal !important; background: transparent !important; filter: drop-shadow(0 0 8px var(--holo-cyan)) contrast(1.15) !important; }

        /* --- 3. LOADER AGGIORNATO --- */
        #loader-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #ffffff; z-index: 2147483647; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; transition: opacity 0.3s ease-out; font-family: 'Arial', sans-serif; }
        
        .loader-logo { width: 80%; max-width: 350px; margin-bottom: 10px; object-fit: contain; }
        .loader-mascots { width: 65vw; max-width: 250px; object-fit: contain; margin-bottom: 30px; }
        
        .loading-text { color: var(--red); font-weight: bold; font-size: 14px; margin-bottom: 8px; }
        .loading-percentage { color: var(--red); font-weight: bold; font-size: 14px; margin-top: 8px; }
        
        .bar-container { width: 70%; max-width: 280px; height: 18px; background: #fff; border: 2px solid #000; border-radius: 20px; padding: 2px; display: flex; align-items: center; }
        .bar-fill { height: 100%; width: 0%; background-color: var(--red); border-radius: 20px; transition: width 0.05s linear; }
        
        #start-btn { visibility: hidden; background: var(--red); color: #fff; border: 2px solid #000; border-radius: 10px; padding: 15px 40px; font-family: 'Arial', sans-serif; font-weight: bold; font-size: 14px; margin-top: 30px; cursor: pointer; text-transform: uppercase; pointer-events: auto !important; position: relative; z-index: 2147483647; }
        #start-btn.visible { visibility: visible; animation: flash 1s infinite alternate; }
        @keyframes flash { from{transform:scale(1)} to{transform:scale(1.05)} }

        .powered-by { position: absolute; bottom: 15px; left: 0; width: 100%; text-align: center; font-size: 6px; color: #666; letter-spacing: 1px; text-transform: uppercase; font-family: 'Press Start 2P', cursive; }

        /* --- 4. HEADER --- */
        header { position: fixed; top: 0; left: 0; width: 100%; height: 100px; z-index: 20000; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; padding-top: env(safe-area-inset-top, 10px); pointer-events: none; }
        .h-btn { width: 65px; height: 65px; object-fit: contain; pointer-events: auto; cursor: pointer; filter: drop-shadow(0 4px 0 rgba(0,0,0,0.5)); transition: filter 0.4s ease, transform 0.1s; }
        .h-btn:active { transform: scale(0.9); }
        .pongo-anim { animation: sq 0.3s; } @keyframes sq { 0%,100%{transform:scale(1);} 50%{transform:scale(0.8);} }
        #tank-wrapper { position: relative; pointer-events: auto; }
        #tank-badge { position: absolute; top: 0; right: -5px; background: var(--red); color: white; border: 2px solid #000; font-size: 9px; padding: 4px; border-radius: 50%; display: none; }

        /* --- 5. SHOP --- */
        #shop-view { width: 100vw; height: 100%; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; padding-top: 110px; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; position: relative; z-index: 10; }
        #shop-view::-webkit-scrollbar { display: none; }
        .shop-page { min-width: 100vw; height: 100%; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr); gap: 10px; padding: 0 15px 120px 15px; scroll-snap-align: start; align-content: start; }

        .item { display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; touch-action: pan-x pan-y; width: 100%; height: 100%; min-height: 100px; cursor: grab; }
        .item:active { cursor: grabbing; }
        .item img { width: 85px; height: 85px; object-fit: contain; pointer-events: none; filter: contrast(1.1) drop-shadow(0 5px 8px rgba(0,0,0,0.3)); transition: filter 0.4s ease; }
        .label { font-family: sans-serif; font-weight: 900; font-size: 8px; color: #fff; text-shadow: 0 1px 2px #000; margin-top: 5px; text-align:center; }
        .sold-out { opacity: 0.4; filter: grayscale(100%); pointer-events: none; cursor: default; }

        /* --- 6. GHOST --- */
        .ghost { position: fixed; z-index: 99999; pointer-events: none; width: 85px !important; height: 85px !important; display: flex; justify-content: center; align-items: center; opacity: 0.9; transform: scale(1.1); filter: drop-shadow(0 15px 15px rgba(0,0,0,0.6)); }
        .ghost img { width: 100% !important; height: 100% !important; object-fit: contain !important; }

        /* --- 7. WINDOWS --- */
        .window { display: none; position: fixed; top: 12%; left: 5%; width: 90%; max-width: 380px; background: #fff; border: 3px solid #000; box-shadow: 10px 10px 0 rgba(0,0,0,0.6); z-index: 50000; flex-direction: column; max-height: 80vh; }
        .win-h { background: #000; color: #fff; border-bottom: 2px solid #000; padding: 12px; cursor: move; display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 10px; }
        .win-x { background: var(--red); width: 20px; height: 20px; border: 1px solid #fff; cursor: pointer; }
        .win-b { padding: 15px; overflow-y: auto; }
        
        .btn { width: 100%; padding: 12px; margin-top: 10px; background: #000; color: #fff; border: 2px solid #000; font-size: 10px; cursor: pointer; font-family: inherit; transition: 0.1s; }
        .btn:active { transform: scale(0.98); background: #333; }
        .btn-red { background: var(--red); color: #fff; border: 2px solid #000; }
        .btn-blue { background: #0044cc; color: #fff; border: 2px solid #000; }
        .btn-white { background: #fff; color: #000; border: 2px solid #000; }
        
        .row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #ccc; padding: 8px 0; font-size: 10px; }
        input, select, textarea { width: 100%; padding: 8px; border: 2px solid #000; background: #fff; color: #000; font-family: monospace; font-size: 10px; }
        textarea { height: 80px; resize: none; margin-top: 10px; font-family: inherit; }

        .magic-img { width: 70%; max-height: 180px; object-fit: contain; mix-blend-mode: multiply; filter: contrast(1.05); transition: 0.3s ease; }

        /* --- 8. FOOTER --- */
        footer { position: fixed; bottom: 0; left: 0; width: 100%; height: 80px; display: flex; justify-content: center; align-items: center; z-index: 12000; pointer-events: none; }
        .brand { width: 160px; pointer-events: auto; cursor: pointer; padding: 20px; transition: filter 0.4s ease; }
    </style>
</head>

    <script>
        const CFG = { 
            u:'https://jwifyapbnsbbpsrstrow.supabase.co', 
            k:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp3aWZ5YXBibnNiYnBzcnN0cm93Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA1NzM1OTUsImV4cCI6MjA4NjE0OTU5NX0.dmhdHZRJuYo7-OlpSR3S5ca7ink9w6a5DM-u2ac4c2Y', 
            ek:'BThMV2knP0VG0s4nr', es:'service_4scv4hn', et:'template_8opoo1v' 
        };
        
        let items=[]; let cart=[], sb=null, taps=0, labBgUrl=''; let adminActive = false;
        let curDetIdx = -1; let curGallery = []; let curGalleryIdx = 0;

        // ANIMAZIONE LOADER DINAMICA
        let perc = 0;
        let loadingInterval = setInterval(() => {
            perc += Math.floor(Math.random() * 3) + 1; // Incremento fluido randomico
            if (perc > 100) perc = 100;
            
            let pEl = document.getElementById('loading-percentage');
            let bEl = document.getElementById('bar-fill');
            
            if(pEl) pEl.innerText = perc + " %";
            if(bEl) bEl.style.width = perc + "%";
            
            if (perc === 100) {
                clearInterval(loadingInterval);
                let btn = document.getElementById('start-btn');
                if(btn) btn.classList.add('visible');
            }
        }, 40);

        async function startApp() {
            let o = document.getElementById('loader-overlay'); 
            o.style.opacity='0'; 
            o.style.pointerEvents='none'; 
            setTimeout(()=>{o.style.display='none'},300);
            
            try{document.getElementById('sfx-eat').play();}catch(e){}
            try{ 
                if(window.supabase){ sb=window.supabase.createClient(CFG.u,CFG.k); await loadDB(); setupRealtime(); } 
                if(window.emailjs) emailjs.init(CFG.ek); 
            }catch(e){ console.error("Errore inizializzazione:", e); }
        }
        
        async function loadDB(){ 
            if(!sb) return; 
            try {
                const{data, error}=await sb.from('products').select('*').order('id'); 
                if(error) throw error;
                if(data){ 
                    let cfg = data.find(x => x.name === 'SYSTEM_CONFIG');
                    if(cfg && cfg.img) {
                        document.body.style.backgroundImage = `url('${cfg.img}')`;
                        if(document.getElementById('bg-in')) document.getElementById('bg-in').value = cfg.img;
                    } else {
                        document.body.style.backgroundImage = "none";
                    }

                    items = data.filter(x => x.name !== 'SYSTEM_CONFIG').map(x=>formatItem(x)); 
                    render(); 
                } 
            } catch(e) {
                console.error("Errore DB:", e);
                alert("Connessione debole, non riesco a caricare i prodotti.");
            }
        }

        async function saveBg() {
            let url = document.getElementById('bg-in').value.trim();
            if(!sb) return alert("Database non connesso");
            try {
                const {error} = await sb.from('products').upsert([{
                    id: 999999,
                    name: 'SYSTEM_CONFIG',
                    img: url,
                    price: 0, qty: 0, sizes: '', desc: 'NON ELIMINARE - GESTISCE LO SFONDO GLOBALE'
                }]);
                if(error) throw error;
                
                document.body.style.backgroundImage = url ? `url('${url}')` : "none";
                alert("✅ Sfondo aggiornato e salvato per tutti i visitatori!");
            } catch(e) {
                alert("Errore salvataggio sfondo: " + e.message);
            }
        }

        function formatItem(x) { 
            return {
                id: x.id, 
                name: x.name || 'Senza Nome', 
                p: x.price || 0, 
                q: x.qty || 0, 
                i: (x.img && typeof x.img === 'string') ? x.img : '', 
                d: x.desc || '', 
                sz: x.sizes || ''
            }; 
        }

        function setupRealtime() {
            if(!sb) return;
            sb.channel('public:products').on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, (payload) => {
                if(payload.new && payload.new.name === 'SYSTEM_CONFIG') {
                    document.body.style.backgroundImage = payload.new.img ? `url('${payload.new.img}')` : "none";
                    if(document.getElementById('bg-in')) document.getElementById('bg-in').value = payload.new.img || '';
                    return; 
                }

                if(payload.eventType === 'INSERT') {
                    if(!items.find(x => x.id === payload.new.id)) items.push(formatItem(payload.new));
                }
                if(payload.eventType === 'UPDATE') { let idx = items.findIndex(x => x.id === payload.new.id); if(idx !== -1) items[idx] = formatItem(payload.new); }
                if(payload.eventType === 'DELETE') {
                    if(payload.old.id === 999999) return;
                    items = items.filter(x => x.id !== payload.old.id);
                }
                render(); 
            }).subscribe();
        }

        function getRealQty(item) {
            if (item.sz && item.sz.includes(':')) { return item.sz.split(',').reduce((tot, part) => { let val = parseInt(part.split(':')[1]); return tot + (isNaN(val) ? 0 : val); }, 0); }
            return parseInt(item.q) || 0;
        }

        function render(){
            const pages = [document.getElementById('page-1'), document.getElementById('page-2'), document.getElementById('page-3')];
            pages.forEach(p => p.innerHTML = ''); 
            items.forEach((item, i) => {
                let pageIdx = Math.floor(i / 9);
                if (pageIdx < pages.length) {
                    let realQty = getRealQty(item); let sold = realQty <= 0;
                    
                    let iStr = item.i.trim();
                    let firstImg = iStr !== '' ? iStr.split(',')[0].trim() : 'https://placehold.co/80?text=NO+IMG';
                    
                    pages[pageIdx].innerHTML += `<div class="item ${sold?'sold-out':''}" id="i-${i}" 
                        ontouchstart="handleTouch(event,${i})" onmousedown="handleMouse(event,${i})">
                        <img src="${firstImg}" onerror="this.src='https://placehold.co/80?text=${item.name}'">
                        <div class="label">${item.name}</div><div class="label">${item.p}€</div>
                    </div>`;
                }
            });
        }

        let lastTap = 0, dragTimer = null, startX=0, startY=0, isDragging = false;
        function handleTouch(e, i) {
            let now = Date.now(); let touch = e.touches[0];
            if (now - lastTap < 350) { e.preventDefault(); clearTimeout(dragTimer); showDetails(i); lastTap = 0; return; }
            lastTap = now; startX = touch.clientX; startY = touch.clientY; isDragging = false;
            dragTimer = setTimeout(() => { isDragging = true; if(navigator.vibrate) navigator.vibrate(20); let el = document.getElementById(`i-${i}`); startGhostDrag(i, el.getBoundingClientRect(), startX, startY); }, 300); 
            let el = document.getElementById(`i-${i}`);
            function onMove(ev) { let t = ev.touches[0]; if (!isDragging && (Math.abs(t.clientX - startX) > 10 || Math.abs(t.clientY - startY) > 10)) { clearTimeout(dragTimer); el.removeEventListener('touchmove', onMove); } }
            function onEnd() { if (!isDragging) clearTimeout(dragTimer); el.removeEventListener('touchmove', onMove); el.removeEventListener('touchend', onEnd); }
            el.addEventListener('touchmove', onMove); el.addEventListener('touchend', onEnd);
        }

        function handleMouse(e, i) {
            let el = document.getElementById(`i-${i}`); el.ondblclick = () => { clearTimeout(dragTimer); showDetails(i); };
            dragTimer = setTimeout(() => { startGhostDrag(i, el.getBoundingClientRect(), e.clientX, e.clientY); }, 250);
            let onUp = () => { clearTimeout(dragTimer); document.removeEventListener('mouseup', onUp); }; document.addEventListener('mouseup', onUp);
        }

        function startGhostDrag(i, rect, inputX, inputY) {
            let g = document.getElementById(`i-${i}`).cloneNode(true); g.className = 'ghost'; 
            let halfW = 42.5; let halfH = 42.5; g.style.left = (inputX - halfW) + 'px'; g.style.top = (inputY - halfH) + 'px';
            document.body.appendChild(g); let offsetX = inputX - rect.left, offsetY = inputY - rect.top, lastEdgeScroll = 0;

            function move(ev) {
                ev.preventDefault(); let cx = ev.type.includes('touch') ? ev.touches[0].clientX : ev.clientX; let cy = ev.type.includes('touch') ? ev.touches[0].clientY : ev.clientY;
                g.style.left = (cx - halfW) + 'px'; g.style.top = (cy - halfH) + 'px';
                let sv = document.getElementById('shop-view'), now = Date.now();
                if (now - lastEdgeScroll > 800) { if (cx > window.innerWidth - 60) { sv.scrollBy({left: window.innerWidth, behavior: 'smooth'}); lastEdgeScroll = now; } else if (cx < 60) { sv.scrollBy({left: -window.innerWidth, behavior: 'smooth'}); lastEdgeScroll = now; } }
            }

            function end(ev) {
                document.removeEventListener('touchmove', move); document.removeEventListener('touchend', end); document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', end);
                let gx = parseInt(g.style.left) + 40, gy = parseInt(g.style.top) + 40; let tk = document.getElementById('tank-target').getBoundingClientRect();
                
                if (Math.hypot(gx - (tk.left + tk.width/2), gy - (tk.top + tk.height/2)) < 60) {
                    g.remove();
                    if (items[i].sz && items[i].sz.includes(':')) { showDetails(i); } else { try{document.getElementById('sfx-eat').play();}catch(e){} cart.push({...items[i], selSize: ''}); upCart(); showWin('win-cart'); } return;
                }
                let ft = document.getElementById('brand-target').getBoundingClientRect();
                if (Math.hypot(gx - (ft.left + ft.width/2), gy - (ft.top + ft.height/2)) < 60) { toggleLabMode(); g.remove(); return; }
                g.style.display='none'; let bel=document.elementFromPoint(gx,gy); g.style.display='flex';
                let trg=bel?bel.closest('.item'):null; if(trg && trg.id!==`i-${i}` && !trg.classList.contains('sold-out')){ let ti=parseInt(trg.id.split('-')[1]); [items[i],items[ti]]=[items[ti],items[i]]; render(); }
                g.remove();
            }
            document.addEventListener('touchmove', move, {passive:false}); document.addEventListener('touchend', end); document.addEventListener('mousemove', move); document.addEventListener('mouseup', end);
        }

        function showDetails(i) {
            curDetIdx = i; let item = items[i];
            
            let iStr = item.i.trim();
            curGallery = iStr !== '' ? iStr.split(',').map(s => s.trim()).filter(Boolean) : ['https://placehold.co/80?text=NO+IMG'];
            curGalleryIdx = 0; updateGalleryUI();
            
            document.getElementById('det-title').innerText = item.name; document.getElementById('det-price').innerText = item.p + " €";
            let sizeCont = document.getElementById('det-size-container'); let sizeSelect = document.getElementById('det-size'); sizeSelect.innerHTML = '';
            let btnAdd = document.getElementById('btn-add-tank');

            if (item.sz && item.sz.includes(':')) {
                sizeCont.style.display = 'block'; let parts = item.sz.split(',').map(s => s.trim().split(':')); let hasAvailable = false;
                parts.forEach(p => { let name = p[0].trim(); let q = parseInt(p[1]); if (q > 0) { sizeSelect.innerHTML += `<option value="${name}">${name} (Disp: ${q})</option>`; hasAvailable = true; } });
                if(!hasAvailable) { sizeSelect.innerHTML = `<option value="">TUTTE LE TAGLIE ESAURITE</option>`; sizeSelect.disabled = true; btnAdd.style.display = 'none'; } else { sizeSelect.disabled = false; btnAdd.style.display = 'block'; }
            } else { sizeCont.style.display = 'none'; btnAdd.style.display = getRealQty(item) > 0 ? 'block' : 'none'; }
            
            let descArea = document.getElementById('det-desc'); descArea.value = item.d || ""; let saveBtn = document.getElementById('btn-save-desc');
            if(adminActive) { descArea.readOnly = false; descArea.style.border = "2px solid blue"; saveBtn.style.display = "block"; } else { descArea.readOnly = true; descArea.style.border = "2px solid #000"; saveBtn.style.display = "none"; }
            showWin('win-details');
        }

        function updateGalleryUI() {
            document.getElementById('det-img').src = curGallery[curGalleryIdx];
            let btnP = document.getElementById('btn-prev-img'); let btnN = document.getElementById('btn-next-img'); let dots = document.getElementById('det-img-dots');
            if (curGallery.length > 1) { btnP.style.display = 'block'; btnN.style.display = 'block'; dots.innerText = (curGalleryIdx + 1) + " / " + curGallery.length; } 
            else { btnP.style.display = 'none'; btnN.style.display = 'none'; dots.innerText = ""; }
        }

        function changeGallery(dir) { curGalleryIdx += dir; if (curGalleryIdx < 0) curGalleryIdx = curGallery.length - 1; if (curGalleryIdx >= curGallery.length) curGalleryIdx = 0; updateGalleryUI(); }

        function addFromDetails() {
            let item = items[curDetIdx]; let sSize = '';
            if (item.sz && item.sz.includes(':')) { let sel = document.getElementById('det-size'); if(!sel.value) return alert("Scegli una taglia!"); sSize = sel.value; }
            try{document.getElementById('sfx-eat').play();}catch(e){} cart.push({...item, selSize: sSize}); upCart(); hideAll(); showWin('win-cart');
        }

        async function saveDesc() {
            if(curDetIdx === -1) return; 
            items[curDetIdx].d = document.getElementById('det-desc').value;
            if(sb && !String(items[curDetIdx].id).startsWith('temp_')) { 
                const { error } = await sb.from('products').update({ desc: items[curDetIdx].d }).eq('id', parseInt(items[curDetIdx].id)); 
                if(error) alert("Errore DB: " + error.message); else alert("Descrizione Aggiornata!"); 
            } 
            hideAll();
        }

        function upCart(){ 
            document.getElementById('tank-badge').innerText=cart.length; document.getElementById('tank-badge').style.display=cart.length?'block':'none'; 
            document.getElementById('cart-list').innerHTML=cart.length?cart.map((x,n)=>`<div class="row"><span>${x.name} ${x.selSize?'- '+x.selSize:''}</span><span>${x.p}€</span><span onclick="cart.splice(${n},1);upCart()" style="color:red;cursor:pointer;font-weight:bold;">X</span></div>`).join(''):"VUOTO"; 
            
            let subtot = cart.reduce((a,b)=>a+parseInt(b.p),0);
            let totale = subtot;
            
            let htmlTot = `SUBTOTALE: ${subtot}€<br>`;
            htmlTot += subtot > 0 ? `SPEDIZIONE: <span style="color:var(--red)">GRATIS</span><br>` : `SPEDIZIONE: 0€<br>`;
            htmlTot += `<span style="font-size:12px; color:var(--red);">TOTALE: ${totale}€</span>`;
            
            document.getElementById('cart-tot').innerHTML = htmlTot; 
        }

        function pay(){ 
            if(!cart.length) return alert("Il Tank è vuoto"); 
            let customerInfo = prompt("Inserisci EMAIL e INDIRIZZO completo per la spedizione:\n(es: mario@mail.com - Via Roma 1)"); 
            if(customerInfo && customerInfo.trim() !== ""){ 
                hideAll(); setTimeout(() => alert("Ordine inoltrato! Controlla la mail."), 150); 
                let total = cart.reduce((a,b)=>a+parseInt(b.p),0);
                let orderItemsStr = cart.map(c => `${c.name} (${c.selSize || 'N/A'})`).join(', ');

                if(sb) { 
                    sb.from('newsletter').insert([{email: customerInfo}]).then(); 
                    sb.from('orders').insert([{ customer_info: customerInfo, items: orderItemsStr, total_price: total }]).then(); 
                } 
                if(window.emailjs) { 
                    emailjs.send(CFG.es, CFG.et, { user_email: customerInfo, message: `NUOVO ORDINE!\nArticoli: ${orderItemsStr}\nTotale (Spedizione Gratuita): ${total}€\nDati Cliente: ${customerInfo}` }).catch(e=>{}); 
                } 
                cart=[]; upCart(); 
            } 
        }

        function sub(){ 
            let m=document.getElementById('nm').value; 
            if(m) { 
                hideAll(); setTimeout(() => alert("Iscritto al Drop!"), 150); 
                if(sb) sb.from('newsletter').insert([{email:m}]).then(({error})=>{ if(error) console.log("Se non salva, disattiva RLS su Supabase!", error.message); }); 
                if(window.emailjs) emailjs.send(CFG.es, CFG.et, { user_email: m, message: "BENVENUTO NEL MONDO FRIENDLYFIRE!" }).catch(e=>{}); 
                document.getElementById('nm').value = ''; 
            } 
        }

        function adminTrigger(){ taps++; if(taps>=3){ if(prompt("PWD")==="FRIENDLYFIRE26") { adminActive=true; showAdm(); } taps=0; } setTimeout(()=>taps=0, 1000); }
        
        function addPic(idx) {
            let url = prompt("Incolla l'URL della foto extra per QUESTO specifico prodotto:");
            if (url && url.trim() !== '') {
                let input = document.getElementById(`i${idx}`); 
                if (input) {
                    let current = input.value.trim();
                    input.value = current ? current + ',' + url.trim() : url.trim();
                    alert("✅ Foto inserita nell'input testuale!\nOra scorri giù e clicca il tasto SALVA SUL DATABASE per confermare.");
                }
            }
        }

        function showAdm(){
            document.getElementById('adm-list').innerHTML=items.map((x,i)=>`
                <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #ccc; padding:5px 0;">
                    
                    <div style="width:30%; display:flex; flex-direction:column; gap:2px;">
                        <input id="i${i}" value="${x.i}" placeholder="URL Img" style="font-size:8px; padding:4px; color:#000;">
                        <button class="btn-blue" style="padding:4px; font-size:8px; font-weight:bold; margin:0;" onclick="addPic(${i})">➕ FOTO EXTRA</button>
                    </div>
                    
                    <input id="n${i}" value="${x.name}" style="width:20%; padding:4px; margin-left:2px; font-size:8px; color:#000;">
                    <input id="p${i}" value="${x.p}" type="number" style="width:10%; padding:4px; margin-left:2px; font-size:8px; color:#000;">
                    <input id="q${i}" value="${x.q}" type="number" placeholder="Qty" style="width:10%; padding:4px; margin-left:2px; font-size:8px; color:#000;">
                    <input id="s${i}" value="${x.sz || ''}" placeholder="S:5,M:0" style="width:20%; font-size:8px; padding:4px; margin-left:2px; color:#000;">
                    
                    <button class="btn-red" style="width:10%; padding:4px; margin-left:2px;" onclick="deleteItem(${i})">X</button>
                </div>`).join('');
            showWin('win-admin');
        }
        
        function addItm(){ 
            items.push({id: 'temp_' + Date.now(), name:'Nuovo Prodotto', p:0, q:1, i:'', d:'', sz:''}); 
            showAdm(); 
            setTimeout(() => { document.getElementById('win-admin').querySelector('.win-b').scrollTo(0, document.body.scrollHeight); }, 100);
        }
        
        async function deleteItem(i) {
            if(!confirm('Eliminare definitivamente?')) return;
            let item = items[i];
            if(item.id && !String(item.id).startsWith('temp_') && sb) { 
                const { error } = await sb.from('products').delete().eq('id', parseInt(item.id)); 
                if(error) { alert("Errore eliminazione: " + error.message); return; } 
            }
            items.splice(i, 1); showAdm(); render();
        }

        async function saveAdm(){ 
            items.forEach((x,i)=>{ 
                let elName = document.getElementById(`n${i}`);
                if(elName){ 
                    x.name = elName.value; 
                    x.p = document.getElementById(`p${i}`).value; 
                    x.i = document.getElementById(`i${i}`).value;
                    x.q = document.getElementById(`q${i}`).value || 0;
                    x.sz = document.getElementById(`s${i}`).value || '';
                } 
            });
            
            if(sb) {
                let nuoviInserimenti = items.filter(x => String(x.id).startsWith('temp_')).map(x => ({
                    name: x.name, price: parseInt(x.p)||0, qty: parseInt(x.q)||0, sizes: x.sz, img: x.i, desc: x.d
                }));
                let aggiornamenti = items.filter(x => !String(x.id).startsWith('temp_')).map(x => ({
                    id: parseInt(x.id), name: x.name, price: parseInt(x.p)||0, qty: parseInt(x.q)||0, sizes: x.sz, img: x.i, desc: x.d
                }));

                try {
                    if(nuoviInserimenti.length > 0) {
                        const {error: err1} = await sb.from('products').insert(nuoviInserimenti);
                        if(err1) throw err1;
                    }
                    if(aggiornamenti.length > 0) {
                        const {error: err2} = await sb.from('products').upsert(aggiornamenti);
                        if(err2) throw err2;
                    }
                    alert("✅ Database aggiornato perfettamente!");
                    await loadDB(); 
                } catch(e) {
                    alert("Errore Salvataggio: " + e.message);
                }
            } else {
                render(); 
            }
            hideAll();
        }

        function toggleLabMode() { document.body.classList.toggle('hologram-mode'); if(navigator.vibrate) navigator.vibrate([50,50,50]); }
        function setBg(isLab){ let val = document.getElementById(isLab ? 'lab-bg-in' : 'bg-in').value; if(isLab) { labBgUrl = val; alert("Lab BG OK"); } else { document.body.style.backgroundImage=`url('${val}')`; } }
        function anim(el){ el.classList.remove('pongo-anim'); void el.offsetWidth; el.classList.add('pongo-anim'); try{document.getElementById('sfx-eat').play();}catch(e){} }
        function showWin(id){ hideAll(); document.getElementById(id).style.display='flex'; }
        function toggleWin(id){ let w=document.getElementById(id); if(w.style.display==='flex') hideAll(); else { showWin(id); upCart(); } }
        function hideAll(){ document.querySelectorAll('.window').forEach(w=>w.style.display='none'); }

        let wDrag=null,wx=0,wy=0;
        function dragWin(e,id){ wDrag=document.getElementById(id); let t=e.touches?e.touches[0]:e, r=wDrag.getBoundingClientRect(); wx=t.clientX-r.left; wy=t.clientY-r.top; function mv(ev){ let c=ev.touches?ev.touches[0]:ev; wDrag.style.left=(c.clientX-wx)+'px'; wDrag.style.top=(c.clientY-wy)+'px'; ev.preventDefault(); } function st(){ document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',st); document.removeEventListener('touchmove',mv); document.removeEventListener('touchend',st); } document.addEventListener('mousemove',mv); document.addEventListener('mouseup',st); document.addEventListener('touchmove',mv,{passive:false}); document.addEventListener('touchend',st); }
    </script>
</body>
</html>
