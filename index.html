<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FRIENDLYFIRE CO.</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://js.stripe.com/v3/"></script>

    <style>
        /* --- 1. CORE & RESET --- */
        :root { --red: #ff3a3a; --bg-pongo: #2e4a1e; --white: #ffffff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; outline: none; touch-action: manipulation; }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; 
            font-family: 'Press Start 2P', cursive; 
            background: var(--bg-pongo) url('sfondo2.jpg') no-repeat center center fixed; 
            background-size: cover; 
            overscroll-behavior: none; position: fixed; 
        }

        /* --- 2. LOADER (BUTTON FIX) --- */
        #loader-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background-color: var(--white); z-index: 999999; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            padding-bottom: 50px;
        }
        .loader-brand-img { width: 280px; max-width: 85%; height: auto; object-fit: contain; margin-bottom: 20px; }
        .gif-wrapper { width: 320px; height: 320px; display: flex; justify-content: center; align-items: center; }
        #loader-gif { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; transform: scale(1.2); }
        
        .loading-area-bottom { 
            display: flex; flex-direction: column; align-items: center; 
            margin-top: 20px; width: 100%; height: 80px; /* Spazio fisso */
            justify-content: flex-start; 
        }
        .loading-text { font-size: 10px; color: #000; margin-bottom: 10px; letter-spacing: 2px; text-transform: uppercase; }
        .pixel-bar-container { width: 200px; height: 18px; background: #fff; border: 3px solid #000; padding: 3px; box-shadow: 6px 6px 0 rgba(0,0,0,0.1); }
        .pixel-bar-fill { height: 100%; width: 0%; background-color: #32cd32; transition: width 0.1s linear; }
        
        #start-btn { 
            display: none; /* NASCOSTO COMPLETAMENTE INIZIALMENTE */
            background: #000; color: #fff; border: 2px solid #000; 
            padding: 16px 40px; font-family: 'Press Start 2P'; font-size: 11px; 
            cursor: pointer; margin-top: 15px; text-transform: uppercase; 
            animation: blink 1s infinite; box-shadow: 5px 5px 0 #999;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }

        .loader-footer { position: absolute; bottom: 20px; width: 100%; text-align: center; display: flex; flex-direction: column; align-items: center; }
        .copyright-mark { width: 35px; height: auto; margin-bottom: 10px; opacity: 0.8; }
        .copyright-text { font-family: Arial, sans-serif; font-weight: bold; font-size: 9px; color: #000; opacity: 0.6; line-height: 1.5; }

        /* --- 3. HEADER & UI --- */
        header { 
            display: flex; justify-content: space-between; align-items: flex-start; 
            padding: 15px 20px; position: absolute; top: 0; left: 0; right: 0; 
            z-index: 2000; pointer-events: none; 
        }
        @keyframes pongo-stretch { 0% { transform: scale(1); } 50% { transform: scale(1.15, 0.85); } 100% { transform: scale(1); } }
        .pongo-btn { 
            width: 75px; height: 75px; object-fit: contain; cursor: pointer; pointer-events: auto; 
            filter: drop-shadow(0 4px 2px rgba(0,0,0,0.4)); transition: transform 0.1s;
        }
        .pongo-btn:active { animation: pongo-stretch 0.4s ease-in-out; }
        .tank-wrapper { position: relative; pointer-events: auto; }
        #tank-badge { position: absolute; top: 0; right: -5px; background: var(--red); color: white; border: 2px solid #000; font-size: 9px; padding: 3px 6px; border-radius: 50%; display: none; z-index: 10003; }

        /* --- 4. SHOP SLIDER (SWAP READY) --- */
        #shop-slider { 
            width: 100vw; height: 100%; display: flex; 
            overflow-x: scroll; overflow-y: hidden;
            scroll-snap-type: x mandatory; 
            -webkit-overflow-scrolling: touch; scroll-behavior: smooth;
            z-index: 1;
        }
        #shop-slider.free-flow { scroll-snap-type: none !important; scroll-behavior: auto !important; }
        #shop-slider::-webkit-scrollbar { display: none; }
        
        .shop-page { 
            min-width: 100vw; height: 100%; flex: 0 0 100vw;
            display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr); 
            padding: 120px 10px 100px 10px; gap: 5px; scroll-snap-align: start; 
            justify-items: center; align-items: center;
        }

        .item-card { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            position: relative; z-index: 100; 
            touch-action: pan-x pan-y; 
            transform: translateZ(0);
            transition: opacity 0.2s;
        }
        .item-card img { width: 95px; pointer-events: none; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5)); }
        .clean-tag { font-family: sans-serif; font-weight: 800; font-size: 9px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.9); margin-top: 5px; text-transform: uppercase; text-align: center; }

        /* GHOST (Oggetto in volo) */
        .ghost-card {
            position: fixed; z-index: 999999; pointer-events: none;
            display: flex; flex-direction: column; align-items: center;
            transform: scale(1.3) rotate(-5deg); opacity: 0.95;
            filter: drop-shadow(0 25px 40px rgba(0,0,0,0.6));
        }
        .ghost-card img { width: 95px; } .ghost-card .clean-tag { display: none; }

        /* --- 5. OVERLAYS --- */
        #app-footer { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; display: flex; align-items: center; justify-content: center; z-index: 20000; pointer-events: none; background: linear-gradient(to top, rgba(0,0,0,0.3), transparent); }
        .footer-logo { width: 160px; cursor: pointer; pointer-events: auto; transition: transform 0.1s; }
        .footer-logo:active { transform: scale(0.95); }

        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 50000; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .mac-window { width: 90%; max-width: 360px; background: #fff; border: 3px double #000; padding: 0 0 15px 0; box-shadow: 15px 15px 0 rgba(0,0,0,0.5); text-align: center; display: flex; flex-direction: column; align-items: center; position: relative; }
        .mac-title-bar { width: 100%; background: repeating-linear-gradient(45deg, #ccc, #ccc 2px, #fff 2px, #fff 4px); border-bottom: 2px solid #000; padding: 10px; margin-bottom: 10px; color: #000; font-size: 10px; font-weight: 800; letter-spacing: 1px; touch-action: none; cursor: move; }
        .draggable-handle { cursor: move; }

        .btn-pixel { background: #000; color: #fff; border: 2px solid #000; padding: 14px; font-family: 'Press Start 2P'; font-size: 9px; cursor: pointer; box-shadow: 4px 4px 0 #888; margin: 6px; width: 85%; text-transform: uppercase; transition: transform 0.1s; }
        .btn-pixel:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #888; }
        .checkout-group { width: 85%; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
        .input-pixel { border: 2px solid #000; padding: 12px; font-family: sans-serif; font-weight: bold; width: 100%; font-size: 11px; background: #eee; border-radius: 0; outline: none; }
        .db-row { display: flex; gap: 4px; width: 95%; margin: 4px 0; align-items: center; justify-content: center; border-bottom: 1px dashed #ccc; padding-bottom: 2px; }
        .size-select { background: #fff; border: 2px solid #000; font-family: sans-serif; font-weight: bold; font-size: 10px; padding: 2px; margin-left: 5px; cursor: pointer; }

        @media (min-width: 1024px) {
            .loader-brand-img { width: 450px; } .gif-wrapper { width: 550px; height: 550px; }
            header { padding: 30px 60px; } .pongo-btn { width: 110px; height: 110px; }
            .shop-page { padding: 160px 120px; gap: 40px; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 1fr); }
            .item-card img { width: 160px; } .ghost-card img { width: 160px; }
            .mac-window { max-width: 500px; } .footer-logo { width: 240px; }
        }
    </style>
</head>
<body>

    <div id="loader-overlay">
        <img src="logo_ff_loader.png" alt="FRIENDLYFIRE" class="loader-brand-img">
        <div class="gif-wrapper"><img id="loader-gif" src="loadernob.gif"></div>
        <div class="loading-area-bottom">
            <div id="loading-txt" class="loading-text">LOADING...</div>
            <div class="pixel-bar-container"><div id="pixel-bar-fill" class="pixel-bar-fill"></div></div>
            <button id="start-btn">START</button>
        </div>
        <div class="loader-footer">
            <img src="mark_c.png" alt="C" class="copyright-mark">
            <div class="copyright-text">Friendlyfire. Made in Italy - Win Alone<br>Powered by Clod. All rights reserved 2024-2034</div>
        </div>
    </div>

    <audio id="sfx-gnam" src="suono_gnam.mp3" preload="auto"></audio>

    <header>
        <img src="mondo_pongo.PNG" class="pongo-btn" onclick="openOv('ov-world')">
        <img src="fuochini_centrali.png" class="pongo-btn" onclick="openOv('ov-profile')">
        <div class="tank-wrapper">
            <img src="tank_header.PNG" class="pongo-btn" id="tank-btn" onclick="openOv('ov-cart')">
            <div id="tank-badge">0</div>
        </div>
    </header>

    <div id="shop-slider">
        <div id="page-1" class="shop-page"></div>
        <div id="page-2" class="shop-page"></div>
        <div id="page-3" class="shop-page"></div>
    </div>

    <footer id="app-footer">
        <img src="brand_name.png" class="footer-logo">
    </footer>

    <div id="ov-cart" class="overlay">
        <div class="mac-window">
            <div class="mac-title-bar draggable-handle">YOUR TANK</div>
            <div id="cart-list" style="max-height:160px; overflow-y:auto; background:#f0f0f0; border:2px solid #000; width:85%; margin:10px auto; padding:8px; font-size:10px; text-align:left;"></div>
            <div style="margin:15px; font-weight:bold; font-size:12px;">TOTAL: <span id="cart-total">0</span>€</div>
            <button class="btn-pixel" onclick="openOv('ov-checkout')">GO TO CHECKOUT</button>
            <button class="btn-pixel" style="background:#555;" onclick="emptyCart()">EMPTY TANK</button>
            <button class="btn-pixel" style="background:transparent; color:#000; border:none; box-shadow:none;" onclick="closeAll()">CLOSE</button>
        </div>
    </div>

    <div id="ov-checkout" class="overlay">
        <div class="mac-window">
            <div class="mac-title-bar draggable-handle">CHECKOUT</div>
            <div id="checkout-items-list" style="width:85%; max-height:100px; overflow-y:auto; background:#fff; border:1px solid #ccc; margin-bottom:10px; padding:5px; text-align:left;"></div>
            <form id="shipping-form" style="width:100%; display:flex; flex-direction:column; align-items:center;">
                <div class="checkout-group">
                    <input type="text" id="ship-name" class="input-pixel" placeholder="FULL NAME" required>
                    <input type="email" id="ship-email" class="input-pixel" placeholder="E-MAIL" required>
                </div>
                <div class="checkout-group">
                    <input type="text" id="ship-address" class="input-pixel" placeholder="ADDRESS" required>
                    <div style="display:flex; gap:5px;">
                        <input type="text" id="ship-city" class="input-pixel" placeholder="CITY" style="width:70%;" required>
                        <input type="text" id="ship-zip" class="input-pixel" placeholder="ZIP" style="width:30%;" required>
                    </div>
                </div>
                <div style="font-size:10px; margin:10px 0;">TOTAL: <span id="checkout-total-display" style="font-weight:bold;">0</span>€</div>
                <button type="button" class="btn-pixel" style="background:#5469d4; border-color:#5469d4;" onclick="processStripeRedirect()">PAY NOW (STRIPE)</button>
            </form>
            <button class="btn-pixel" style="background:transparent; color:#000; border:none; box-shadow:none;" onclick="closeAll()">CANCEL</button>
        </div>
    </div>

    <div id="ov-newsletter" class="overlay">
        <div class="mac-window">
            <div class="mac-title-bar">JOIN THE CLUB</div>
            <p style="font-size:9px; margin:15px; line-height:1.5;">ISCRIVITI PER DROP ESCLUSIVI.</p>
            <form name="newsletter" method="POST" data-netlify="true" style="width:100%; display:flex; flex-direction:column; align-items:center;">
                <input type="hidden" name="form-name" value="newsletter">
                <input type="email" name="email" class="input-pixel" placeholder="E-MAIL" style="width:85%; margin-bottom:10px;" required>
                <button type="submit" class="btn-pixel">SUBSCRIBE</button>
            </form>
            <button class="btn-pixel" style="background:transparent; color:#000; border:none; box-shadow:none;" onclick="closeAll()">CLOSE</button>
        </div>
    </div>

    <div id="ov-profile" class="overlay">
        <div class="mac-window">
            <div class="mac-title-bar">PROFILE</div>
            <div style="border:3px solid #000; width:100px; height:100px; margin:10px auto; background:#fff;">
                <img id="profile-img-big" src="" style="width:100%; height:100%; object-fit:cover;">
            </div>
            <div id="avatar-grid" style="display:grid; grid-template-columns:repeat(4,1fr); gap:6px; width:85%; margin:10px auto;"></div>
            <input type="text" class="input-pixel" placeholder="NICKNAME" value="GUEST" style="width:85%; text-align:center;">
            <button class="btn-pixel" onclick="closeAll()">SAVE</button>
        </div>
    </div>

    <div id="ov-world" class="overlay">
        <div class="mac-window">
            <div class="mac-title-bar">WORLD</div>
            <img src="mondo_pongo.PNG" style="width:120px; margin:20px;">
            <button class="btn-pixel" onclick="window.open('https://instagram.com/friendlyfire')">INSTAGRAM</button>
            <button class="btn-pixel" onclick="openOv('ov-newsletter')">NEWSLETTER</button>
            <button class="btn-pixel" onclick="closeAll()">BACK</button>
        </div>
    </div>

    <div id="ov-db" class="overlay">
        <div class="mac-window" style="max-width:95%; height:85vh; justify-content:flex-start;">
            <div class="mac-title-bar">ADMIN</div>
            <div style="font-size:8px; color:red; margin-bottom:5px;">STRIPE IDs & SIZES</div>
            <div id="db-list" style="overflow-y:auto; width:100%; flex-grow:1; border-bottom:2px solid #000; margin-bottom:10px;"></div>
            <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:5px; width:100%;">
                <button class="btn-pixel" style="width:40%; background:#00f;" onclick="addItem()">ADD</button>
                <button class="btn-pixel" style="width:40%; background:#0f0;" onclick="saveDB()">SAVE</button>
                <button class="btn-pixel" style="width:40%; background:red;" onclick="resetDB()">RESET</button>
                <button class="btn-pixel" style="width:40%;" onclick="closeAll()">EXIT</button>
            </div>
        </div>
    </div>

    <script>
        const stripe = Stripe('pk_live_51SyKuT1PjKstwovYOCs5iNC2Ef8sun65gJ2pLXi4pyvfqM9o2Tiaec8NTQuHJEoYVPzDEDsktyZwlSWl6SjMKxzM00i7aB1Yvd');
        
        const defaultItems = [
            {id:0, name:'CAP FIRE', img:'image_cap.PNG', price:45, stripeId:'', sizes:'ONE SIZE'}, 
            {id:1, name:'TEE FLAME', img:'image_tee.PNG', price:65, stripeId:'', sizes:'S,M,L,XL'},
            {id:2, name:'CAP BLK', img:'image_cap.PNG', price:45, stripeId:'', sizes:'ONE SIZE'},
            {id:3, name:'TEE WHT', img:'image_tee.PNG', price:65, stripeId:'', sizes:'S,M,L,XL'},
            {id:4, name:'CAP RED', img:'image_cap.PNG', price:45, stripeId:'', sizes:'ONE SIZE'},
            {id:5, name:'TEE LTD', img:'image_tee.PNG', price:85, stripeId:'', sizes:'S,M,L,XL'},
            {id:6, name:'CAP V1', img:'image_cap.PNG', price:45, stripeId:'', sizes:'ONE SIZE'},
            {id:7, name:'TEE V1', img:'image_tee.PNG', price:65, stripeId:'', sizes:'S,M,L'},
            {id:8, name:'CAP V2', img:'image_cap.PNG', price:45, stripeId:'', sizes:'ONE SIZE'},
            {id:9, name:'TEE V2', img:'image_tee.PNG', price:65, stripeId:'', sizes:'S,M,L'},
            {id:10, name:'CAP V3', img:'image_cap.PNG', price:45, stripeId:'', sizes:'ONE SIZE'},
            {id:11, name:'TEE V3', img:'image_tee.PNG', price:65, stripeId:'', sizes:'S,M,L'}
        ];

        let inventory = [], cart = [], autoScrollSpeed = 0, dbClicks = 0, scrollLoopId = null;

        window.onload = () => {
            loadDB(); initLoader(); renderShop(); renderAvatars(); 
            initDraggableWindows();
        };

        function initLoader() {
            let bar=document.getElementById('pixel-bar-fill'), w=0;
            let iv=setInterval(()=>{
                w+=3; bar.style.width=w+'%';
                if(w>=100){
                    clearInterval(iv);
                    document.getElementById('loading-txt').style.display='none';
                    // APPARE SOLO ORA
                    document.getElementById('start-btn').style.display='block';
                }
            },30);
            document.getElementById('start-btn').onclick=()=>{
                playSfx(); document.getElementById('loader-overlay').style.display='none';
            };
        }
        function playSfx() { let s = document.getElementById('sfx-gnam'); if(s) { s.currentTime=0; s.play().catch(()=>{}); } }

        function loadDB() {
            try { inventory = JSON.parse(localStorage.getItem('ff_inv_v200')) || JSON.parse(JSON.stringify(defaultItems)); }
            catch(e) { inventory = JSON.parse(JSON.stringify(defaultItems)); }
        }

        function renderShop() {
            [1,2,3].forEach(n => document.getElementById('page-'+n).innerHTML='');
            inventory.forEach((item, idx) => {
                let page = Math.floor(idx/12) + 1;
                if(page > 3) return;
                let el = document.createElement('div');
                el.className = 'item-card';
                el.id = 'itm-'+idx;
                el.innerHTML = `<img src="${item.img}"><div class="clean-tag">${item.name}</div><div class="clean-tag">${item.price}€</div>`;
                attachPhysics(el, item, idx);
                document.getElementById('page-'+page).appendChild(el);
            });
        }

        // --- MOTORE FISICO V200: SWAP, SCROLL & CART ---
        function attachPhysics(el, item, originalIndex) {
            let timer = null, isDragging = false, startX = 0, startY = 0;
            let ghost = null;
            const slider = document.getElementById('shop-slider');

            const onStart = (e) => {
                if(cart.some(c => c.id === item.id)) return;
                let touch = e.touches ? e.touches[0] : e;
                startX = touch.clientX; startY = touch.clientY;

                timer = setTimeout(() => {
                    isDragging = true;
                    if(navigator.vibrate) navigator.vibrate(40);
                    slider.classList.add('free-flow');
                    startAutoScrollLoop();

                    ghost = el.cloneNode(true);
                    ghost.classList.add('ghost-card');
                    ghost.style.left = (startX - 45) + 'px'; 
                    ghost.style.top = (startY - 60) + 'px';
                    document.body.appendChild(ghost);
                    
                    el.style.opacity = '0';
                }, 200);
            };

            const onMove = (e) => {
                let touch = e.touches ? e.touches[0] : e;
                let cx = touch.clientX; let cy = touch.clientY;

                if(!isDragging) {
                    if(Math.abs(cx - startX) > 10 || Math.abs(cy - startY) > 10) clearTimeout(timer);
                    return;
                }

                if(e.cancelable) e.preventDefault();

                if(ghost) {
                    ghost.style.left = (cx - 45) + 'px';
                    ghost.style.top = (cy - 60) + 'px';
                }

                // AUTO SCROLL
                let edge = window.innerWidth * 0.15;
                if (cx > window.innerWidth - edge) autoScrollSpeed = 15;
                else if (cx < edge) autoScrollSpeed = -15;
                else autoScrollSpeed = 0;
            };

            const onEnd = (e) => {
                clearTimeout(timer);
                autoScrollSpeed = 0;
                stopAutoScrollLoop();
                slider.classList.remove('free-flow');

                if(isDragging) {
                    isDragging = false;
                    let touch = e.changedTouches ? e.changedTouches[0] : e;
                    let cx = touch.clientX; let cy = touch.clientY;
                    
                    // 1. CONTROLLO TANK (CARRELLO)
                    let tank = document.getElementById('tank-btn');
                    let tr = tank.getBoundingClientRect();
                    
                    if(Math.hypot(cx - (tr.left+tr.width/2), cy - (tr.top+tr.height/2)) < 80) {
                        if(ghost) {
                            ghost.style.transition = "all 0.4s";
                            ghost.style.left = (tr.left + 10) + 'px';
                            ghost.style.top = (tr.top + 10) + 'px';
                            ghost.style.transform = "scale(0)";
                            setTimeout(() => {
                                if(ghost) ghost.remove();
                                playSfx();
                                let sizes = item.sizes ? item.sizes.split(',') : ['ONE SIZE'];
                                addToCart({...item, selectedSize: sizes[0]});
                            }, 350);
                        }
                        return;
                    } 
                    
                    // 2. CONTROLLO SWAP (SCAMBIO VESTITI)
                    // Trova l'elemento sotto al dito (nascondendo il ghost momentaneamente)
                    if(ghost) ghost.style.display = 'none';
                    let elemBelow = document.elementFromPoint(cx, cy);
                    if(ghost) ghost.style.display = 'flex';

                    let targetCard = elemBelow ? elemBelow.closest('.item-card') : null;

                    if (targetCard && targetCard !== el) {
                        let targetId = targetCard.id.split('-')[1]; // itm-5 -> 5
                        let targetIndex = parseInt(targetId);
                        
                        // ESEGUI LO SCAMBIO NEL DB
                        if(!isNaN(targetIndex)) {
                            let temp = inventory[originalIndex];
                            inventory[originalIndex] = inventory[targetIndex];
                            inventory[targetIndex] = temp;
                            
                            // Salva e Ricarica
                            localStorage.setItem('ff_inv_v200', JSON.stringify(inventory));
                            if(ghost) ghost.remove();
                            renderShop(); // Ridisegna tutto con le nuove posizioni
                            return;
                        }
                    }

                    // 3. RITORNO ALLA BASE (SE NESSUNA AZIONE)
                    if(ghost) ghost.remove();
                    el.style.opacity = '1';
                }
            };

            el.addEventListener('touchstart', onStart, {passive:true});
            window.addEventListener('touchmove', onMove, {passive:false});
            window.addEventListener('touchend', onEnd);
            el.addEventListener('mousedown', onStart);
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onEnd);
        }

        function startAutoScrollLoop() {
            if(scrollLoopId) return;
            const loop = () => {
                if (autoScrollSpeed !== 0) {
                    document.getElementById('shop-slider').scrollLeft += autoScrollSpeed;
                }
                scrollLoopId = requestAnimationFrame(loop);
            };
            scrollLoopId = requestAnimationFrame(loop);
        }
        function stopAutoScrollLoop() { if(scrollLoopId) { cancelAnimationFrame(scrollLoopId); scrollLoopId = null; } }

        function initDraggableWindows() {
            document.querySelectorAll('.draggable-handle').forEach(h => {
                const win = h.closest('.mac-window');
                let isDrag=false, startX, startY;
                const start=(e)=>{
                    isDrag=true;
                    let r = win.getBoundingClientRect();
                    win.style.position='absolute'; win.style.margin='0';
                    win.style.left=r.left+'px'; win.style.top=r.top+'px';
                    let t = e.touches?e.touches[0]:e;
                    startX=t.clientX-r.left; startY=t.clientY-r.top;
                };
                const move=(e)=>{
                    if(!isDrag)return; e.preventDefault();
                    let t = e.touches?e.touches[0]:e;
                    win.style.left=(t.clientX-startX)+'px'; win.style.top=(t.clientY-startY)+'px';
                };
                const end=()=>{isDrag=false;};
                h.addEventListener('mousedown',start); window.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
                h.addEventListener('touchstart',start,{passive:false}); window.addEventListener('touchmove',move,{passive:false}); window.addEventListener('touchend',end);
            });
        }

        function addToCart(item) {
            cart.push(JSON.parse(JSON.stringify(item))); 
            updateCartUI();
            let b=document.getElementById('tank-badge');
            b.style.transform='scale(1.5)'; setTimeout(()=>b.style.transform='scale(1)', 250);
        }

        function updateSize(index, newSize) { cart[index].selectedSize = newSize; }

        function updateCartUI() {
            let b = document.getElementById('tank-badge');
            b.innerText = cart.length; b.style.display = cart.length > 0 ? 'block' : 'none';
            let t = cart.reduce((a,c)=>a+c.price,0);
            document.getElementById('cart-total').innerText = t;
            document.getElementById('checkout-total-display').innerText = t;
            
            document.getElementById('cart-list').innerHTML = cart.map(i=>
                `<div style="display:flex; justify-content:space-between; border-bottom:1px dashed #ccc;">
                    <span>${i.name}</span><span>${i.price}€</span>
                </div>`
            ).join('');

            const coList = document.getElementById('checkout-items-list');
            if(coList) {
                coList.innerHTML = cart.map((item, idx) => {
                    let sizes = item.sizes ? item.sizes.split(',') : ['ONE SIZE'];
                    let options = sizes.map(s => `<option value="${s}" ${s===item.selectedSize?'selected':''}>${s}</option>`).join('');
                    return `
                    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px dashed #ccc; padding:3px 0;">
                        <span style="font-size:9px;">${item.name}</span>
                        <select class="size-select" onchange="updateSize(${idx}, this.value)">${options}</select>
                        <span style="font-size:9px;">${item.price}€</span>
                    </div>`;
                }).join('');
            }
        }

        function emptyCart() { cart=[]; updateCartUI(); renderShop(); closeAll(); }

        async function processStripeRedirect() {
            if(cart.length===0) { alert("TANK EMPTY"); return; }
            const name = document.getElementById('ship-name').value;
            const email = document.getElementById('ship-email').value;
            const addr = document.getElementById('ship-address').value;
            if(!name || !email || !addr) { alert("FILL ALL DATA!"); return; }

            let lineItems = [];
            for(let item of cart) {
                if(!item.stripeId || item.stripeId.length<5) { alert("ERROR: MISSING PRICE ID FOR " + item.name); return; }
                lineItems.push({ price: item.stripeId, quantity: 1 });
            }

            const { error } = await stripe.redirectToCheckout({
                mode: 'payment',
                lineItems: lineItems,
                customerEmail: email,
                shippingAddressCollection: { allowedCountries: ['IT','US','FR','DE','ES'] },
                successUrl: window.location.href + '?success=true',
                cancelUrl: window.location.href,
            });

            if(error) alert(error.message);
        }

        document.querySelector('.footer-logo').onclick=()=>{
            dbClicks++; if(dbClicks>=5){if(prompt("KEY")==="FRIENDLYFIRE26")openDB(); dbClicks=0;}
            setTimeout(()=>dbClicks=0,800);
        };
        function openDB(){
            closeAll(); document.getElementById('ov-db').style.display='flex';
            let l=document.getElementById('db-list'); l.innerHTML='';
            inventory.forEach((i,x)=>l.innerHTML+=`
                <div class="db-row">
                    <span>${x}</span>
                    <input id="dn-${x}" value="${i.name}" style="width:40px;" placeholder="Name">
                    <input id="ds-${x}" value="${i.stripeId}" style="flex-grow:1;" placeholder="Price ID">
                    <input id="dz-${x}" value="${i.sizes||'ONE SIZE'}" style="width:50px;" placeholder="S,M,L">
                    <input id="dp-${x}" value="${i.price}" type="number" style="width:30px;" placeholder="€">
                    <button onclick="delItem(${x})" style="background:red; color:#fff;">X</button>
                </div>`);
        }
        function addItem(){inventory.push({id:Date.now(),name:'NEW',img:'image_cap.PNG',price:0,stripeId:'',sizes:'S,M,L'});openDB();}
        function delItem(i){inventory.splice(i,1);openDB();}
        
        function saveDB(){
            inventory.forEach((t,i)=>{
                if(document.getElementById(`dn-${i}`)){
                    t.name = document.getElementById(`dn-${i}`).value;
                    t.stripeId = document.getElementById(`ds-${i}`).value;
                    t.sizes = document.getElementById(`dz-${i}`).value;
                    t.price = parseInt(document.getElementById(`dp-${i}`).value);
                }
            });
            localStorage.setItem('ff_inv_v200',JSON.stringify(inventory)); 
            alert("SAVED!"); location.reload();
        }
        function resetDB(){localStorage.removeItem('ff_inv_v200');location.reload();}
        
        function openOv(id){
            playSfx(); closeAll(); 
            let o=document.getElementById(id); o.style.display='flex';
            let w=o.querySelector('.mac-window'); 
            if(w){w.style.position='relative';w.style.left='auto';w.style.top='auto';}
            if(id==='ov-checkout') updateCartUI();
        }
        function closeAll(){document.querySelectorAll('.overlay').forEach(e=>e.style.display='none');}
        
        function renderAvatars(){
            let g=document.getElementById('avatar-grid');
            for(let i=0;i<8;i++){
                let u=`https://api.dicebear.com/7.x/pixel-art/svg?seed=ff${i}`;
                let d=document.createElement('div'); d.style.border='2px solid #000';
                d.innerHTML=`<img src="${u}" style="width:100%">`;
                d.onclick=()=>{document.getElementById('profile-img-big').src=u;playSfx();};
                if(i===0)d.click(); g.appendChild(d);
            }
        }
        if(window.location.search.includes('success')){
            alert("ORDER CONFIRMED. WELCOME TO THE FAMILY.");
            localStorage.removeItem('ff_inv_v200'); cart=[]; updateCartUI();
        }
    </script>
</body>
